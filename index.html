/* ===================== match addressing =====================
     g:<group>:<matchNo> | t:<code> | l:<which>:<index>            */
function getMatch(ref){
  const p=ref.split(':');
  if(p[0]==='g'){ const G=S.groups[p[1]]; return G?G.matches.find(m=>m.n===+p[2]):null; }
  if(p[0]==='t') return S.ko[p[1]]||null;
  if(p[0]==='l') return (p[1]==='diamond'?S.diamond:S.platinum)[+p[2]]||null;
  return null;
}
function matchTitle(ref){
  const p=ref.split(':');
  if(p[0]==='g') return 'Group '+p[1]+' · Match '+p[2];
  if(p[0]==='t'){
    const c=p[1];
    const r=ROUNDS().find(rd=>rd.ties.some(t=>t[0]===c));
    if(r) return r.label.replace(/s$/,'')+' '+c;
    if(GOLD_DECIDERS.indexOf(c)>=0) return 'Gold decider '+c;
    if(GOLD_TIES().some(t=>t[0]===c)) return 'Gold tie '+c;
    return 'Tie '+c;
  }
  return (p[1]==='diamond'?'Diamond':'Platinum')+' league · Round '+(+p[2]+1);
}
function matchCourt(ref){
  const p=ref.split(':');
  if(p[0]!=='g') return 'Finals court';
  const m=getMatch(ref);
  return courtName(p[1], (m&&m.c)||0);
}

/* a pair name is "One | Two" — split it for the court diagram */
function playersOf(name){
  const parts=String(name||'').split('|').map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2) return [parts[0],parts[1]];
  if(parts.length===1) return [parts[0],'—'];
  return ['—','—'];
}

/* ===================== pickleball doubles scoring =====================
   Side-out doubles (§4.B). Only the serving side can score. The server always
   delivers from the right when their own score is even, so the two partners
   swap sides each time they score and the geometry follows the score by itself.
   Losing the rally passes the serve to the partner (first server) or across the
   net (second server). The opening serve of a game has only one server, so the
   first fault is an immediate side-out.

   m.log holds one entry per rally — 'a' or 'b', whoever WON it. Everything else
   here is derived, so Undo is exact and the score can never drift out of step
   with the court positions. */
function replayPB(m){
  const log=m.log||[];
  const first=(m.server==='b')?'b':'a';
  // pos[team] = [index of the player standing right, index standing left]
  const pos={ a:(m.posA===1?[1,0]:[0,1]), b:(m.posB===1?[1,0]:[0,1]) };
  let a=0,b=0, serving=first;
  let who=pos[first][0];        // the chosen starting server stands on the right at 0
  log.forEach(w=>{
    if(w==='a')a++; else b++;                       // rally scoring: every rally is a point
    if(w===serving){
      pos[serving]=[pos[serving][1],pos[serving][0]];   // partners swap, same player serves on
    } else {
      serving=w;                                        // serve crosses with the point
      const sc=(serving==='a')?a:b;
      who=pos[serving][sc%2===0?0:1];                   // whoever stands on the correct side
    }
  });
  return { a,b,serving,pos, serverIdx:who,
           servePos:(pos[serving][0]===who?'R':'L'), rallies:log.length };
}
/* Game to 15 and it must be won by two — but the two-point rule is capped.
   Once both sides reach 17 the next rally decides it, so no score can pass 18
   and 18-17 is the golden point. */
const gameOver=(a,b)=>
  ((a>=TARGET||b>=TARGET) && Math.abs(a-b)>=WIN_BY) || a>=CAP || b>=CAP;
const isGolden=(a,b)=>a>=GOLDEN&&b>=GOLDEN&&!gameOver(a,b);
/* a side is on game point when winning the next rally would end the match */
function gamePointSides(a,b){
  if(gameOver(a,b)) return [];
  const out=[];
  if(gameOver(a+1,b)) out.push('a');
  if(gameOver(a,b+1)) out.push('b');
  return out;
}

/* ---------- console state ---------- */
function openRef(ref){
  const m=getMatch(ref);
  if(!m||!m.a||!m.b) return toast('Both teams must be known first');
  if(!canScore()) return toast('Unlock scoring first');
  if(m.log==null && played(m) && !confirm('This match already has a typed score of '+m.sa+'–'+m.sb+
     '. Opening the referee console starts it again from 0–0. Continue?')) return;
  m.server=m.server||'a'; m.posA=m.posA||0; m.posB=m.posB||0;
  m.startLeft=m.startLeft||'a'; m.invert=!!m.invert;
  if(m.log==null) m.log=[];
  S.ref=ref; document.body.classList.add('reflock'); save(); renderRef();
}
function closeRef(){ S.ref=null; document.body.classList.remove('reflock');
  document.getElementById('refRoot').innerHTML=''; render(); }
function refPoint(side){
  const m=getMatch(S.ref); if(!m) return;
  const st=replayPB(m); if(gameOver(st.a,st.b)) return;
  m.log=(m.log||[]).concat([side]);
  const n=replayPB(m); m.sa=n.a; m.sb=n.b;
  save(); renderRef();
}
function refMinus(side){
  const m=getMatch(S.ref); if(!m||!(m.log||[]).length) return;
  // walk back to the last rally that gave this side a point
  const log=m.log.slice();
  for(let i=log.length;i>0;i--){
    const trial=Object.assign({},m,{log:log.slice(0,i-1)});
    const before=replayPB(trial), after=replayPB(Object.assign({},m,{log:log.slice(0,i)}));
    if(after[side]>before[side]){ m.log=log.slice(0,i-1); break; }
  }
  const n=replayPB(m); m.sa=n.a; m.sb=n.b; save(); renderRef();
}
function refUndo(){
  const m=getMatch(S.ref); if(!m||!(m.log||[]).length) return;
  m.log=m.log.slice(0,-1);
  const n=replayPB(m); m.sa=n.a; m.sb=n.b; save(); renderRef();
}
function refSetServer(s){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  m.server=s; save(); renderRef(); }
function refSwapSides(){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  m.startLeft=(m.startLeft==='a')?'b':'a'; save(); renderRef(); }
function refFlipPos(team){ const m=getMatch(S.ref); if(!m||(m.log||[]).length)return;
  if(team==='a') m.posA=m.posA?0:1; else m.posB=m.posB?0:1; save(); renderRef(); }
function refInvert(){ const m=getMatch(S.ref); if(!m)return; m.invert=!m.invert; save(); renderRef(); }
function refClear(){
  const m=getMatch(S.ref); if(!m)return;
  if(!confirm('Clear this match back to 0–0?'))return;
  m.log=[]; m.sa=null; m.sb=null; save(); renderRef();
}
function refFinish(){
  const m=getMatch(S.ref); if(!m)return;
  const st=replayPB(m);
  if(!(m.log||[]).length){ m.sa=null;m.sb=null;m.log=null; save(); toast('Closed — nothing recorded'); return closeRef(); }
  m.sa=st.a; m.sb=st.b; save(); toast('Saved · '+st.a+'–'+st.b); closeRef();
}

/* ---------- console render ---------- */
/* a pickleball — yellow with its perforations */
const BALL='<svg class="ball" width="16" height="16" viewBox="0 0 24 24" aria-label="serving">'+
  '<circle cx="12" cy="12" r="10.5" fill="#fde047" stroke="#a16207" stroke-width="1.4"/>'+
  '<g fill="#a16207" opacity=".85"><circle cx="8.4" cy="7.6" r="1.5"/><circle cx="15.6" cy="7.6" r="1.5"/>'+
  '<circle cx="12" cy="12" r="1.5"/><circle cx="6.6" cy="14" r="1.4"/><circle cx="17.4" cy="14" r="1.4"/>'+
  '<circle cx="12" cy="18.3" r="1.4"/></g></svg>';
function cboxHTML(m,teamKey,posSide,st,over){
  const idx=st.pos[teamKey][posSide==='R'?0:1];
  const nm=playersOf(teamKey==='a'?m.a:m.b)[idx];
  const isServer=st.serving===teamKey&&st.servePos===posSide&&!over;
  return `<div class="cbox ${over?'locked':''} ${isServer?'serving':''}"
      ${over?'':`onclick="refPoint('${teamKey}')"`}>
    <div class="posTag">${posSide==='R'?'Right / even':'Left / odd'}</div>
    <div class="pSlot">${isServer?BALL:''}
      <span class="sl">${teamKey.toUpperCase()}${idx+1}</span>
      <span class="pn">${esc(nm)}</span></div>
    ${isServer?`<div class="servetag">serving from the ${posSide==='R'?'right':'left'}</div>`:''}
  </div>`;
}
function renderRef(){
  if(!S.ref){ document.getElementById('refRoot').innerHTML=''; return; }
  const ref=S.ref, m=getMatch(ref);
  if(!m){ closeRef(); return; }
  const st=replayPB(m), over=gameOver(st.a,st.b), gps=gamePointSides(st.a,st.b);
  const fresh=!(m.log||[]).length;
  const lead=Math.max(st.a,st.b), ends=lead>=SWITCH_AT;

  /* left/right follow where the teams actually stand, so the referee always
     taps the side of the court the team is on */
  let leftK=(m.startLeft==='a')?'a':'b';
  if(ends) leftK=(leftK==='a')?'b':'a';
  if(m.invert) leftK=(leftK==='a')?'b':'a';
  const rightK=(leftK==='a')?'b':'a';
  const nameOf=k=>k==='a'?m.a:m.b;
  const scoreOf=k=>k==='a'?st.a:st.b;
  const colOf=k=>k==='a'?'var(--cyan)':'var(--violet)';

  let h=`<div class="refWrap"><div class="refInner">
    <div class="refTop"><button class="iconbtn" onclick="refFinish()">✕</button>
      <div class="ttl">${esc(matchTitle(ref))}
        <div class="sub2">${esc(matchCourt(ref))} · rally scoring · ${esc(rulesShort())}</div></div></div>`;

  if(over){
    const lo=Math.min(st.a,st.b), w=st.a>st.b?m.a:m.b;
    h+=`<div class="gamept win">🏆 ${esc(w)} win ${lead}–${lo}${
      lead===CAP&&lo===GOLDEN?' on the golden point':''}</div>`;
  } else if(isGolden(st.a,st.b)){
    h+=`<div class="gamept golden">⚡ <b>Golden point</b> — the next rally wins the match at ${CAP}–${GOLDEN}.</div>`;
  } else if(gps.length){
    h+=`<div class="gamept">Game point · ${gps.map(k=>esc(nameOf(k))).join(' &amp; ')}</div>`;
  }

  h+=`<div class="scorestrip">
    <div class="sTeam"><div class="stripe" style="background:${colOf(leftK)}"></div>
      <div class="nm2">${esc(nameOf(leftK))}</div>
      <div class="num" style="color:${colOf(leftK)}">${scoreOf(leftK)}</div></div>
    <div class="phasebox"><div class="cv">${over?'—':(st.serving===leftK?BALL+'<span>◀</span>':'<span>▶</span>'+BALL)}</div>
      <div class="cl">Serve</div></div>
    <div class="sTeam right"><div class="stripe" style="background:${colOf(rightK)}"></div>
      <div class="nm2">${esc(nameOf(rightK))}</div>
      <div class="num" style="color:${colOf(rightK)}">${scoreOf(rightK)}</div></div></div>`;

  /* pre-match set-up — locks the moment the first rally is recorded */
  if(fresh && !over){
    h+=`<div class="tossbar"><span class="eyebrow">Serves first</span>
      ${[leftK,rightK].map(k=>`<button class="btn sm ${m.server===k?'acc':''}"
        onclick="refSetServer('${k}')">${m.server===k?'● ':''}${esc(nameOf(k))}</button>`).join('')}
      <span class="dimtxt">first server starts on the right</span></div>`;
    h+=`<div class="tossbar"><span class="eyebrow">Court sides</span>
      <span style="font-size:12px;font-weight:700">${esc(nameOf(leftK))} <span class="dimtxt">left</span>
        &nbsp;·&nbsp; ${esc(nameOf(rightK))} <span class="dimtxt">right</span></span>
      <button class="btn sm" onclick="refSwapSides()">⇄ Swap</button>
      <span class="dimtxt">set this to match where the teams actually stand</span></div>`;
    h+=`<div class="tossbar"><span class="eyebrow">Starting positions</span>
      ${[leftK,rightK].map(k=>{
        const idx=st.pos[k][0];
        return `<span style="font-size:11.5px;font-weight:700">${esc(nameOf(k))}
          <span class="dimtxt">${esc(playersOf(nameOf(k))[idx])} right</span>
          <button class="btn sm" onclick="refFlipPos('${k}')">⇄</button></span>`;}).join('')}
      <span class="dimtxt">the pair chooses its starting server</span></div>`;
  }

  h+=`<div class="court">
    <div class="half a">${cboxHTML(m,leftK,'L',st,over)}${cboxHTML(m,leftK,'R',st,over)}
      <div class="kitchen"></div><div class="taphint">${over?'':'tap = +1 '}${esc(nameOf(leftK))}</div></div>
    <div class="net"></div>
    <div class="half b">${cboxHTML(m,rightK,'R',st,over)}${cboxHTML(m,rightK,'L',st,over)}
      <div class="kitchen"></div><div class="taphint">${over?'':'tap = +1 '}${esc(nameOf(rightK))}</div></div>
  </div>`;

  h+=`<div class="endsnote">
    <span>${ends?`⇄ Ends changed at ${SWITCH_AT} — ${esc(nameOf(leftK))} now on the left`:''}</span>
    <button class="btn sm ${m.invert?'acc':''}" onclick="refInvert()">⇄ ${m.invert?'View flipped':'Flip my view'}</button></div>`;

  h+=`<div class="ctrls">${[leftK,rightK].map(k=>`
    <div class="ctrlrow">
      <button class="rbtn" onclick="refMinus('${k}')" ${scoreOf(k)===0?'disabled':''}>−</button>
      <div class="tl">${esc(nameOf(k))}</div>
      <button class="rbtn plus" onclick="refPoint('${k}')" ${over?'disabled':''}
        style="background:${colOf(k)}">+</button></div>`).join('')}</div>`;

  h+=`<div class="row" style="margin-bottom:10px">
    <button class="btn" onclick="refUndo()" ${(m.log||[]).length?'':'disabled'}>↶ Undo last rally</button>
    <button class="btn dgr" onclick="refClear()">Clear</button>
    <button class="btn acc" style="flex:1" onclick="refFinish()">Save &amp; close</button></div>`;

  h+=`<div class="card" style="padding:12px">
    <div class="eyebrow" style="margin-bottom:6px">Reading the court</div>
    <p class="note" style="margin:0"><b>Rally scoring</b> — every rally is a point, whoever served.
    Tap the half of the court belonging to the side that won it. If the receiving side wins, the serve
    crosses with the point. The ball marks the server, who always serves from the right when their own
    score is even, so partners swap sides each time they hold serve.</p>
    <p class="note" style="margin:8px 0 0">${esc(rulesPara())} ${st.rallies} ${st.rallies===1?'rally':'rallies'} recorded — ${st.a}+${st.b}=${st.a+st.b}.</p></div>`;

  h+=`</div></div>`;
  document.getElementById('refRoot').innerHTML=h;
}
/* ===================== score entry focus =====================
   The original Tab bug came from repainting during the browser's own Tab
   handling: `change` fires while focus is in flight, so the box Tab was
   travelling to had already been replaced. The cure was to stop repainting
   during entry — but that left everything derived from a score (standings,
   who advances, the champion) stale until the caret left the box.

   So the repaint is back, on `input` rather than `change`. No input event
   fires while Tab moves focus, so there is no race to lose; and render()
   now puts the caret back exactly where it was, which makes a repaint
   invisible to whoever is typing. */
let pointerDown=false;
const inScoreBox=()=>{ const a=document.activeElement;
  return !!(a&&a.classList&&a.classList.contains('sc')); };

function scoreInput(el){
  const bits=el.dataset.k.split(':'), fld=bits[bits.length-1], ref=bits.slice(0,-1).join(':');
  const m=getMatch(ref); if(!m) return;
  let v=el.value===''?null:Math.max(0,parseInt(el.value,10)||0);
  const top=maxScore();
  if(v!=null&&v>top){ v=top; el.value=String(top); }   // nothing can pass the cap
  if(m[fld]===v) return;
  m[fld]=v; m.log=null;                 // a typed score replaces any rally record
  save();
  render();                             // everything downstream catches up at once
}
/* Enter behaves like Tab — phone keyboards show Go or Done, never a Tab key */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!inScoreBox()) return;
  e.preventDefault();
  const list=[...document.querySelectorAll('input.sc:not([disabled])')];
  const i=list.indexOf(e.target), t=list[i+1];
  if(t){ t.focus(); t.select&&t.select(); } else { e.target.blur(); }
},true);
document.addEventListener('pointerdown',()=>{pointerDown=true;},true);
document.addEventListener('pointerup',()=>{pointerDown=false;},true);

/* remember and restore the caret across a repaint */
function grabFocus(){
  const a=document.activeElement;
  if(!a||!a.classList||!a.classList.contains('sc')) return null;
  let s=null,e=null;
  try{ s=a.selectionStart; e=a.selectionEnd; }catch(x){}
  return {k:a.dataset.k,s:s,e:e};
}
function putFocus(f){
  if(!f) return;
  const el=document.querySelector('input.sc[data-k="'+f.k+'"]');
  if(!el||el.disabled) return;
  el.focus();
  if(f.s!=null){ try{ el.setSelectionRange(f.s,f.e); }catch(x){} }
}

/* ===================== render ===================== */
function TABS(){
  /* The admin sees everything. Everyone else sees what the admin has
     switched on for their level in Setup → Access. */
  if(isAdmin()){
    const t=TAB_LIST.filter(([k])=>k!=='data'); t.push(['setup','Setup'],['data','Data']); return t; }
  const on=ACCESS().tabs[S.role]||ACCESS().tabs.view;
  const t=TAB_LIST.filter(([k])=>on[k]);
  return t.length?t:[['fixtures','Fixtures']];
}
/* signing out of a tab that no longer exists must not leave a blank page */
function validTab(){
  const ok=TABS().map(t=>t[0]);
  if(ok.indexOf(S.tab)<0) S.tab=ok[0];
  return S.tab;
}

function render(){
  const keep=grabFocus();
  applyTheme(); refresh(); validTab(); save();
  applyDocTitle();
  const views={courts:vCourts,fixtures:vFixtures,table:vTable,
               finals:vFinals,groups:vGroups,setup:vSetup,data:vData};
  if(!views[S.tab]||(S.tab==='setup'&&!isAdmin())) S.tab=TABS()[0][0];
  if(!S.groups[S.grp]) S.grp=GROUPS[0];
  const body=views[S.tab]();
  document.getElementById('wrap').innerHTML=headerHTML()+body+footerHTML();
  document.getElementById('nav').innerHTML=TABS().map(([k,l])=>
    `<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  syncChrome();
  putFocus(keep);
}
function go(t){ S.tab=t; S.edit=false; render(); window.scrollTo(0,0); }

const leagueDone=store=>[0,1,2].filter(i=>{const m=store[i];return m&&m.sa!=null&&m.sb!=null;}).length;


/* ===================== collapsible sections =====================
   A finished round is just scroll to get past, so each one folds away. It
   collapses itself once every match in it has a score, and a tap overrides
   that either way — the choice is remembered per section. Collapsed bodies
   are not rendered at all rather than hidden, which keeps Tab from wandering
   into score boxes nobody can see. */
function sectionOpen(id, done, total){
  if(S.open&&S.open[id]!==undefined) return !!S.open[id];
  return !(total>0 && done>=total);        // finished rounds start folded
}
function toggleSection(id, done, total){
  S.open=S.open||{};
  S.open[id]=!sectionOpen(id,done,total);
  save(); render();
}
function section(id, title, done, total, bodyFn){
  const open=sectionOpen(id,done,total);
  const complete=total>0&&done>=total;
  return `<div class="rnd">
    <button class="secHead ${open?'':'closed'}" onclick="toggleSection('${id}',${done},${total})">
      <span class="chev">${open?'▾':'▸'}</span>
      <span class="secT">${title}</span>
      <span class="secMeta ${complete?'done':''}">${total?`${done}/${total}${complete?' ✓':''}`:''}</span>
    </button>
    ${open?`<div class="secBody">${bodyFn()}</div>`:''}
  </div>`;
}
const tieDone = codes => codes.filter(c=>{const t=S.ko[c];return t&&t.sa!=null&&t.sb!=null;}).length;

/* ---------- Courts ---------- */
/* ---------- Courts ----------
   Pick a court and you are straight into its matches, score boxes and all —
   the way a referee standing on that court actually works. A chip for every
   court across the tournament; under it the court's matches in the order they
   go on, with the next one called out at the top. */
function courtSel(){
  const list=allCourts(); if(!list.length) return null;
  return list.find(c=>c.id===S.courtSel)||list[0];
}
function vCourts(){
  const list=allCourts();
  if(!list.length) return `<div class="card" style="padding:20px"><div class="note">No courts yet —
    they are named in the <b>Groups</b> tab.</div></div>`;
  const sel=courtSel(), g=sel.g, ci=sel.ci;
  const ms=courtMatches(g,ci), done=ms.filter(played).length, nx=ms.find(m=>!played(m));
  const multi=courtsOf(g).length>1;

  const chips=`<div class="chips">`+list.map(c=>{
    const cm=courtMatches(c.g,c.ci), fin=cm.length&&cm.every(played);
    return `<div class="chip ${c.id===sel.id?'on':''}" onclick="S.courtSel='${c.id}';save();render()">${
      esc(c.name)} <span class="chipG">${c.g}</span>${fin?' ✓':''}</div>`; }).join('')+`</div>`;

  const bar=canExport()?`<div class="expbar">
    <span class="expSet"><span class="expLbl">${esc(sel.name)}</span>
      <button class="btn sm" onclick="doPrint('data','court:${g}:${ci}')">With scores</button>
      <button class="btn sm" onclick="doPrint('blank','court:${g}:${ci}')">Blank</button></span>
    <span class="expSet"><span class="expLbl">All ${list.length} courts</span>
      <button class="btn sm" onclick="doPrint('data','courts')">With scores</button>
      <button class="btn sm" onclick="doPrint('blank','courts')">Blank</button></span>
    <span class="expSet"><span class="expLbl">Order of play</span>
      <button class="btn sm" onclick="doPrint('data','play')">With scores</button>
      <button class="btn sm" onclick="doPrint('blank','play')">Blank</button></span>
  </div>`:'';

  const head=`<div class="ctHead">
    <div class="ctH1">${esc(sel.name)}</div>
    <div class="ctH2">Group ${esc(g)} · ${ms.length} match${ms.length===1?'':'es'} · ${done} played${
      multi?' · Group '+esc(g)+' runs on '+esc(courtLabel(g)):''}</div>
    ${nx?`<div class="ctNext"><span class="nextLbl">Up next · Match ${nx.n}${
        slotTime(nx.slot||0)?' · '+slotTime(nx.slot||0):''}</span>
      <b>${esc(nx.a)}</b> <span class="vs">v</span> <b>${esc(nx.b)}</b></div>`
      :`<div class="ctNext"><span class="done">${ms.length?'Every match on this court is played'
        :'Nothing scheduled here yet'}</span></div>`}
  </div>`;
  if(!ms.length) return chips+bar+head;

  /* a group spread over several courts plays in rounds, so the court's list is
     cut into those rounds; on its own court a group is simply one list */
  let body;
  if(multi){
    body=groupRounds(g).map(rd=>{ const mine=rd.list.filter(m=>(m.c||0)===ci);
      if(!mine.length) return '';
      const t=slotTime(mine[0].slot||0), d=mine.filter(played).length;
      return `<div class="rndHd"><span>Round ${rd.no}${t?' · '+t:''}</span>
        <span class="${d===mine.length?'ok':''}">${d}/${mine.length}</span></div>`
        + mine.map(m=>matchRow('g:'+g+':'+m.n,m,true)).join(''); }).join('');
  } else body=ms.map(m=>matchRow('g:'+g+':'+m.n,m,true)).join('');

  return chips+(canScore()?modeBar():'')+bar+head+`<div class="card">${body}</div>`;
}

/* ---------- Fixtures: scoring only, names are not editable here ---------- */
function vFixtures(){
  const g=S.grp, G=S.groups[g];
  const chips=`<div class="chips">`+GROUPS.map(k=>
    `<div class="chip ${k===g?'on':''}" onclick="S.grp='${k}';render()">Group ${k}</div>`).join('')+`</div>`;
  const left=`<div class="card">
    <div class="hd"><b>Group ${g} fixtures</b>
      <span style="color:var(--dim);font-size:11px">${esc(courtLabel(g))} · ${G.matches.filter(played).length}/${G.matches.length}</span></div>
    ${G.matches.length&&courtsOf(g).length===1? G.matches.map(m=>matchRow('g:'+g+':'+m.n,m)).join('')
      : G.matches.length? groupRounds(g).map(rd=>{
        const done=rd.list.filter(played).length, t=slotTime(rd.list[0].slot||0);
        return `<div class="rndHd"><span>Round ${rd.no}${t?' · '+t:''}</span>
          <span class="${done===rd.list.length?'ok':''}">${done}/${rd.list.length}</span></div>`
          + rd.list.map(m=>matchRow('g:'+g+':'+m.n,m)).join(''); }).join('')
      : `<div style="padding:22px;text-align:center" class="note">No fixtures yet — add pairs in the
         <b>Groups</b> tab and they build themselves.</div>`}

function modeBar(){
  if(!canScore()) return '';
  return `<div class="row" style="margin-bottom:12px;align-items:center">

}

/* a scoreable row — no name editing anywhere in here */
function matchRow(ref,m,onCourt){
  const mayScore=canScore(), entry=mayScore&&S.mode==='entry'&&m.a&&m.b;
  const wa=played(m)&&m.sa>m.sb, wb=played(m)&&m.sb>m.sa;
  const num=ref.split(':')[0]==='g' ? 'M'+m.n : '';
  const live=(m.log||[]).length?'<span class="liveDot" title="scored on the court console">●</span> ':'';
  const odd=oddScore(m);
  /* the court only earns a place on the row when the group is on more than
     one — and never on a court's own list, where it would just repeat */
  const g0=ref.split(':')[1];
  const multi=!onCourt && num && S.groups[g0] && courtsOf(g0).length>1;
  return `<div class="mrow" data-ref="${ref}">
    ${num||odd?`<div class="mno">${num}${odd?`<span class="oddsc"
      title="Not a finished game under the rules now in force (${attr(rulesShort())}). It still counts.">⚠</span>`:''}${
      multi?`<span class="ctTag" title="${attr(courtName(g0,m.c||0))}">${esc(shortCourt(courtName(g0,m.c||0)))}</span>`:''}</div>`:''}
    <div class="side ${wa?'w':played(m)?'l':''}"><span class="nm">${live}${esc(m.a)||'TBD'}</span></div>
    <input class="sc ${m.sa!=null?'filled':''}" inputmode="numeric" data-k="${ref}:sa"
      ${entry?'':'disabled'} value="${m.sa==null?'':m.sa}" oninput="scoreInput(this)" onfocus="this.select()">
    <div class="sep">–</div>
    <input class="sc ${m.sb!=null?'filled':''}" inputmode="numeric" data-k="${ref}:sb"
      ${entry?'':'disabled'} value="${m.sb==null?'':m.sb}" oninput="scoreInput(this)" onfocus="this.select()">
    <div class="side b ${wb?'w':played(m)?'l':''}"><span class="nm">${esc(m.b)||'TBD'}</span></div>
    ${mayScore&&S.mode==='ref'&&m.a&&m.b?`<button class="refbtn" onclick="openRef('${ref}')">SCORE</button>`:''}
  </div>`;
}

/* The courts this group plays on. Adding one re-deals the fixtures across all
   of them at once; nothing already scored is touched, the matches simply move
   to a different court. */
function courtEditor(g){
  const c=courtsOf(g), n=S.groups[g].matches.length;
  const per=c.map((_,ci)=>courtMatches(g,ci).length);
  return `<div class="courtEd">
    <div class="eyebrow" style="margin-bottom:6px">Courts · ${c.length}</div>
    ${c.map((nm,i)=>`<div class="edRow">
      <div class="ix">⌗</div>
      <input class="txt" value="${attr(nm)}" placeholder="Court name"
        onchange="setCourtName('${g}',${i},this.value)">
      <span class="ctCount">${per[i]||0} match${per[i]===1?'':'es'}</span>
      ${c.length>1?`<button class="btn sm dgr" onclick="removeCourt('${g}',${i})" title="Remove this court">✕</button>`:''}
    </div>`).join('')}
    ${c.length<MAX_COURTS?`<div class="row" style="margin:2px 0 10px">
      <button class="btn sm" onclick="addCourt('${g}')">Add a court</button>
      <span class="note" style="align-self:center">${n} match${n===1?'':'es'} shared out${c.length>1?' between '+c.length+' courts':''}</span>
    </div>`:`<div class="note" style="margin-bottom:10px">${MAX_COURTS} courts is the most for one group.</div>`}
    <div style="height:1px;background:var(--border);margin:0 0 10px"></div>
  </div>`;
}
function setCourtName(g,i,v){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const c=courtsOf(g); c[i]=(v||'').trim()||c[i];
  S.groups[g].courts=normCourts(c); save(); render(); toast('Saved');
  if(sync.on) drainQueue(6);
}
function addCourt(g){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const c=courtsOf(g);
  if(c.length>=MAX_COURTS) return toast(MAX_COURTS+' courts is the most for one group');
  c.push('Court '+nextCourtNo());
  S.groups[g].courts=normCourts(c); assignCourts(S.groups[g]);
  save(); render(); toast('Group '+g+' now on '+c.length+' courts');
  if(sync.on) drainQueue(6);
}
function removeCourt(g,i){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const c=courtsOf(g);
  if(c.length<2) return toast('A group needs at least one court');
  const onIt=courtMatches(g,i).length;
  if(onIt && !confirm('Remove '+c[i]+'? Its '+onIt+' match'+(onIt===1?'':'es')+
     ' move to the remaining courts. Scores already entered are kept.')) return;
  c.splice(i,1);
  S.groups[g].courts=normCourts(c); assignCourts(S.groups[g]);
  save(); render(); toast('Court removed');
  if(sync.on) drainQueue(6);
}
function renameTeam(g,i,v){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const G=S.groups[g], old=G.teams[i], nu=v.trim();
  if(!nu||nu===old){render();return;}
  if(G.teams.some((t,j)=>j!==i&&t===nu)){toast('That pair is already in this group');render();return;}
  G.teams[i]=nu; G.matches.forEach(m=>{if(m.a===old)m.a=nu;if(m.b===old)m.b=nu;});
  save(); render(); toast('Renamed');
}
function addTeam(g){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const el=document.getElementById('new_'+g), v=(el?el.value:'').trim();
  if(!v){toast('Type a pair name first');return;}
  const G=S.groups[g]; if(G.teams.includes(v)){toast('That pair is already in this group');return;}
  G.teams.push(v); G.matches=buildMatches(G.teams,G.matches);
  save(); render(); toast(v+' added · '+G.matches.length+' matches');
}

      <th class="num">+</th><th class="num">–</th><th class="num">Diff</th></tr></thead><tbody>

function tieCard(code,x,y,label){
  const t=S.ko[code]||{a:'',b:'',sa:null,sb:null};
  const has=!!(t.a&&t.b), p=t.sa!=null&&t.sb!=null;
  const entry=canScore()&&S.mode==='entry';
  const sl=(nm,ref,fld,win)=>`<div class="slot ${win?'w':''} ${nm?'':'tbd'}">
      <div class="seed">${esc(refLabel(ref))}</div><div class="nm">${nm?esc(nm):'TBD'}</div>
      <input class="sc ${t[fld]!=null?'filled':''}" inputmode="numeric" data-k="t:${code}:${fld}"
        ${has&&entry?'':'disabled'} value="${t[fld]==null?'':t[fld]}" oninput="scoreInput(this)" onfocus="this.select()"></div>`;
  return `<div class="card tie" data-ref="t:${code}">
    <div class="tieH"><span>${label}</span><span class="code">${esc(code)}</span></div>
    ${sl(t.a,x,'sa',p&&t.sa>t.sb)}
    ${sl(t.b,y,'sb',p&&t.sb>t.sa)}
    ${canScore()&&S.mode==='ref'&&has?`<button class="btn sm acc" style="width:100%;margin-top:9px"
      onclick="openRef('t:${code}')">Referee this match</button>`:''}</div>`;
}
function leagueMatchCard(which,i,label){

        ${has&&entry?'':'disabled'} value="${m[fld]==null?'':m[fld]}" oninput="scoreInput(this)" onfocus="this.select()"></div>`;

function leagueRounds(which){

function championBanner(which,srcRefs){
  const store=which==='diamond'?S.diamond:S.platinum;

    ${box('Runners-up',st[1]&&st[1].team,'var(--muted)')}

}
function vDiamond(){

function vPlatinum(){

function vGold(){
  const G=GOLD_TIES(); if(!G.length)
    return `<div class="note">The third-place league is switched off for this format. Turn it on in Setup.</div>`;
  const codes=G.map(x=>x[0]), gs=goldStanding();

  const ties=section('g_ties',nmG()+' league · '+G.length+' ties',tieDone(codes),codes.length,()=>
    `<div class="grid g2">`+G.map(([c,x,y])=>tieCard(c,x,y,nmG()+' tie')).join('')+`</div>`);

  let decider='';
  if(gs.tied.length){
    const dc=gs.pairs.map(p=>p[0]);
    decider=section('g_dec','Decider · level on margin',tieDone(dc),dc.length,()=>
      `<div class="alert warn" style="margin-bottom:10px"><span>⚖</span><span>
        <b>${gs.tied.map(t=>esc(t.win)).join(' and ')}</b> each won by ${gs.tied[0].marg} points,
        so the margin cannot separate them. They play ${dc.length===1?'a decider':'each other'} for the title.</span></div>
      <div class="grid g2">`+gs.pairs.map(([c,a,b])=>
        tieCard(c,'','',nmG()+' decider')).join('')+`</div>`);
  }

  let rank='';
  if(gs.rank.length){
    rank=section('g_rank',nmG()+' standing · by winning margin',gs.rank.length,G.length,()=>
      `<div class="card"><div class="tblWrap"><table>
        <thead><tr><th>Pair</th><th class="num">Tie</th><th class="num">Won by</th></tr></thead><tbody>`+
        gs.rank.map((r,i)=>`<tr class="${i===0&&gs.champion?'q1':''}"><td class="name">${
          i===0&&gs.champion?'<span class="medal mGold">①</span>'
            :i===1?'<span class="medal mSil">②</span>'
            :i===2?'<span class="medal mBronze">③</span>':'<span class="rk">'+(i+1)+'</span>'}
          <span class="txt">${esc(r.win)}</span></td>
          <td class="num">${r.code}</td><td class="num pos">+${r.marg}</td></tr>`).join('')+
      `</tbody></table></div></div>`);
    if(gs.champion) rank+=podiumBlock(nmG()+' placings',gs.rank.map(r=>r.win));
    else if(gs.tied.length&&!gs.decided)
      rank+=`<div class="alert warn"><span>⏳</span><span>The ${esc(nmG())} title is waiting on the decider above.</span></div>`;
  }
  return `<div class="note" style="margin-bottom:14px"><b style="color:var(--gold)">${esc(nmG())} league.</b>
    The group third-placed pairs play off. The winner is the victor with the biggest winning margin —
    and if two win by the same amount, they play each other to settle it.</div>`
    +ties+decider+rank;
}
/* one consistent way of showing the top three anywhere */
function podiumBlock(title,names){
  const box=(lbl,nm,col)=>nm?`<div class="card tie" style="text-align:center;padding:15px;border-color:${col}">
    <div class="tieH" style="justify-content:center"><span>${lbl}</span></div>
    <div style="font:800 17px 'Bricolage Grotesque';color:${col}">${esc(nm)}</div></div>`:'';
  return `<div class="rnd"><div class="rndT">${title}</div><div class="podium">
    ${box('Champions',names[0],'var(--gold)')}
    ${box('Runners-up',names[1],'var(--muted)')}
    ${box('Third',names[2],'#d97706')}</div></div>`;
}

   been typed can be checked before it is sent — a mistyped PIN on a phone

const EYE_OPEN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>'+

function addPeek(){
  document.querySelectorAll('.sheetM input[type=password]').forEach(inp=>{
    if(inp.parentElement.classList.contains('pwWrap')) return;
    const w=document.createElement('div'); w.className='pwWrap';
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    const b=document.createElement('button');
    b.type='button'; b.className='pwEye'; b.innerHTML=EYE_OPEN;
    b.setAttribute('aria-label','Show what is typed'); b.setAttribute('aria-pressed','false');
    /* keep the caret in the box: the button must not take focus on a tap */
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{
      const show=inp.type==='password';
      inp.type=show?'text':'password';
      b.innerHTML=show?EYE_SHUT:EYE_OPEN;
      b.setAttribute('aria-pressed',String(show));
      b.setAttribute('aria-label',show?'Hide what is typed':'Show what is typed');
      inp.focus(); const n=inp.value.length; try{ inp.setSelectionRange(n,n); }catch(e){}

    w.appendChild(b);

   stale device can never overwrite live scoring.

/* ---------- rows: what travels ---------- */
const K_G  = g => sync.event+':g:'+g;                 // whole group {court,teams,matches}
const K_T  = c => sync.event+':t:'+c;                 // a KO/Gold tie score {sa,sb}
const K_L  = (w,i) => sync.event+':l:'+w+':'+i;       // a league match score {sa,sb}
const K_CFG= () => sync.event+':cfg';                 // passwords {adminHash,scorerHash}
const K_TPL= () => sync.event+':tpl';                 // the organiser's saved formats
const K_FMT= () => sync.event+':fmt';                 // the format {meta,rules,draw,groupKeys}
/* Logos travel as data URLs, so the branding gets a row of its own rather than
   riding along with the format. A court rename then costs a few hundred bytes
   instead of resending every logo with it. */
const K_BRD= () => sync.event+':brand';               // {host,organisers,sponsors}

function groupPayload(g){ const G=S.groups[g];
  return { courts:courtsOf(g), teams:G.teams.slice(),
    matches:G.matches.map(m=>({n:m.n,a:m.a,b:m.b,sa:m.sa,sb:m.sb,log:m.log||null,

function tiePayload(c){ const t=S.ko[c]||{};
  return { sa:t.sa==null?null:t.sa, sb:t.sb==null?null:t.sb, log:t.log||null,

function leaguePayload(w,i){ const s=(w==='diamond'?S.diamond:S.platinum)[i]||{};
  return { sa:s.sa==null?null:s.sa, sb:s.sb==null?null:s.sb, log:s.log||null,
    server:s.server||null, posA:s.posA||0, posB:s.posB||0, startLeft:s.startLeft||null, invert:!!s.invert }; }

function syncSnapshot(){
  const o={};
  /* only ever publish a password that exists — an empty one must not be able to
     travel and unlock the event on everybody else's device */
  if(S.adminHash||S.scorerHash||S.orgHash)
    o[K_CFG()]={ adminHash:S.adminHash||'', scorerHash:S.scorerHash||'', orgHash:S.orgHash||'' };
  /* saved formats follow the organiser between their own devices */
  if((S.templates||[]).length) o[K_TPL()]={ list:S.templates };
  o[K_FMT()]={ meta:S.meta, rules:S.rules, access:ACCESS(), draw:S.draw, groupKeys:GROUPS.slice() };
  o[K_BRD()]={ host:HOST(), organisers:ORGANISERS(), sponsors:SPONSORS() };
  GROUPS.forEach(g=>{ o[K_G(g)]=groupPayload(g); });
  TIE_CODES().forEach(c=>{ o[K_T(c)]=tiePayload(c); });
  ['diamond','platinum'].forEach(w=>{
    const n=leaguePairs((w==='diamond'?DIAMOND_SRC():PLATINUM_SRC()).length).length;
    for(let i=0;i<n;i++) o[K_L(w,i)]=leaguePayload(w,i);
  });
  return o;
}
/* The event password arriving from another device. A scorer already unlocked
   here is left alone — losing access mid-match because the organiser changed
   the password would be worse than the alternative. */
/* Saved formats are inert reference data, so the newest list simply wins. */
function applyTpl(d){
  const list=(d&&Array.isArray(d.list))?d.list:null;
  if(!list) return false;
  if(JSON.stringify(list)===JSON.stringify(S.templates||[])) return false;
  S.templates=list;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
  return true;
}
/* The branding arriving from the organiser's device. It is settled there and
   nowhere else, so the newest copy simply wins. */
function applyBrand(d){
  if(!d) return false;
  const next=normBrand({host:d.host, organisers:d.organisers, sponsors:d.sponsors});
  const now={host:HOST(), organisers:ORGANISERS(), sponsors:SPONSORS()};
  if(JSON.stringify(next)===JSON.stringify(now)) return false;
  S.host=next.host; S.organisers=next.organisers; S.sponsors=next.sponsors;
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
  return true;
}
function applyCfg(d){
  if(!d) return false;
  let hit=false;
  /* an empty value never travels — nothing arriving from the wire may unlock
     the event by clearing a password that is already in force */
  if(d.adminHash && d.adminHash!==S.adminHash){ S.adminHash=d.adminHash; hit=true; }
  if(d.scorerHash!==undefined && d.scorerHash!==S.scorerHash){ S.scorerHash=d.scorerHash||''; hit=true; }
  if(d.orgHash!==undefined && d.orgHash!==S.orgHash){ S.orgHash=d.orgHash||''; hit=true; }
  if(hit){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){} }
  return hit;
}
/* The format arriving from the organiser's device. Groups that appear are
   created empty and then filled by their own rows a moment later. */
function applyFmt(d){
  if(!d||!d.draw) return false;
  let hit=false;
  if(JSON.stringify(d.meta||{})!==JSON.stringify(S.meta||{})){ S.meta=d.meta; hit=true; }
  if(JSON.stringify(d.draw)!==JSON.stringify(S.draw)){ S.draw=d.draw; hit=true; }
  if(d.rules){ const r=normRules(d.rules);
    if(JSON.stringify(r)!==JSON.stringify(S.rules)){ S.rules=r; applyRules(); hit=true; } }
  if(d.access){ const a=normAccess(d.access);
    if(JSON.stringify(a)!==JSON.stringify(ACCESS())){ S.access=a; hit=true; } }
  if(Array.isArray(d.groupKeys)){
    const want=d.groupKeys.slice().sort(), have=Object.keys(S.groups).sort();
    if(want.join()!==have.join()){
      have.forEach(k=>{ if(want.indexOf(k)<0) delete S.groups[k]; });
      want.forEach((k,i)=>{ if(!S.groups[k]) S.groups[k]={courts:['Court '+(i+1)],teams:[],matches:[]}; });
      if(!S.groups[S.grp]) S.grp=want[0];
      hit=true;
    }
  }
  if(hit){ syncGroupKeys();
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){} }
  return hit;
}

  if(Array.isArray(d.matches)) G.matches=d.matches.map(m=>({n:m.n,a:m.a,b:m.b,

function applyLeague(w,i,d){ const store=w==='diamond'?S.diamond:S.platinum;

function syncScan(){
  if(!sync.on) return;
  const snap=syncSnapshot(), scoring=canScore(); let n=0;
  Object.keys(snap).forEach(k=>{ const s=JSON.stringify(snap[k]);
    if(sync.sent[k]===s) return;
    if(!scoring || ((k===K_CFG()||k===K_FMT()||k===K_BRD())&&!isAdmin())){ sync.sent[k]=s; return; }
    sync.dirty[k]=s; sync.rev[k]=(sync.rev[k]||0)+1; n++; });
  sync.pending=Object.keys(sync.dirty).length;
  if(n) schedulePush();
  syncChrome();
}

async function supa(path,opts){
  const r=await fetch(SUPA_URL+path, Object.assign({
    headers:{ 'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json' } }, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}

/* ---------- push ---------- */
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(syncPush,PUSH_MS); }
async function syncPush(){
  if(!sync.on||sync.busy) return;
  const keys=Object.keys(sync.dirty); if(!keys.length) return;
  if(!canScore()){ const snap=syncSnapshot();
    Object.keys(snap).forEach(k=>{ sync.sent[k]=JSON.stringify(snap[k]); });
    sync.dirty={}; sync.pending=0; syncSave(); return; }
  sync.busy=true; syncStatus('sync');
  const batch=keys.slice(0,60);
  const items=batch.map(k=>({key:k,data:JSON.parse(sync.dirty[k]),rev:sync.rev[k]}));
  try{
    const res=await supa('/rest/v1/rpc/osl_put',{method:'POST',
      body:JSON.stringify({items:items, by:sync.device})});
    const ok={}; (res||[]).forEach(r=>ok[r.out_key]=r.out_rev);
    batch.forEach(k=>{ if(ok[k]!==undefined){ sync.sent[k]=sync.dirty[k]; sync.rev[k]=ok[k]; delete sync.dirty[k]; }
      else { delete sync.dirty[k]; } });
    sync.pending=Object.keys(sync.dirty).length;
    sync.lastOk=Date.now(); syncSave(); syncStatus('live');
    syncLog('sent '+batch.length+' change'+(batch.length>1?'s':''));
    if(sync.pending) schedulePush(); else setTimeout(()=>syncPull(false),150);
  }catch(e){ syncLog('send failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.busy=false; }
}

/* ---------- pull ---------- */
async function syncPull(force){
  if(!sync.on||sync.pulling) return;
  sync.pulling=true; if(sync.status!=='live') syncStatus('sync');
  try{
    const since=(force?null:sync.cursor);
    if(force) sync.cursor=null;
    /* Only ever ask for this event's own rows. The table is shared with the
       other RISE apps, so without this filter every device downloads all of
       their rows too and throws them away — wasted bandwidth, and worse, the
       500-row page could fill up with another event's rows and push this
       event's own rows off the end while the cursor moved past them. */
    const q='/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
      (sync.noFilter?'':'&key=like.'+encodeURIComponent(sync.event+':')+'*')+
      (since?'&updated_at=gt.'+encodeURIComponent(since):'');
    let rows;
    try{ rows=await supa(q); }
    catch(err){
      /* if this server does not accept the filter, fall back once and carry on */
      if(!sync.noFilter && /HTTP 4/.test(String(err.message||err))){
        sync.noFilter=true; syncLog('prefix filter refused — falling back');
        rows=await supa('/rest/v1/osl_live?select=key,data,rev,updated_at&order=updated_at.asc&limit=500'+
          (since?'&updated_at=gt.'+encodeURIComponent(since):''));
      } else throw err;
    }
    let changed=0, newest=sync.cursor;
    (rows||[]).forEach(r=>{
      if(r.key.indexOf(sync.event+':')!==0) return;
      if(!newest||r.updated_at>newest) newest=r.updated_at;
      const localRev=sync.rev[r.key]||0, remoteStr=JSON.stringify(r.data);
      if(sync.dirty[r.key]) return;                 // this device is mid-change
      const parts=r.key.split(':'), kind=parts[1]; let hit=false;
      /* The event password is checked against the live state every time, never
         against the bookkeeping. The usual "already seen this revision" shortcut
         trusts local storage to still agree with it — and local storage is
         exactly what someone would edit to let themselves in. */
      if(kind==='fmt'){
        if(applyFmt(r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++; }
        return;
      }
      if(kind==='brand'){
        if(applyBrand(r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++; }
        return;
      }
      if(kind==='tpl'){
        if(applyTpl(r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++; }
        return;
      }
      if(kind==='cfg'){
        if(applyCfg(r.data)){ sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++; }
        return;
      }
      if(r.rev<localRev) return;
      if(r.rev===localRev && sync.sent[r.key]===remoteStr) return;
      if(kind==='g') hit=applyGroup(parts[2], r.data);
      else if(kind==='t') hit=applyTie(parts[2], r.data);
      else if(kind==='l') hit=applyLeague(parts[2], +parts[3], r.data);
      if(!hit) return;
      sync.rev[r.key]=r.rev; sync.sent[r.key]=remoteStr; changed++;
    });
    sync.cursor=newest;
    if(changed){ refresh();
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
      const snap=syncSnapshot();
      Object.keys(snap).forEach(k=>{ if(!sync.dirty[k]) sync.sent[k]=JSON.stringify(snap[k]); }); }
    sync.lastOk=Date.now(); sync.pulledOnce=true; syncSave(); syncStatus('live');
    syncLog(changed?('received '+changed+' change'+(changed>1?'s':'')):'checked · nothing new');
    if(changed){ if(S.ref) renderRef(); else if(!modalOpen) render(); }
  }catch(e){ syncLog('pull failed: '+(e.message||e)); syncStatus('off_line',String(e.message||e)); }
  finally{ sync.pulling=false; }
}
function syncStart(){ sync.on=true; syncSave(); syncStatus('sync');
  clearInterval(pullTimer); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>{ syncScan(); }); }
function syncStop(){ sync.on=false; clearInterval(pullTimer); pullTimer=null;
  clearTimeout(pushTimer); syncSave(); syncStatus('off'); }
/* Push whatever is queued, but give up after a few rounds. With no signal the
   queue cannot drain, and an unbounded loop would spin forever; the changes are
   already saved locally and the normal sync will carry them out later anyway. */
async function drainQueue(rounds){
  rounds=rounds||8;
  for(let i=0;i<rounds && sync.on && Object.keys(sync.dirty).length;i++){
    await syncPush();
    if(!Object.keys(sync.dirty).length) break;
    await new Promise(r=>setTimeout(r,150));
  }
  return Object.keys(sync.dirty).length;
}
async function syncPublishAll(){
  if(!sync.on) return toast('Turn live sync on first');
  if(!canScore()) return toast('Unlock scoring first');
  const snap=syncSnapshot();
  Object.keys(snap).forEach(k=>{ sync.rev[k]=(sync.rev[k]||0)+1; sync.dirty[k]=JSON.stringify(snap[k]); });
  sync.pending=Object.keys(sync.dirty).length; toast('Publishing '+sync.pending+' rows…');
  const left=await drainQueue(12);
  toast(left?('Still '+left+' waiting — no connection'):'Published'); if(modalOpen) openModal(syncModal());
}

  if(!confirm('Reset everything to the original team list?'+(sync.on?' This clears the other devices too.':''))) return;

     of the event must never take them with it */

    theme:S.theme,mode:S.mode,open:S.open,
    meta:S.meta,draw:S.draw,preset:S.preset,templates:S.templates};
  const g=clone(S.groups);
  S=Object.assign(blank(S.preset),keep);
  Object.keys(g).forEach(k=>{ S.groups[k]=assignCourts({courts:normCourts(g[k].courts,g[k].court),

    sync.pending=Object.keys(sync.dirty).length; syncSave(); toast('Reset — clearing the other devices…');
    await drainQueue(12);
  }
  toast('Event reset'); render();
}

/* ========================================================================
   EXPORT & SHARE
   Two routes out of the app. A PDF goes through the browser's own print
   dialog — "Save as PDF" is a destination there on every phone and laptop,
   which keeps this a single offline file with no PDF library bolted on.
   For WhatsApp a plain-text summary works far better than an attachment:
   it is readable in the chat itself, and asterisks give WhatsApp its bold.
   ===================================================================== */
const pad=(s,n)=>{ s=String(s); return s.length>=n?s:s+' '.repeat(n-s.length); };

function txtGroup(g){
  const G=S.groups[g], st=standings(g);
  let t=`*GROUP ${g}* _(${courtLabel(g)})_\n`;
  const done=G.matches.filter(played).length;
  if(st.length){
    st.forEach(r=>{ t+=`${r.rank}. ${r.team} — ${r.w}W ${r.l}L (${r.d>0?'+':''}${r.d})\n`; });
  }
  if(done){
    t+=`\nResults\n`;
    const multi=courtsOf(g).length>1;
    G.matches.forEach(m=>{ if(!played(m))return;
      t+=`M${m.n}${multi?' ('+shortCourt(courtName(g,m.c||0))+')':''} ${m.a} ${m.sa}-${m.sb} ${m.b}\n`; });
  }
  const left=G.matches.length-done;
  if(left) t+=`_${left} match${left>1?'es':''} still to play_\n`;
  return t+'\n';
}
function txtTie(code,label){
  const t=S.ko[code]; if(!t||!t.a||!t.b) return '';
  const p=t.sa!=null&&t.sb!=null;
  return `${label}: ${t.a} ${p?t.sa+'-'+t.sb:'vs'} ${t.b}\n`;
}
function txtFinals(){
  let t='';
  ROUNDS().forEach(r=>{
    const body=r.ties.map(([c])=>txtTie(c,c)).join('');
    if(body) t+=`*${r.label.toUpperCase()}*\n${body}\n`;
  });
  const lg=(store,src,name)=>{
    if(!src.length) return '';
    const tbl=leagueTable(store,src); if(!tbl.length) return '';
    const n=leaguePairs(src.length).length;
    let s2=`*${name}${src.length<=2?'':' LEAGUE'}*\n`;
    for(let i=0;i<n;i++){ const m=store[i];
      if(m&&m.a&&m.b) s2+=`${m.a} ${m.sa!=null&&m.sb!=null?m.sa+'-'+m.sb:'vs'} ${m.b}\n`; }
    if(src.length>2){ s2+='\n';
      tbl.forEach(r=>{ s2+=`${r.rank}. ${r.team} — ${r.w}W ${r.l}L (${r.d>0?'+':''}${r.d})\n`; }); }
    return s2+'\n';
  };
  t+=lg(S.diamond,DIAMOND_SRC(),'DIAMOND');
  t+=lg(S.platinum,PLATINUM_SRC(),'PLATINUM');
  const G=GOLD_TIES();
  const gt=G.map(([c])=>txtTie(c,nmG()+' '+c)).join('');
  if(gt){
    t+=`*GOLD LEAGUE*\n${gt}`;
    const res=G.map(([c])=>{const x=S.ko[c];
      if(!x||x.sa==null||x.sb==null||!x.a||!x.b)return null;
      const w=x.sa>x.sb?x.a:x.sb>x.sa?x.b:''; return w?{w,m:Math.abs(x.sa-x.sb)}:null;})
      .filter(Boolean).sort((a,b)=>b.m-a.m);
    if(res.length===G.length) t+=`Winner: ${res[0].w} (by ${res[0].m})\n`;
    t+='\n';
  }
  return t;
}
function txtPodium(){
  const dl=leagueTable(S.diamond,DIAMOND_SRC()), pl=leagueTable(S.platinum,PLATINUM_SRC());
  const nd=leaguePairs(DIAMOND_SRC().length).length, np=leaguePairs(PLATINUM_SRC().length).length;
  const allD=nd>0&&[...Array(nd).keys()].every(i=>{const m=S.diamond[i];return m&&m.sa!=null&&m.sb!=null;});
  const allP=np>0&&[...Array(np).keys()].every(i=>{const m=S.platinum[i];return m&&m.sa!=null&&m.sb!=null;});
  let t='';
  if(allD&&dl[0]) t+=`🏆 *${nmD()} champions:* ${dl[0].team}\n🥈 ${dl[1]?dl[1].team:''}\n`;
  if(allP&&pl[0]) t+=`🥇 *${nmP()} champions:* ${pl[0].team}\n`;
  const GT=GOLD_TIES();
  const res=GT.map(([c])=>{const x=S.ko[c];
    if(!x||x.sa==null||x.sb==null||!x.a||!x.b)return null;
    const w=x.sa>x.sb?x.a:x.sb>x.sa?x.b:''; return w?{w,m:Math.abs(x.sa-x.sb)}:null;})
    .filter(Boolean).sort((a,b)=>b.m-a.m);
  if(GT.length&&res.length===GT.length) t+=`⭐ *${nmG()} champions:* ${res[0].w}\n`;
  return t?t+'\n':'';
}
function resultsText(scope){
  let done=0,tot=0;
  GROUPS.forEach(g=>S.groups[g].matches.forEach(m=>{tot++;if(played(m))done++;}));
  let t=`*${S.meta.title}* — ${S.meta.sub}\n`;
  if(scope==='all'||scope==='finals') t+=txtPodium();
  if(scope==='all'||scope==='groups'){
    GROUPS.forEach(g=>{ t+=txtGroup(g); });
  } else if(scope&&scope.length===1){
    t+='\n'+txtGroup(scope);
  }
  if(scope==='all'||scope==='finals') t+=txtFinals();
  if(scope==='all') t+=`_${done} of ${tot} group matches played_\n`;
  const org=organiserLine(), sp=shownSponsors().map(o=>o.name).filter(Boolean);
  const ev=eventPhone(), hp=hostPhone();
  if(org) t+=`\nOrganised by *${org}*`+(ev?' · '+ev:'');
  else if(ev) t+=`\nQueries · ${ev}`;
  if(sp.length) t+=`\n_${sp.length===1?'Sponsor':'Sponsors'}: ${sp.join(' · ')}_`;
  t+=`\nHosted on *${hostName()}*`+(hp?`\n_To run your own tournament here: ${hp}_`:'');
  return t.replace(/\n{3,}/g,'\n\n');
}

/* ========================================================================
   RESETTING SCORES
   Separate from "reset everything". These wipe results while leaving the
   rosters, courts and group layout exactly as they are, so a group can be
   replayed without typing thirty names back in. Clearing a group's scores
   also empties whatever it had fed into the draws, because the qualifiers
   are derived from the group tables rather than stored.
   ===================================================================== */
function wipeMatch(m){
  m.sa=null; m.sb=null; m.log=null;
  m.server=null; m.posA=0; m.posB=0; m.startLeft=null; m.invert=false;
}
function clearGroupScores(g){ S.groups[g].matches.forEach(wipeMatch); }
function clearFinalsScores(){
  TIE_CODES().forEach(c=>{ if(S.ko[c]) wipeMatch(S.ko[c]); });
  Object.keys(S.diamond).forEach(i=>wipeMatch(S.diamond[i]));
  Object.keys(S.platinum).forEach(i=>wipeMatch(S.platinum[i]));
}
function scoresIn(scope){
  if(scope==='finals'){
    const cnt=o=>Object.keys(o).filter(i=>{const m=o[i];return m&&m.sa!=null&&m.sb!=null;}).length;
    return TIE_CODES().filter(c=>{const t=S.ko[c];return t&&t.sa!=null&&t.sb!=null;}).length
      +cnt(S.diamond)+cnt(S.platinum);
  }
  if(scope==='groups'||scope==='all'){
    let n=0; GROUPS.forEach(g=>{ n+=S.groups[g].matches.filter(played).length; });
    return n+(scope==='all'?scoresIn('finals'):0);
  }
  return S.groups[scope]?S.groups[scope].matches.filter(played).length:0;
}
async function resetScores(scope){
  if(!isAdmin()) return toast('Admin only');
  const n=scoresIn(scope);
  const what = scope==='all'?'every score in the tournament'
    : scope==='groups'?'every group score'
    : scope==='finals'?'every knockout and league score'
    : 'the Group '+scope+' scores';
  if(!n) return toast('Nothing to clear there yet');
  if(!confirm(`Clear ${what}? That is ${n} result${n>1?'s':''}.\n\nTeams, courts and fixtures stay exactly as they are.`
    +(sync.on?'\n\nThis clears them on the other devices too.':''))) return;

  if(scope==='all'){ GROUPS.forEach(clearGroupScores); clearFinalsScores(); }
  else if(scope==='groups'){ GROUPS.forEach(clearGroupScores); }
  else if(scope==='finals'){ clearFinalsScores(); }
  else { clearGroupScores(scope); }

  S.ref=null;
  refresh(); save(); render();
  toast(n+' result'+(n>1?'s':'')+' cleared');
  if(sync.on&&canScore()) drainQueue(12);   // deliberately not awaited — the UI is already clear
}

/* ========================================================================
   NOT LOSING THE PAGE BY ACCIDENT
   Every score is written to this device the instant it is typed, so closing
   the tab has never actually lost a result — reopening the same link brings
   it all back, still in scorer mode. The real damage is losing your place
   mid-match, so: Back closes whatever is open rather than leaving, and a
   second Back is needed to go. The browser's own "leave site?" prompt is
   asked for as well whenever something is still queued to send.
   ===================================================================== */
let backArmed=false, backTimer=null;
function guardHistory(){
  try{ history.pushState({rise:1},'',location.href); }catch(e){ return; }
  window.addEventListener('popstate',()=>{
    const repush=()=>{ try{ history.pushState({rise:1},'',location.href); }catch(e){} };
    if(S.ref){ repush(); closeRef(); return; }          // back closes the court console
    if(modalOpen){ repush(); closeModal(); return; }    // then any open sheet
    if(S.tab!=='courts'){ repush(); go('courts'); return; }  // then back to the top
    if(canScore()&&!backArmed){                           // then ask once before leaving
      backArmed=true; repush();
      toast('Press back again to leave — every score is already saved');
      clearTimeout(backTimer); backTimer=setTimeout(()=>{backArmed=false;},2600);
      return;
    }
  });
}
window.addEventListener('beforeunload',e=>{
  const queued=Object.keys(sync.dirty||{}).length;
  if(canScore()&&(S.ref||queued)){ e.preventDefault(); e.returnValue=''; return ''; }
});
/* a last write on the way out, in case anything was mid-flight */
window.addEventListener('pagehide',()=>{
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    try{ localStorage.setItem(STORE_KEY,JSON.stringify(Object.assign({},S,{ref:null}))); }catch(e){}
  } else if(sync.on){ syncPull(false); }   // catch up on whatever happened while away
});

/* ========================================================================
   SETUP — the organiser's control over the shape of the event
   Everything here is data that syncs to the other devices, so a change made
   on the organiser's phone reaches the courts within a few seconds.
   ===================================================================== */
function koLocked(){
  return TIE_CODES().some(c=>{const t=S.ko[c];return t&&t.sa!=null&&t.sb!=null;});
}
function sourceOptions(sel, excludeCode){
  const opts=[];
  GROUPS.forEach(g=>{ for(let r=1;r<=6;r++) opts.push([g+r,'Group '+g+' · '+ordinal(r)]); });
  ROUNDS().forEach(rd=>rd.ties.forEach(([c])=>{
    if(c===excludeCode) return;
    opts.push(['W:'+c,'Winner of '+c]); opts.push(['L:'+c,'Loser of '+c]);
  }));
  const known=opts.some(o=>o[0]===sel);
  return opts.map(([v,l])=>`<option value="${v}"${v===sel?' selected':''}>${l}</option>`).join('')
    +(known||!sel?'':`<option value="${esc(sel)}" selected>${esc(sel)} (not in this format)</option>`);
}
const ordinal=n=>n+({1:'st',2:'nd',3:'rd'}[n]||'th');

function vSetup(){
  const locked=koLocked();
  return `<div class="note" style="margin-bottom:12px">Everything on this page syncs to the other
    devices. ${locked?'<b style="color:var(--gold)">Knockout scores exist</b>, so changing the draw now would strand them — clear the finals scores first if you really need to.':''}</div>`
    +setupEvent()+setupAccess()+setupOrgs()+setupRules()+setupPreview()+setupGroups()+setupLeagues(locked)+setupDraw(locked)+setupPresets()+setupTemplates();
}



/* ========================================================================
   SAVED FORMATS
   A format is the shape of a tournament with none of its content: how many
   groups, what the courts are called, and the whole knockout draw. Pairs,
   scores and the event name are deliberately left out, so last season's
   structure can be reused for a completely different Friday.
   ===================================================================== */
function formatShape(){
  return {
    groups: GROUPS.map(g=>({key:g, courts:courtsOf(g)})),
    draw: clone(S.draw)
  };
}
function shapeSummary(sh){
  const rounds=(sh.draw.rounds||[]).map(r=>r.label+' ×'+r.ties.length).join(' → ');
  const lg=[];
  if((sh.draw.diamond||[]).length) lg.push('Diamond '+(sh.draw.diamond.length===2?'final':sh.draw.diamond.length+'-way'));
  if((sh.draw.platinum||[]).length) lg.push('Platinum '+(sh.draw.platinum.length===2?'final':sh.draw.platinum.length+'-way'));
  if((sh.draw.gold||[]).length) lg.push('Gold ×'+sh.draw.gold.length);
  return sh.groups.length+' groups · '+(rounds||'no rounds')+(lg.length?' · '+lg.join(', '):'');
}
function saveTemplate(){
  if(!isAdmin()) return toast('Admin only');
  openModal(`<h3>Save this format</h3>
    <p class="hint">Stores the group layout, the court names and the whole knockout draw under a name
    you choose. Pairs, scores and the event name are not included, so it can be reused for any event.</p>
    <label class="fl">Name it</label>
    <input type="text" id="tplName" placeholder="e.g. Friday 6-group 35 Split"
      onkeydown="if(event.key==='Enter')commitTemplate()">
    <p class="hint">Currently: ${esc(shapeSummary(formatShape()))}</p>
    <div class="row" style="margin-top:16px">
      <button class="btn acc" style="flex:1" onclick="commitTemplate()">Save format</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>`);
}
function commitTemplate(){
  const nm=(document.getElementById('tplName').value||'').trim();
  if(!nm) return toast('Give it a name first');
  S.templates=S.templates||[];
  const existing=S.templates.find(t=>t.name.toLowerCase()===nm.toLowerCase());
  if(existing && !confirm('“'+nm+'” already exists. Replace it?')) return;
  const rec={ id:'t'+Date.now().toString(36), name:nm,
              saved:new Date().toISOString().slice(0,10), shape:formatShape() };
  if(existing) S.templates[S.templates.indexOf(existing)]=rec;
  else S.templates.unshift(rec);
  save(); closeModal(); render(); toast('Saved as “'+nm+'”');
  if(sync.on) drainQueue(6);
}
function applyTemplate(id){
  if(!isAdmin()) return toast('Admin only');
  const t=(S.templates||[]).find(x=>x.id===id); if(!t) return;
  const keep=t.shape.groups.map(g=>g.key);
  const losing=GROUPS.filter(g=>keep.indexOf(g)<0 && S.groups[g].teams.length);
  let warn='Apply “'+t.name+'”?\n\n'+shapeSummary(t.shape)+
    '\n\nThe draw is replaced and knockout scores are cleared. Pairs stay wherever their group still exists.';
  if(losing.length) warn+='\n\nGroup '+losing.join(', ')+' would be removed along with the pairs in them.';
  if(!confirm(warn)) return;
  const old=clone(S.groups);
  S.groups={};
  t.shape.groups.forEach((g,i)=>{
    const prev=old[g.key], teams=prev?prev.teams.slice():[];
    S.groups[g.key]=assignCourts({
      courts:normCourts(g.courts||(g.court?[g.court]:null)||(prev&&prev.courts), 'Court '+(i+1)),
      teams, matches:buildMatches(teams, prev?prev.matches:null) });
  });
  S.draw=clone(t.shape.draw); S.preset='';
  S.ko={}; S.diamond={}; S.platinum={};
  syncGroupKeys(); if(!S.groups[S.grp]) S.grp=GROUPS[0];
  save(); render(); toast('“'+t.name+'” applied');
  if(sync.on) drainQueue(6);
}
function renameTemplate(id){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t) return;
  const nm=prompt('Rename this format', t.name);
  if(nm===null) return;
  if(!nm.trim()) return toast('Name cannot be empty');
  t.name=nm.trim(); save(); render();
  if(sync.on) drainQueue(6);
}
function deleteTemplate(id){
  const t=(S.templates||[]).find(x=>x.id===id); if(!t) return;
  if(!confirm('Delete the saved format “'+t.name+'”? The tournament in progress is untouched.')) return;
  S.templates=S.templates.filter(x=>x.id!==id);
  save(); render(); toast('Deleted');
  if(sync.on) drainQueue(6);
}
function setupTemplates(){
  const list=S.templates||[];
  return `<div class="card" style="padding:16px;margin-bottom:12px">

/* ---------- the link preview ----------
   WhatsApp fetches the raw file and reads its <title> and og: tags. It never
   runs the script, so nothing edited here can reach it — those tags have to be
   inside the file that is uploaded. Rather than ask anyone to hand-edit HTML,
   the app fetches its own source, rewrites the tags and the built-in defaults,
   and hands back a file ready to replace the one on GitHub. */
function previewLine(){
  return (S.meta.title||'')+(S.meta.sub?' · '+S.meta.sub:'');
}
function setupPreview(){
  const t=previewLine();
  const stale=(document.querySelector('meta[property="og:title"]')||{}).dataset;
  return `<div class="card" style="padding:16px;margin-bottom:12px">
    <div class="hd" style="padding:0 0 8px"><b>Link preview &amp; browser tab</b></div>
    <p class="note">The tab now reads <b>${esc(t)}</b>. The preview WhatsApp shows is different:
    it is read straight out of the uploaded file, so editing the event here cannot change it.
    Download a copy with the details written in, replace the file on GitHub, and the preview follows.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn acc" onclick="downloadBranded()">Download a copy for uploading</button>
      <button class="btn" onclick="copyHeadTags()">Copy the tags instead</button>
    </div>
    <p class="hint" style="margin-top:10px">WhatsApp remembers a preview for a long while. After
    uploading, share the link with something on the end — <b>?v=2</b> — and it fetches it again.</p>
  </div>`;
}
function headTags(){
  const t=previewLine(), d='Live scores, standings and the knockout draw.';
  return `<title>${t}</title>\n`+
    `<meta name="description" content="Live scores — ${t} · ${hostName()}">\n`+
    `<meta property="og:type" content="website">\n`+
    `<meta property="og:site_name" content="${hostName()}">\n`+
    `<meta property="og:title" content="${t}">\n`+
    `<meta property="og:description" content="${d}">\n`+
    `<meta name="twitter:card" content="summary">\n`+
    `<meta name="twitter:title" content="${t}">\n`+
    `<meta name="twitter:description" content="${d}">`;
}
function copyHeadTags(){
  const ta=document.createElement('textarea');
  ta.value=headTags(); ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok?'Tags copied — paste them into the file\u2019s <head>':'Could not copy here');
}
const q=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function downloadBranded(){
  if(!isAdmin()) return toast('Admin only');
  const t=previewLine(), d='Live scores, standings and the knockout draw.';
  try{
    const res=await fetch(location.origin+location.pathname,{cache:'reload'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();
    if(html.indexOf('<title>')<0) throw new Error('not the app file');
    html=html.replace(/<title>[\s\S]*?<\/title>/, '<title>'+q(t)+'</title>');
    const meta=(attr,name,val)=>{
      const re=new RegExp('(<meta '+attr+'="'+name+'" content=")[^"]*(")');
      html=html.replace(re,'$1'+q(val)+'$2');
    };
    meta('property','og:title',t);      meta('name','twitter:title',t);
    meta('property','og:description',d);meta('name','twitter:description',d);
    meta('property','og:site_name',hostName());
    meta('name','description','Live scores — '+t+' · '+hostName());
    /* bake the defaults too, so a brand-new phone opens on the right event */
    const esc1=v=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    html=html.replace(/const EVENT_TITLE = '[^']*';/, "const EVENT_TITLE = '"+esc1(S.meta.title)+"';");
    html=html.replace(/const EVENT_SUB   = '[^']*';/, "const EVENT_SUB   = '"+esc1(S.meta.sub)+"';");
    html=html.replace(/const ORGANISER   = '[^']*';/, "const ORGANISER   = '"+esc1(hostName())+"';");
    html=html.replace(/const CONTACT     = '[^']*';/, "const CONTACT     = '"+esc1(hostPhone())+"';");
    html=html.replace(/const BUILD = '[^']*';/, "const BUILD = 'build "+new Date().toISOString().slice(0,10)+"';");
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='index.html'; a.click();
    toast('Downloaded — upload this as index.html');
  }catch(e){
    toast('Could not read the file here — use “Copy the tags instead”');
  }
}

function brandList(kind){ return kind==='organisers'?(S.organisers||[]):(S.sponsors||[]); }
function findBrand(kind,id){

function brandChanged(msg){

}
function addBrand(kind){

  if(list.length>=max) return toast(max+' is the most that fits');
  list.push({id:kind[0]+Date.now().toString(36), name:'', logo:'', invert:false});

}
function setHostPhone(v){

function setBrandName(kind,id,v){

function toggleBrandInvert(kind,id){

function clearBrandLogo(kind,id){
  if(!isAdmin()) return;
  const o=findBrand(kind,id); if(!o) return;
  if(!confirm('Remove this logo?'+(kind==='host'?' The built-in RISE mark comes back in its place.':''))) return;
  o.logo=''; o.invert=false; brandChanged('Logo removed');
}
function removeBrand(kind,id,quiet){
  if(!isAdmin()||kind==='host') return;
  const o=findBrand(kind,id); if(!o) return;
  if(!quiet && !confirm('Remove '+(o.name||'this entry')+'?')) return;
  const list=brandList(kind).filter(x=>x.id!==id);
  if(kind==='organisers') S.organisers=list; else S.sponsors=list;

function moveBrand(kind,id,dir){
  if(!isAdmin()||kind==='host') return;
  const list=brandList(kind).slice(), i=list.findIndex(o=>o.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const t=list[i]; list[i]=list[j]; list[j]=t;
  if(kind==='organisers') S.organisers=list; else S.sponsors=list;
  brandChanged('Moved');
}

/* A logo arrives as whatever the phone had — often a 3000-pixel photograph or
   a full-resolution PNG. It is redrawn at a size that still looks sharp on a
   retina screen and in print, then kept as a data URL. Shrinking twice if
   needed keeps even a busy logo inside a row the sync can carry; transparency
   survives, because a logo on a dark header needs it. */
const LOGO_BUDGET = 120000;
function pickLogo(kind,id,el){
  const f=el.files&&el.files[0]; el.value='';
  if(!f) return;
  if(!/^image\//.test(f.type)) return toast('That is not an image file');
  readLogo(f).then(d=>{
    const o=findBrand(kind,id); if(!o) return;
    /* a logo just supplied is shown exactly as supplied — the built-in mark's
       dark-mode flip must not carry over onto somebody's colour artwork */
    o.logo=d.url; o.invert=false;
    brandChanged('Logo added · '+Math.round(d.url.length/1366)+' KB');
  }).catch(e=>toast(String(e.message||e)));
}
function readLogo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('That file could not be read'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('That image could not be opened'));
      img.onload=()=>{
        const draw=(maxW,maxH,type,q)=>{
          const s=Math.min(1,maxW/img.width,maxH/img.height);
          const cv=document.createElement('canvas');
          cv.width=Math.max(1,Math.round(img.width*s));
          cv.height=Math.max(1,Math.round(img.height*s));
          const cx=cv.getContext('2d');
          cx.imageSmoothingQuality='high';
          if(type==='image/jpeg'){ cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); }
          cx.drawImage(img,0,0,cv.width,cv.height);
          return cv.toDataURL(type,q);
        };
        let url=draw(440,180,'image/png');
        if(url.length>LOGO_BUDGET) url=draw(300,120,'image/png');
        if(url.length>LOGO_BUDGET) url=draw(440,180,'image/jpeg',.86);
        if(url.length>LOGO_BUDGET) return rej(new Error('That image is too detailed to store — try a simpler logo'));
        res({url});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- the game ----------
   Four presets cover almost every event; the five boxes above them cover the

   result that no longer fits is flagged instead, in the fixtures and here. */
function setupRules(){
  const r=S.rules, odd=oddCount();
  const num=(k,v,min,max,dis)=>`<input class="txt" type="number" inputmode="numeric" min="${min}" max="${max}"

    <div class="frow">

      <div><label class="fl">Win by</label>
        <select class="txt" onchange="setRule('winBy',this.value)">
          <option value="2"${r.winBy===2?' selected':''}>2 clear points</option>
          <option value="1"${r.winBy===1?' selected':''}>1 — first to the target</option></select></div>
      <div><label class="fl">Golden point</label>
        <select class="txt" onchange="setRule('golden',this.value)" ${r.winBy===1?'disabled':''}>
          <option value="1"${r.golden?' selected':''}>On</option>
          <option value="0"${!r.golden?' selected':''}>Off — play on until 2 clear</option></select></div>
      <div><label class="fl">Golden point when level at</label>${num('goldenAt',r.goldenAt,r.target-1,98,!r.golden)}</div>
      <div><label class="fl">Change ends at</label>${num('switchAt',r.switchAt,0,99)}</div>
    </div>
    <div class="alert ok" style="margin-top:12px"><span>🏓</span><span>${esc(rulesPara())}</span></div>
    <p class="hint">Golden point “when level at ${r.target-1}” means ${r.target-1}–${r.target-1} is settled by the
    next rally, so ${r.target} is the highest possible score. Set it higher to play two clear points first —
    ${r.target+2} would let a game run to ${r.target+3}. Change ends at 0 means the pairs never swap.</p>
    ${odd?`<div class="alert warn"><span>⚠</span><span><b>${odd} result${odd>1?'s do':' does'} not fit these rules.</b>
      Nothing has been changed — they still count, and they are marked ⚠ in the fixtures so they can be checked.</span></div>`:''}
    <div class="row" style="margin-top:10px">
      <button class="btn sm" onclick="presetRules(15,17)">15 · win by 2 · golden at 17–17</button>
      <button class="btn sm" onclick="presetRules(15,14)">15 · golden at 14–14</button>
      <button class="btn sm" onclick="presetRules(11,10)">11 · golden at 10–10</button>
      <button class="btn sm" onclick="presetRules(21,20)">21 · golden at 20–20</button>
    </div>
  </div>`;
}
function setRule(k,v){
  if(!isAdmin()) return;
  const r=Object.assign({},S.rules);
  if(k==='golden') r.golden=(v==='1');
  else if(k==='winBy') r.winBy=+v;
  else r[k]=v;
  if(k==='target'){          // the golden point and the change of ends follow the target
    const t=parseInt(v,10);
    if(!isNaN(t) && S.rules.goldenAt===S.rules.target-1) r.goldenAt=t-1;
    if(!isNaN(t) && S.rules.switchAt===Math.ceil(S.rules.target/2)) r.switchAt=Math.ceil(t/2);
  }
  S.rules=normRules(r); applyRules();
  save(); render(); toast('Rules saved · '+rulesShort());
  if(sync.on) drainQueue(6);
}
function presetRules(target,goldenAt){
  if(!isAdmin()) return;
  S.rules=normRules({target,winBy:2,golden:true,goldenAt,switchAt:Math.ceil(target/2)});
  applyRules(); save(); render(); toast('Rules saved · '+rulesShort());
  if(sync.on) drainQueue(6);
}

function drawEdited(){ S.ko={}; S.diamond={}; S.platinum={}; save(); render(); }
function setRoundLabel(ri,v){ S.draw.rounds[ri].label=v.trim()||S.draw.rounds[ri].label; drawEdited(); }
function setTieCode(ri,ti,v){
  v=(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!v) return render();
  if(TIE_CODES().filter(c=>c===v).length) return toast('That code is already used'),render();
  const old=S.draw.rounds[ri].ties[ti][0];
  S.draw.rounds[ri].ties[ti][0]=v;
  /* keep anything that pointed at the old code pointing at the new one */
  const fix=r=>r===('W:'+old)?'W:'+v:r===('L:'+old)?'L:'+v:r;
  S.draw.rounds.forEach(rd=>rd.ties.forEach(t=>{t[1]=fix(t[1]);t[2]=fix(t[2]);}));
  S.draw.gold.forEach(t=>{t[1]=fix(t[1]);t[2]=fix(t[2]);});
  S.draw.diamond=S.draw.diamond.map(fix); S.draw.platinum=S.draw.platinum.map(fix);
  drawEdited();
}
function setTieSrc(ri,ti,slot,v){ S.draw.rounds[ri].ties[ti][slot+1]=v; drawEdited(); }

function nextCode(){
  const used=TIE_CODES();
  for(const c of 'GHIJKLMNOPQRSTUVWXYZ') if(used.indexOf(c)<0) return c;
  let i=1; while(used.indexOf('T'+i)>=0) i++; return 'T'+i;
