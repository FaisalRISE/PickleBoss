/* ========================= PRINT ========================= */
const halve=a=>[a.slice(0,Math.ceil(a.length/2)),a.slice(Math.ceil(a.length/2))];

/* A sheet that is going to be written on by hand should use the whole page.
   Twenty matches on A4 can have boxes a centimetre deep; forty-five have to be
   tighter. The row height is worked out from how many there are and the type
   scales with it, so a sheet fills the paper instead of trailing off into white
   space two-thirds of the way down. */
/* The group sheet is three things stacked: the match cards in two columns, the
   standings, and the score-margin grid. Sizing the cards on their own count
   pushed the grid onto a second page, which then arrived alone with nothing
   else on it — twelve sheets for six groups. So the two tables below are
   measured first, in millimetres, and the cards get exactly what is left. */
function groupFit(g,cardsPerCol){
  if(!cardsPerCol) return null;
  const teams=S.groups[g].teams.length;
  const page=240 - (shownSponsors().length?12:0);   // A4 less the mark and the foot
  const standings=(teams+1)*5.3 + 4;
  const grid=(teams+1)*4.8 + 4;
  const forCards=Math.max(60, page-standings-grid);
  /* a card is a heading row, two score rows and the gap under it */
  const rh=Math.min(9, Math.max(4.1, (forCards/cardsPerCol - 6) / 2));
  const fs=Math.min(11.5, Math.max(8, rh*1.25));
  return `--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(1)}px;--hs:${(fs*0.7).toFixed(1)}px`;
}
/* ---------- fixtures by round, the way a scoreboard reads ----------
   Each round is its own small table under its own heading — the court, the
   two teams with a box each for the score, and a column for whoever referees.
   Read across a row and it is one match; read down and it is the round. */
function roundBlock(title, rows, withData, fit, showGroup){
  if(!rows.length) return '';
  const tm=timed(), first=slotTime(rows[0].m.slot||0);
  const anyMulti=rows.some(r=>courtsOf(r.g).length>1) || showGroup;
  return `<div class="rblk"><h4>${esc(title)}${first?' · '+first:''}</h4>
    <table class="rt" ${fit?`style="${fit}"`:''}>
      <tr>${tm&&!showGroup?'<th class="tm">Time</th>':''}<th class="ct">Court</th>${showGroup?'<th class="gp">Grp</th>':''}
        <th class="n">M</th><th>Team</th><th class="sc">Score</th><th class="gap"></th>
        <th class="sc">Score</th><th>Team</th><th class="rf">Referee</th></tr>
      ${rows.map(({g,m})=>{ const p=withData&&played(m), wa=p&&m.sa>m.sb, wb=p&&m.sb>m.sa;
        return `<tr>${tm&&!showGroup?`<td class="tm">${slotTime(m.slot||0)}</td>`:''}
          <td class="ct">${esc(courtBare(courtName(g,m.c||0)))}</td>${showGroup?`<td class="gp">${g}</td>`:''}
          <td class="n">${m.n}</td>
          <td class="${wa?'w':''}">${esc(m.a)}</td><td class="sc">${p?m.sa:''}</td><td class="gap"></td>
          <td class="sc">${p?m.sb:''}</td><td class="${wb?'w':''}">${esc(m.b)}</td><td class="rf"></td></tr>`; }).join('')}
    </table></div>`;
}
/* how deep a row can be and still keep the group's rounds, its standings and
   its score grid on one page */
function roundFit(g, rounds, matches){
  const teams=S.groups[g].teams.length;
  const page=240 - (shownSponsors().length?12:0);
  /* a round's heading, its column heads and the gap under it come to about 13mm */
  const fixed=(teams+1)*5.3+6 + (teams+1)*4.8+6 + rounds*13;
  const rh=Math.min(9, Math.max(4.9, (page-fixed)/Math.max(1,matches)));
  const fs=Math.min(12.5, Math.max(9, rh*1.75));
  return `--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(1)}px`;
}
/* The whole day across every court, one block per slot: the first match on
   every court, then the second, and so on — the sheet to pin up by the desk so
   anyone can see what is on where, and when. */
function playSheet(withData){
  const courts=allCourts();
  const most=courts.reduce((n,c)=>Math.max(n,courtMatches(c.g,c.ci).reduce((k,m)=>Math.max(k,(m.slot||0)+1),0)),0);
  let h='';
  for(let k=0;k<most;k++){
    const rows=courts.map(c=>{ const m=courtMatches(c.g,c.ci).find(x=>(x.slot||0)===k); return m?{g:c.g,m}:null; })
      .filter(Boolean);
    h+=roundBlock('Slot '+(k+1), rows, withData, '--rh:6.6mm;--fs:11px', true);
  }
  if(!h) return '';
  return sheet('Order of play', courts.length+' courts · '+esc(rulesShort()), h,
    timed()?'Times are a guide — each court starts its next match as soon as it is free'
           :'Each court starts its next match as soon as it is free · set a start time in Setup to print times', '');
}
function sheetFit(n,perCol){
  if(!n) return null;
  /* what is left of an A4 page once the mark at the top and the sponsor and
     host lines at the bottom have taken their share */
  const avail=246 - (shownSponsors().length?14:0);
  const rows=perCol||n;
  /* A court with five matches on it used to come out as a strip across the top
     third of the page. This sheet gets pinned to a post and read from a few
     feet away, so a short one is allowed deep rows and big type rather than
     being held to the size a forty-five-match sheet needs. */
  const rh=Math.min(20, Math.max(4.6, avail/(rows+1)));
  const fs=Math.min(19, Math.max(8.5, rh*1.05));
  return `--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(1)}px;--hs:${(fs*0.68).toFixed(1)}px`;
}
/* A sheet is a one-column table, not a div, and that is deliberate: the mark
   goes in a <thead> and the host line in a <tfoot>, which the browser reprints
   at the top and bottom of every page the sheet spills onto. */
function sheet(title,right,body,legendTxt,cls){
  return `<table class="psheet ${cls||''}">
    <thead><tr><td>${pageHead(title,right)}</td></tr></thead>
    <tfoot><tr><td>${pageFoot(legendTxt)}</td></tr></tfoot>
    <tbody><tr><td>${body}</td></tr></tbody></table>`;
}
function matchCard(g,m,withData,fit){
  const p=withData&&played(m);
  const cell=(nm,sc,win)=>`<tr class="${p&&win?'win':''}"><td>${esc(nm)}</td>
    <td class="c">${p?sc:'&nbsp;'}</td><td class="wl">${p?(win?'W':'L'):'&nbsp;'}</td></tr>`;
  const multi=courtsOf(g).length>1;
  return `<table class="mc ${fit?'fit':''}" ${fit?`style="${fit}"`:''}>
    <tr><th>Group ${g} &nbsp;·&nbsp; Match ${m.n}${multi?' &nbsp;·&nbsp; '+esc(courtName(g,m.c||0)):''}</th>
      <th class="c">Score</th><th class="c">W/L</th></tr>
    ${cell(m.a,m.sa,p&&m.sa>m.sb)}${cell(m.b,m.sb,p&&m.sb>m.sa)}</table>`;
}
/* The same fixtures as one tight table rather than a card each — what a referee
   wants pinned to the net post on their own court, where the running order
   matters more than room to write. */
function fixtureTable(g,list,withData,hideCourt,fit){
  const multi=!hideCourt && g && courtsOf(g).length>1;
  const slots=g && courtsOf(g).length>1;
  return `<table class="fx ${fit?'fit':''}" ${fit?`style="${fit}"`:''}>
    <tr><th class="c n">M</th>${slots?'<th class="c n">Slot</th>':''}${multi?'<th class="c n">Court</th>':''}
      <th>Pair</th><th class="c sc">Score</th><th class="c sc">Score</th><th>Pair</th></tr>
    ${list.map((m,i)=>{ const p=withData&&played(m), wa=p&&m.sa>m.sb, wb=p&&m.sb>m.sa;
      return `<tr class="${i%2?'alt':''}"><td class="c n">${m.n}</td>
        ${slots?`<td class="c n">${(m.slot||0)+1}</td>`:''}
        ${multi?`<td class="c n">${esc(shortCourt(courtName(g,m.c||0)))}</td>`:''}
        <td class="ra ${wa?'w':''}">${esc(m.a)}</td><td class="c sc">${p?m.sa:''}</td>
        <td class="c sc">${p?m.sb:''}</td><td class="pr ${wb?'w':''}">${esc(m.b)}</td></tr>`; }).join('')}
  </table>`;
}
/* one sheet per court: the running order for whoever is standing on it */
function courtSheet(g,ci,withData){
  const ms=courtMatches(g,ci); if(!ms.length) return '';
  const name=courtName(g,ci), multi=courtsOf(g).length>1;
  return sheet(esc(name), 'Group '+g+' · '+esc(rulesShort()),
    fixtureTable(g,ms,withData,true,sheetFit(ms.length)),
    'Order of play on this court · Group '+g+' runs on '+esc(courtLabel(g))
      +(multi?' · the slot is the wave of matches going on across all of them at once':''),
    'ctsheet');
}
/* One line per pair: the courts they are wanted on, in the order they play. A
   player does not care about the draw, only about where to stand and roughly
   when — so the cell is the court with the slot under it, and the columns run
   left to right through their day. */
function routesSheet(g,withData){
  const G=S.groups[g]; if(!G.teams.length) return '';
  const per={}; G.teams.forEach(t=>per[t]=[]);
  G.matches.forEach(m=>{ if(per[m.a]) per[m.a].push(m); if(per[m.b]) per[m.b].push(m); });
  const most=G.teams.reduce((n,t)=>Math.max(n,per[t].length),0);
  if(!most) return '';
  const cols=[]; for(let i=1;i<=most;i++) cols.push(i);
  const multi=courtsOf(g).length>1;
  const rh=Math.min(19,Math.max(5,(228-(shownSponsors().length?14:0))/(G.teams.length+1)));
  const fs=Math.min(15,Math.max(8,rh*0.78));
  return sheet('Where each pair plays · Group '+g,
    esc(courtLabel(g))+' · '+esc(rulesShort()),
    `<table class="routes" style="--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(1)}px">
      <tr><th class="who">Pair</th>${cols.map(i=>`<th>${i}</th>`).join('')}</tr>
      ${G.teams.map(t=>`<tr><td class="who">${esc(t)}</td>
        ${cols.map(i=>{ const m=per[t][i-1];
          if(!m) return '<td class="bye">—</td>';
          const opp=m.a===t?m.b:m.a;
          const done=withData&&played(m);
          return `<td class="${done?'done':''}" title="${attr(opp)}">
            <span class="ct">${multi?esc(shortCourt(courtName(g,m.c||0))):'M'+m.n}</span>
            <span class="sl">${multi?('slot '+((m.slot||0)+1)):esc(opp).slice(0,14)}</span></td>`; }).join('')}
      </tr>`).join('')}
    </table>`,
    multi?'The letter is the court, the small number is the slot — pin this up where the pairs can see it'
      :'Each column is one of that pair\'s matches, in the order they play them',
    'ctsheet');
}
function marginGrid(g,withData){
  const G=S.groups[g], st=withData?standings(g):null, T=G.teams, res={};
  G.matches.forEach(m=>{ if(played(m)){res[m.a+'||'+m.b]=[m.sa,m.sb];res[m.b+'||'+m.a]=[m.sb,m.sa];} });
  const rk={},df={},wn={}; if(st) st.forEach(r=>{rk[r.team]=r.rank;df[r.team]=r.d;wn[r.team]=r.w;});
  const marks=withData?h2hMarks(g):{};
  return `<div class="gridT"><div class="cap">Score margin</div><table class="grid">
    <tr><th style="text-align:left">Group ${g}</th>${T.map(t=>`<th class="v">${esc(t)}</th>`).join('')}
      <th>Wins</th><th>Diff</th><th>Rank</th><th>H2H</th></tr>
    ${T.map(r=>`<tr><td class="nm">${esc(r)}</td>
      ${T.map(c=>{ if(r===c)return '<td class="dg"></td>'; const v=withData?res[r+'||'+c]:null;
        return `<td class="c">${v?v[0]+' – '+v[1]:'&nbsp;'}</td>`; }).join('')}
      <td class="tot">${st?wn[r]:'&nbsp;'}</td><td class="tot">${st?(df[r]>0?'+':'')+df[r]:'&nbsp;'}</td>
      <td class="tot">${st?rk[r]:'&nbsp;'}</td>
      <td class="tot ${marks[r]==='W'?'h2hw':marks[r]==='L'?'h2hl':''}">${marks[r]||'&nbsp;'}</td></tr>`).join('')}
  </table></div>`;
}
/* one group's table — also used, larger, on the summary page */
/* Every standings table is cut to the same column widths, so six of them on a
   page line up with one another instead of each finding its own width from
   whatever names happen to be in it. */
const ST_COLS=`<colgroup><col class="cR"><col><col class="cN"><col class="cN"><col class="cN">
  <col class="cS"><col class="cS"><col class="cD"><col class="cH"></colgroup>`;
function groupTable(g,withData,cls){
  const st=standings(g), marks=withData?h2hMarks(g):{};
  return `<div class="gridT"><div class="cap">Standings</div>
    <table class="grid st ${cls||''}">${ST_COLS}
    <tr><th>#</th><th style="text-align:left">Pair</th><th>P</th><th>W</th><th>L</th>
      <th>+</th><th>–</th><th>Diff</th><th>H2H</th></tr>
    ${st.map(r=>`<tr><td class="c">${withData?r.rank:''}</td><td class="nm">${esc(r.team)}</td>
      <td class="c">${withData?r.p:''}</td><td class="c">${withData?r.w:''}</td>
      <td class="c">${withData?r.l:''}</td><td class="c">${withData?r.pf:''}</td>
      <td class="c">${withData?r.pa:''}</td>
      <td class="c">${withData?((r.d>0?'+':'')+r.d):''}</td>
      <td class="c ${marks[r.team]==='W'?'h2hw':marks[r.team]==='L'?'h2hl':''}">${marks[r.team]||''}</td></tr>`).join('')}
    </table></div>`;
}
/* A group's sheet. On its own court a group's matches are simply one list
   — "Group A League Matches". Spread across courts it plays in rounds, every
   pair once per round, so the list is cut into those rounds. With scores the
   standings and the score grid follow, set large; a blank sheet carries only
   the score grid, to be filled in by hand. */
function groupSheet(g,withData){
  const G=S.groups[g]; if(!G.teams.length)return '';
  const multi=courtsOf(g).length>1;
  const rds=multi?groupRounds(g):[];
  const sizes=groupSheetFit(g, withData, multi?rds.length:1, G.matches.length);
  const fixtures = multi
    ? rds.map(rd=>roundBlock('Group '+g+' · Round '+rd.no, rd.list.map(m=>({g,m})), withData, sizes.fx, false)).join('')
    : roundBlock('Group '+g+' League Matches',
        G.matches.slice().sort((a,b)=>a.n-b.n).map(m=>({g,m})), withData, sizes.fx, false);
  const strip=h=>h.replace(/<div class="cap">[^<]*<\/div>/,'');
  return sheet('Group '+g, esc(courtLabel(g))+' · '+esc(rulesShort()),
    `${fixtures}
    <div class="gsT" style="${sizes.tb}">
      ${withData?`<h4 class="psec">Group ${g} Standings</h4>${strip(groupTable(g,true,''))}`:''}
      <h4 class="psec">Score Margin</h4>${strip(marginGrid(g,withData))}
    </div>`,
    (withData?'H2H separates pairs level on wins and difference · ':'')+
    "the score grid reads the row team's score – the column team's score");
}
/* how deep each row can be and still keep the whole group on one page */
function groupSheetFit(g, withData, blocks, matches){
  const teams=S.groups[g].teams.length;
  const page=238 - (shownSponsors().length?12:0);
  const tables=withData?2:1;
  const overhead=blocks*13 + tables*11;
  const rh=Math.min(9.5, Math.max(5, (page-overhead)/(matches + tables*1.12*(teams+1))));
  const trh=rh*1.12;
  const fs=Math.min(13, Math.max(9.5, rh*1.6)), tfs=Math.min(13.5, Math.max(10, trh*1.5));
  return { fx:`--rh:${rh.toFixed(2)}mm;--fs:${fs.toFixed(1)}px`,
           tb:`--trh:${trh.toFixed(2)}mm;--tfs:${tfs.toFixed(1)}px` };
}
function koRow(nm,seed,sc,wl,withData){
  return `<tr class="${wl==='W'?'win':''}"><td class="seed">${esc(seed)}</td>
    <td class="${nm&&withData?'':'tbd'}">${nm&&withData?esc(nm):'&nbsp;'}</td>
    <td class="c">${sc}</td><td class="wl">${wl}</td></tr>`;
}
function koTieBox(code,x,y,withData,title){
  const t=S.ko[code]||{}; const p=withData&&t.sa!=null&&t.sb!=null;
  const head = title || (esc(printRef(x))+' vs '+esc(printRef(y))+' = '+code);
  return `<table class="ko"><tr><th colspan="2">${head}</th>
    <th class="c">Score</th><th class="c">W/L</th></tr>
    ${koRow(t.a,printRef(x),p?t.sa:'&nbsp;',p?(t.sa>t.sb?'W':'L'):'&nbsp;',withData)}
    ${koRow(t.b,printRef(y),p?t.sb:'&nbsp;',p?(t.sb>t.sa?'W':'L'):'&nbsp;',withData)}</table>`;
}
/* A league match is between two of the league's sources — the Diamond league
   is the winners of M, N and O — so each box is headed with them and they sit
   in the seed column, exactly like a knockout box. A blank sheet used to show
   two empty rows with nothing to say who was meant to be in them. */
function leagueBox(which,i,withData){
  const m=(which==='diamond'?S.diamond:S.platinum)[i]||{}; const p=withData&&m.sa!=null&&m.sb!=null;
  const src=which==='diamond'?DIAMOND_SRC():PLATINUM_SRC(), pr=leaguePairs(src.length)[i]||[];
  const x=printRef(src[pr[0]]), y=printRef(src[pr[1]]);
  return `<table class="ko"><tr><th colspan="2">${esc(which==='diamond'?nmD():nmP())} · ${esc(x)} vs ${esc(y)}</th>
    <th class="c">Score</th><th class="c">W/L</th></tr>
    ${koRow(m.a,x,p?m.sa:'&nbsp;',p?(m.sa>m.sb?'W':'L'):'&nbsp;',withData)}
    ${koRow(m.b,y,p?m.sb:'&nbsp;',p?(m.sb>m.sa?'W':'L'):'&nbsp;',withData)}</table>`;
}
/* every printed page carries the mark and the number, so a sheet that gets
   separated from the pile still says who to call */
function pageHead(title,right){
  return `<div class="brandbar">
    ${leadMarks().map(o=>orgLogo(o)?`<img src="${orgLogo(o)}" alt="${esc(o.name)}">`:'').join('')}
    <div class="bt"><div class="t">${title}</div>
      <div class="r">${esc(S.meta.title)}${S.meta.sub?' · '+esc(S.meta.sub):''}${right?' · '+right:''}</div></div>
    ${eventPhone()?`<div class="ct">Queries on court<b>${esc(eventPhone())}</b>${esc(organiserLine()||hostName())}</div>`:''}
  </div>`;
}
/* Sponsors run along the bottom of every sheet and the host line closes it, so
   a page that gets separated from the pile still says who ran it and who to
   call. Anything explaining the table above sits directly under it instead. */
function sponsorStrip(){
  const sp=shownSponsors(); if(!sp.length) return '';
  return `<div class="pstrip"><span class="plbl">${sp.length===1?'Sponsor':'Sponsors'}</span>
    ${sp.map(o=>`<span class="pitem">${orgLogo(o)?`<img src="${orgLogo(o)}" alt="">`:''}
      ${o.name?`<span>${esc(o.name)}</span>`:''}</span>`).join('')}</div>`;
}
function pageFoot(note){
  const hp=hostPhone(), src=orgLogo(HOST());
  return `${note?`<div class="legend">${note}</div>`:''}${sponsorStrip()}
  <div class="pagefoot">
    <span class="hostMark">
      ${src?`<img src="${src}" alt="${esc(hostName())}">`:''}
      <b>${esc(hostName())}</b>${hp?`<i>${esc(hp)}</i>`:''}
    </span></div>`;
}
/* a league's table, printed */
function leaguePrintTable(store,src,withData){
  const st=withData?leagueTable(store,src):[];
  const names=src.map(refName);
  /* a blank sheet is blank — the names go in by hand, like the scores */
  const rows = st.length?st:names.map((n,i)=>({rank:'',team:withData?(n||''):'',seed:printRef(src[i]),
    p:'',w:'',l:'',pf:'',pa:'',d:''}));
  if(!rows.length) return '';
  return `<table class="grid st lg"><colgroup><col class="cR"><col><col class="cN"><col class="cN"><col class="cN">
      <col class="cS"><col class="cS"><col class="cD"></colgroup>
      <tr><th>#</th><th style="text-align:left">Pair</th>
      <th>P</th><th>W</th><th>L</th><th>+</th><th>–</th><th>Diff</th></tr>
    ${rows.map(r=>`<tr><td class="c">${r.rank}</td><td class="nm">${r.team?esc(r.team)
        :`<span class="seedTag">${esc(r.seed||'')}</span>`}</td>
      <td class="c">${r.p}</td><td class="c">${r.w}</td><td class="c">${r.l}</td>
      <td class="c">${r.pf}</td><td class="c">${r.pa}</td>
      <td class="c">${r.d===''?'':(r.d>0?'+':'')+r.d}</td></tr>`).join('')}
  </table>`;
}
/* the top three, printed the same way everywhere */
function podiumPrint(title,names){
  const cell=(lbl,nm,cls)=>`<td class="pod ${cls}">
    <div class="pl">${lbl}</div><div class="pn">${nm?esc(nm):'&nbsp;'}</div></td>`;
  return `<table class="podium3"><tr><th colspan="3">${title}</th></tr>
    <tr>${cell('1st · Champions',names[0],'g')}${cell('2nd · Runners-up',names[1],'s')}${cell('3rd',names[2],'b')}</tr>
  </table>`;
}
/* The finals on paper. The knockout rounds share one page with boxes deep
   enough to write a score in; then each league gets a page of its own — its
   matches, its table and its top three — so the three can be handed to three
   different tables on the day. */
function finalsFit(){
  const boxRows=ROUNDS().reduce((n,r)=>n+Math.ceil(r.ties.length/2),0);
  const page=228-(shownSponsors().length?12:0)-ROUNDS().length*11;
  const krh=Math.min(13, Math.max(6.5, (page/Math.max(1,boxRows)-10)/2));
  const kfs=Math.min(16, Math.max(11, krh*1.25));
  return `--krh:${krh.toFixed(2)}mm;--kfs:${kfs.toFixed(1)}px`;
}
const LEAGUE_FIT='--krh:11mm;--kfs:15px;--trh:9mm;--tfs:13.5px';
function finalsSheet(withData){
  let out='';
  /* Each knockout round is its own sheet. Printed upright they run together
     onto one page under a single heading; printed sideways there is not the
     height for that, so each round takes a page of its own with its own
     heading. The browser picks whichever applies from the paper itself. */
  if(ROUNDS().length){
    const fit=finalsFit(), R=ROUNDS(), last=R.length-1;
    R.forEach((r,i)=>{
      const h=`<div class="rlbl">${r.label}</div><div class="rows">`+
        r.ties.map(([c,x,y])=>koTieBox(c,x,y,withData)).join('')+`</div>`;
      out+=sheet(`<span class="oP">Knockout draw</span><span class="oL">${esc(r.label)}</span>`,
        `<span class="oP">${R.map(x=>esc(x.label)).join(' · ')} · </span>`+esc(rulesShort()),
        `<div class="kobig" style="${fit}">${h}</div>`, '',
        'koR'+(i===0?' koFirst':'')+(i===last?' koLast':''));
    });
  }
  [['diamond',nmD(),DIAMOND_SRC(),'Group winners and runners-up'],
   ['platinum',nmP(),PLATINUM_SRC(),'Beaten semi-finalists']].forEach(([w,nm,src,who])=>{
    const n=leaguePairs(src.length).length; if(!n) return;
    const final=src.length<=2;
    let h=`<div class="rlbl">${final?esc(nm)+' final':esc(nm)+' league · round robin'}</div><div class="rows">`+
      [...Array(n).keys()].map(i=>leagueBox(w,i,withData)).join('')+`</div>`;
    if(!final) h+=`<h4 class="psec">${esc(nm)} league table</h4>${leaguePrintTable(w==='diamond'?S.diamond:S.platinum,src,withData)}`;
    const st=withData?leagueTable(w==='diamond'?S.diamond:S.platinum,src):[];
    h+=podiumPrint(esc(nm)+' placings',[st[0]&&st[0].team,st[1]&&st[1].team,st[2]&&st[2].team]);
    out+=sheet(esc(nm)+(final?' final':' league'), who, `<div class="kobig gsT" style="${LEAGUE_FIT}">${h}</div>`,
      final?'':'Wins, then point difference, then points scored.');
  });
  const GT=GOLD_TIES();
  if(GT.length){
    let h=`<div class="rlbl">${esc(nmG())} league</div><div class="rows">`+
      GT.map(([c,x,y])=>koTieBox(c,x,y,withData)).join('')+`</div>`;
    const gs=withData?goldStanding():{rank:[],pairs:[],tied:[],champion:''};
    if(gs.pairs.length){
      h+=`<div class="rlbl">${esc(nmG())} decider · level on margin</div><div class="rows">`+
        gs.pairs.map(([c],i)=>koTieBox(c,'','',withData,esc(nmG())+' decider '+(gs.pairs.length>1?(i+1):''))).join('')+`</div>`;
    }
    h+=`<h4 class="psec">${esc(nmG())} order · by winning margin</h4>
      <table class="grid st lg"><colgroup><col class="cR"><col><col class="cD"><col class="cD"></colgroup>
      <tr><th>#</th><th style="text-align:left">Pair</th><th>Tie</th><th>Won by</th></tr>
      ${(gs.rank.length?gs.rank:GT.map(()=>null)).map((r,i)=>`<tr><td class="c">${r?i+1:''}</td>
        <td class="nm">${r?esc(r.win):'&nbsp;'}</td><td class="c">${r?r.code:''}</td>
        <td class="c">${r?'+'+r.marg:''}</td></tr>`).join('')}
      </table>`;
    h+=podiumPrint(esc(nmG())+' placings',gs.champion?gs.rank.map(r=>r.win):[]);
    out+=sheet(esc(nmG())+' league','Group third-placed pairs',
      `<div class="kobig gsT" style="${LEAGUE_FIT}">${h}</div>`,
      esc(nmG())+' is decided by the biggest winning margin; level margins are played off.');
  }
  return out;
}
function standingsSheet(withData){
  let h='';
  const half=Math.ceil(GROUPS.length/2);
  const colA=GROUPS.slice(0,half), colB=GROUPS.slice(half);
  const rowsOf=c=>c.reduce((n,g)=>n+S.groups[g].teams.length+1,0);
  const dsrc=DIAMOND_SRC(), psrc=PLATINUM_SRC();
  const dl=withData?leagueTable(S.diamond,dsrc):[], pl=withData?leagueTable(S.platinum,psrc):[];
  const gs=withData?goldStanding():{rank:[]};
  const champs=withData&&(dl.length||pl.length||gs.rank.length);
  /* the tables share the page with the champions block, so the rows are made
     as deep as the space allows — big enough to read across a room, never so
     big the page spills */
  const page=236-(shownSponsors().length?12:0)-(champs?46:0);
  const per=Math.max(colA.length,colB.length);
  const rh=Math.min(8.5, Math.max(5.4, (page-per*15)/Math.max(rowsOf(colA),rowsOf(colB),1)));
  const fs=Math.min(13, Math.max(10, rh*1.55));
  const block=g=>`<div class="sgrp"><h4 class="psec">Group ${g} <span>· ${esc(courtLabel(g))}</span></h4>
    ${groupTable(g,withData,'').replace(/<div class="cap">[^<]*<\/div>/,'')}</div>`;
  h+=`<div class="gsT" style="--trh:${rh.toFixed(2)}mm;--tfs:${fs.toFixed(1)}px">
    <div class="cols sc2"><div>${colA.map(block).join('')}</div><div>${colB.map(block).join('')}</div></div></div>`;
  if(champs){
    h+=`<div class="champWrap">`;
    if(dl.length) h+=champBlock(esc(nmD()),[dl[0]&&dl[0].team,dl[1]&&dl[1].team,dl[2]&&dl[2].team]);
    if(pl.length) h+=champBlock(esc(nmP()),[pl[0]&&pl[0].team,pl[1]&&pl[1].team,pl[2]&&pl[2].team]);
    if(gs.rank.length) h+=champBlock(esc(nmG()),gs.rank.map(r=>r.win));
    h+=`</div>`;
  }
  return sheet('Final standings','All '+GROUPS.length+' group'+(GROUPS.length===1?'':'s'), h,
    'Wins, then point difference, then head-to-head among the pairs still level, then points scored.');
}
/* the headline block: who actually won what, given room to breathe */
function champBlock(title,names){
  const row=(lbl,nm,cls)=>`<tr class="${cls}"><td class="pl">${lbl}</td>
    <td class="pn">${nm?esc(nm):'&nbsp;'}</td></tr>`;
  return `<table class="champ3"><tr><th colspan="2">${title}</th></tr>
    ${row('1st',names[0],'g')}${row('2nd',names[1],'s')}${row('3rd',names[2],'b')}</table>`;
}
function teamsSheet(){
  let h='';
  const half=Math.ceil(GROUPS.length/2);
  h+=`<div class="cols"><div>`;
  GROUPS.forEach((g,i)=>{
    if(i===half) h+=`</div><div>`;
    const G=S.groups[g];
    h+=`<table class="mc"><tr><th>Group ${g}</th><th class="c">${esc(courtLabel(g))}</th></tr>
      ${G.teams.map((t,j)=>`<tr><td>${esc(t)}</td><td class="c">${j+1}</td></tr>`).join('')}
      </table>`;
  });
  return sheet('Teams &amp; courts',GROUPS.length+' group'+(GROUPS.length===1?'':'s')+
    ' · '+allCourts().length+' court'+(allCourts().length===1?'':'s'), h+`</div></div>`, '');
}
function printHTML(withData, only){
  /* every group's fixture sheet, without the draws or the summary */
  if(only==='groups')    return GROUPS.map(g=>groupSheet(g,withData)).join('');
  if(only==='finals')    return finalsSheet(withData);
  if(only==='standings') return standingsSheet(withData);
  if(only==='teams')     return teamsSheet();
  if(only==='courts')    return allCourts().map(c=>courtSheet(c.g,c.ci,withData)).join('');
  if(only==='routes')    return GROUPS.map(g=>routesSheet(g,withData)).join('');
  if(only==='play')      return playSheet(withData);
  if(/^court:/.test(only||'')){ const p=only.split(':'); return courtSheet(p[1],+p[2],withData); }
  if(only)               return groupSheet(only, withData);
  /* the whole book: fixtures, the draws, then the standings summary */
  return GROUPS.map(g=>groupSheet(g,withData)).join('')
       + finalsSheet(withData)
       + (withData?standingsSheet(true):'');
}
function doPrint(mode, only){
  /* a viewer or referee has no print controls at all, so this is only
     reachable if something went wrong, or was poked at */
  if(!canExport()) return toast('Not allowed on this device');
  document.getElementById('printArea').innerHTML = printHTML(mode==='data', only);
  window.print();
}

/* ========================================================================
   STANDINGS AS A PICTURE

   A screenshot of a PDF is already a picture of a picture: the PDF is drawn at
   screen resolution, the screenshot captures those same pixels, and anyone who
   pins it open on a phone is enlarging a thousand-pixel image into a three
   thousand-pixel space. Letters that were never sharp get softer.

   So the table is drawn here instead, straight onto a canvas, at three times
   the size it is meant to be read at. Nothing is ever enlarged — the text is
   laid down at 3,600 pixels across and shown at 1,200, which is why it stays
   clean however far in it is zoomed. It is a PNG, so the flat colours and hard
   rules stay exactly as drawn, with none of the smearing JPEG puts around
   small text. The result is made to be dropped straight into a WhatsApp group.
   ===================================================================== */
const IMG_W=1200, IMG_PAD=48, IMG_SCALE=3;
const IMG_INK='#15181d', IMG_MUTED='#6b7280', IMG_LINE='#d9dde3',
      IMG_HEAD='#eef1f5', IMG_PAPER='#ffffff', IMG_ALT='#f7f9fb';
/* the top three carry a tint and a bar down the left edge. The tint alone was
   not enough — second place in a pale grey looked exactly like the striping on
   every other row, so the bar is what actually says "this is a podium place". */
const IMG_POD =['', '#fdf3cd', '#e7eaef', '#f6e5d2'];     // 1st, 2nd, 3rd
const IMG_BAR =['', '#d8a520', '#9aa3ad', '#b57c42'];
const IMG_FONT='Outfit, "Segoe UI", Arial, Helvetica, sans-serif';

const ifont=(px,w)=>`${w||400} ${px}px ${IMG_FONT}`;
function imgLoad(src){
  return new Promise(res=>{ if(!src) return res(null);
    const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
/* a name that will not fit is cut with an ellipsis rather than running through
   the column beside it */
function fitText(ctx,txt,max){
  let s=String(txt==null?'':txt);
  if(ctx.measureText(s).width<=max) return s;
  while(s.length>1 && ctx.measureText(s+'…').width>max) s=s.slice(0,-1);
  return s+'…';
}
const imgRight=(ctx,t,x,y)=>{ ctx.textAlign='right'; ctx.fillText(t,x,y); ctx.textAlign='left'; };
const imgMid  =(ctx,t,x,y)=>{ ctx.textAlign='center'; ctx.fillText(t,x,y); ctx.textAlign='left'; };
function imgRule(ctx,x1,y,x2,col){ ctx.strokeStyle=col||IMG_LINE; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x1,y+0.5); ctx.lineTo(x2,y+0.5); ctx.stroke(); }

/* the rows and the column widths, worked out before anything is drawn so the
   canvas can be made exactly tall enough */
function imgPlan(groups){
  const w=IMG_W-IMG_PAD*2;
  const data=groups.map(g=>{ const rows=standings(g), marks=h2hMarks(g);
    return { g:g, rows:rows, marks:marks,
             qual:rows.map(r=>r.p?qualFor(g,r.rank):null),
             anyH2H:Object.keys(marks).length>0 }; });
  const h2h=data.some(d=>d.anyH2H);
  const qual=data.some(d=>d.qual.some(Boolean));
  const cols={rank:62, p:52, w:52, l:52, pf:64, pa:64, d:72, h2h:h2h?56:0, q:qual?128:0};
  cols.team=w-(cols.rank+cols.p+cols.w+cols.l+cols.pf+cols.pa+cols.d+cols.h2h+cols.q);
  const rowH=54, headH=44, bannerH=62, gapH=34;
  let h=0;
  h+=112;                                        // the marks across the top
  h+=96;                                         // event name and subtitle
  data.forEach(d=>{ h+=bannerH+headH+d.rows.length*rowH+gapH; });
  h+=26;                                         // how the order was decided
  h+=shownSponsors().length?44:0;
  h+=74;                                         // the host line
  return {data:data, cols:cols, rowH:rowH, headH:headH, bannerH:bannerH, gapH:gapH, h:Math.round(h)};
}

/* Phones put a ceiling on how many pixels a canvas may hold — older iPhones
   stop at about sixteen million and hand back a blank image rather than an
   error. Three times size is the aim; a very tall sheet settles for a little
   less rather than coming out empty. */
const IMG_MAX_PX=16000000;
const imgScale = h => Math.min(IMG_SCALE, Math.max(1.5, Math.sqrt(IMG_MAX_PX/(IMG_W*h))));

async function standingsCanvas(only){
  const groups=((only&&S.groups[only])?[only]:GROUPS).filter(g=>S.groups[g].teams.length);
  if(!groups.length) throw new Error('no teams to show yet');
  const plan=imgPlan(groups), cols=plan.cols;
  const sc=imgScale(plan.h);
  const cv=document.createElement('canvas');
  cv.width=Math.round(IMG_W*sc); cv.height=Math.round(plan.h*sc);
  const ctx=cv.getContext('2d');
  ctx.scale(sc,sc);
  ctx.textBaseline='alphabetic';
  ctx.fillStyle=IMG_PAPER; ctx.fillRect(0,0,IMG_W,plan.h);

  const marks=await Promise.all(leadMarks().map(o=>imgLoad(orgLogo(o))));
  const hostIm=await imgLoad(orgLogo(HOST()));
  const sponIm=await Promise.all(shownSponsors().map(o=>imgLoad(orgLogo(o))));

  const L=IMG_PAD, R=IMG_W-IMG_PAD;
  let y=IMG_PAD;

  /* ---- the organisers' marks, then the event ---- */
  let x=L, top=y;
  leadMarks().forEach((o,i)=>{
    const im=marks[i];
    if(im){ const hgt=48, wid=Math.min(170, im.width*(hgt/im.height));
      ctx.drawImage(im,x,top,wid,hgt); x+=wid+18; }
    else if(o.name){ ctx.font=ifont(26,700); ctx.fillStyle=IMG_INK;
      ctx.fillText(o.name,x,top+32); x+=ctx.measureText(o.name).width+20; }
  });
  ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED;
  imgRight(ctx,'STANDINGS',R,top+20);
  ctx.font=ifont(14,400);
  imgRight(ctx,new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),R,top+42);
  y=top+64;

  ctx.font=ifont(40,800); ctx.fillStyle=IMG_INK;
  ctx.fillText(fitText(ctx,S.meta.title,R-L),L,y+34); y+=48;
  const sub=[S.meta.sub, organiserLine()?'Organised by '+organiserLine():''].filter(Boolean).join(' · ');
  if(sub){ ctx.font=ifont(20,400); ctx.fillStyle=IMG_MUTED;
    ctx.fillText(fitText(ctx,sub,R-L),L,y+20); }
  y+=34;
  imgRule(ctx,L,y,R,'#c9ced6'); y+=plan.gapH;

  /* ---- a block per group ---- */
  plan.data.forEach(d=>{
    const G=S.groups[d.g], done=G.matches.filter(played).length;
    ctx.font=ifont(28,800); ctx.fillStyle=IMG_INK;
    ctx.fillText('Group '+d.g,L,y+26);
    ctx.font=ifont(16,400); ctx.fillStyle=IMG_MUTED;
    const right=[courtLabel(d.g), G.teams.length+' teams',
                 done+' of '+G.matches.length+' played'].join('  ·  ');
    imgRight(ctx,right,R,y+26);
    y+=plan.bannerH-18;

    /* column heads */
    ctx.fillStyle=IMG_HEAD; ctx.fillRect(L,y,R-L,plan.headH);
    ctx.font=ifont(14,700); ctx.fillStyle=IMG_MUTED;
    let cx=L+14;
    ctx.fillText('#',cx,y+28); cx=L+cols.rank;
    ctx.fillText('PAIR',cx+4,y+28); cx+=cols.team;
    [['P',cols.p],['W',cols.w],['L',cols.l],['FOR',cols.pf],['AGST',cols.pa],['DIFF',cols.d]]
      .forEach(([lbl,wd])=>{ imgMid(ctx,lbl,cx+wd/2,y+28); cx+=wd; });
    if(cols.h2h){ imgMid(ctx,'H2H',cx+cols.h2h/2,y+28); cx+=cols.h2h; }
    if(cols.q) ctx.fillText('QUALIFIES',cx+8,y+28);
    y+=plan.headH;

    d.rows.forEach((r,i)=>{
      const pod=(r.p&&r.rank<=3)?IMG_POD[r.rank]:'';
      ctx.fillStyle=pod||(i%2?IMG_ALT:IMG_PAPER);
      ctx.fillRect(L,y,R-L,plan.rowH);
      if(pod){ ctx.fillStyle=IMG_BAR[r.rank]; ctx.fillRect(L,y,5,plan.rowH); }
      const mid=y+plan.rowH/2+8;
      let c=L+18;
      ctx.fillStyle=IMG_INK;
      ctx.font=ifont(r.rank<=3?22:20, r.rank<=3?800:600);
      ctx.fillText(r.p?String(r.rank):'–',c,mid);
      c=L+cols.rank;
      ctx.font=ifont(22, r.rank<=3?800:600);
      ctx.fillText(fitText(ctx,r.team,cols.team-14),c+4,mid);
      c+=cols.team;
      const cells=[[r.p,cols.p,600],[r.w,cols.w,800],[r.l,cols.l,600],
                   [r.pf,cols.pf,600],[r.pa,cols.pa,600],[sgnTxt(r.d),cols.d,800]];
      cells.forEach(([v,wd,wt])=>{ ctx.font=ifont(21,wt); ctx.fillStyle=IMG_INK;
        imgMid(ctx,String(v==null?'':v),c+wd/2,mid); c+=wd; });
      if(cols.h2h){ const mk=d.marks[r.team]||'';
        ctx.font=ifont(19,800);
        ctx.fillStyle = mk==='W'?'#1f7a3d' : mk==='L'?'#9a3b3b' : IMG_MUTED;
        imgMid(ctx,mk,c+cols.h2h/2,mid); c+=cols.h2h; }
      if(cols.q){ const q=d.qual[i];
        if(q){ ctx.font=ifont(14,800);
          const tw=ctx.measureText(q.label.toUpperCase()).width+18;
          /* third place already sits on a bronze tint, so a pale gold chip
             disappeared into it — the badge is given its own weight */
          ctx.fillStyle = q.cls==='tGold' ? '#f0d9a8' : '#e3edf7';
          ctx.fillRect(c+8,y+plan.rowH/2-13,Math.min(tw,cols.q-14),26);
          ctx.fillStyle = q.cls==='tGold' ? '#6f4a12' : '#1d4e78';
          ctx.fillText(fitText(ctx,q.label.toUpperCase(),cols.q-32),c+17,mid-1); } }
      imgRule(ctx,L,y+plan.rowH,R);
      y+=plan.rowH;
    });
    imgRule(ctx,L,y,R,'#aeb5bf');
    y+=plan.gapH;
  });

  /* ---- how the order was decided, then who ran it ---- */
  ctx.font=ifont(15,400); ctx.fillStyle=IMG_MUTED;
  ctx.fillText('Wins, then point difference, then head-to-head among the pairs still level, '
    +'then points scored · '+rulesShort(),L,y+12);
  y+=30;
  if(sponIm.length){
    let sx=L; ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED;
    const lbl=shownSponsors().length===1?'SPONSOR':'SPONSORS';
    ctx.fillText(lbl,sx,y+22); sx+=ctx.measureText(lbl).width+18;
    shownSponsors().forEach((o,i)=>{ const im=sponIm[i];
      if(im){ const hgt=28, wid=Math.min(110,im.width*(hgt/im.height));
        ctx.drawImage(im,sx,y+2,wid,hgt); sx+=wid+16; }
      else if(o.name){ ctx.font=ifont(16,400); ctx.fillStyle=IMG_INK;
        ctx.fillText(o.name,sx,y+22); sx+=ctx.measureText(o.name).width+18; } });
    y+=44;
  }
  imgRule(ctx,L,y,R); y+=14;
  const hp=hostPhone(), hn=hostName();
  ctx.font=ifont(18,700);
  const nameW=ctx.measureText(hn).width;
  const phone=hp?('  ·  '+hp):'';
  ctx.font=ifont(17,400);
  const phoneW=ctx.measureText(phone).width;
  const logoW=hostIm?Math.min(90,hostIm.width*(32/hostIm.height))+14:0;
  let bx=(IMG_W-(logoW+nameW+phoneW))/2;
  if(hostIm){ ctx.drawImage(hostIm,bx,y+2,logoW-14,32); bx+=logoW; }
  ctx.font=ifont(18,700); ctx.fillStyle=IMG_INK; ctx.fillText(hn,bx,y+24); bx+=nameW;
  if(phone){ ctx.font=ifont(17,400); ctx.fillStyle=IMG_MUTED; ctx.fillText(phone,bx,y+24); }
  return cv;
}
const sgnTxt = d => (d>0?'+':'')+d;

/* ========================================================================
   FINALS AS A PICTURE
   The same idea as the standings image, for the knockout: every round as a
   grid of ties, then each league with its table and its top three. A finals
   page varies a great deal in height — a straight final is short, a three-way
   league with a Gold decider is long — so the whole thing is laid out twice:
   once against a stand-in that measures text but draws nothing, to find out
   how tall the canvas must be, and then for real.
   ===================================================================== */
function dryCtx(){
  const real=document.createElement('canvas').getContext('2d');
  return new Proxy(real,{
    get(t,p){ if(p==='measureText') return t.measureText.bind(t);
      const v=t[p]; return typeof v==='function' ? ()=>{} : v; },
    set(t,p,v){ t[p]=v; return true; } });
}
function fiHead(ctx,y,txt,sub){
  const L=IMG_PAD, R=IMG_W-IMG_PAD;
  ctx.font=ifont(24,800); ctx.fillStyle=IMG_INK; ctx.fillText(txt,L,y+24);
  if(sub){ ctx.font=ifont(15,400); ctx.fillStyle=IMG_MUTED; imgRight(ctx,sub,R,y+24); }
  imgRule(ctx,L,y+36,R,'#1d2229'); imgRule(ctx,L,y+37,R,'#1d2229');
  return y+52;
}
/* one tie: a heading strip, then a row per team with its score; the winner is
   set in bold on a pale tint */
const FI_ROW=46, FI_TOP=28;
function fiTie(ctx,x,y,w,head,a,b,sa,sb){
  const p=sa!=null&&sb!=null&&a&&b, wa=p&&sa>sb, wb=p&&sb>sa;
  ctx.fillStyle=IMG_HEAD; ctx.fillRect(x,y,w,FI_TOP);
  ctx.font=ifont(12.5,700); ctx.fillStyle=IMG_MUTED;
  ctx.fillText(fitText(ctx,String(head).toUpperCase(),w-24),x+12,y+19);
  [[a,sa,wa],[b,sb,wb]].forEach(([nm,sc,win],i)=>{
    const ry=y+FI_TOP+i*FI_ROW;
    ctx.fillStyle=win?'#eaf4e1':IMG_PAPER; ctx.fillRect(x,ry,w,FI_ROW);
    if(win){ ctx.fillStyle='#4d7c0f'; ctx.fillRect(x,ry,4,FI_ROW); }
    ctx.font=ifont(20,win?800:500); ctx.fillStyle=nm?IMG_INK:'#a0a7b1';
    ctx.fillText(fitText(ctx,nm||'to be decided',w-96),x+14,ry+30);
    ctx.font=ifont(22,800); ctx.fillStyle=IMG_INK;
    if(p) imgMid(ctx,String(sc),x+w-38,ry+31);
    imgRule(ctx,x+w-76,ry,x+w-76,IMG_LINE);
  });
  ctx.strokeStyle='#b8c0ca'; ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,w-1,FI_TOP+2*FI_ROW-1);
  imgRule(ctx,x,y+FI_TOP+FI_ROW,x+w,IMG_LINE);
  ctx.beginPath(); ctx.moveTo(x+w-76.5,y+FI_TOP); ctx.lineTo(x+w-76.5,y+FI_TOP+2*FI_ROW);
  ctx.strokeStyle=IMG_LINE; ctx.stroke();
  return y+FI_TOP+2*FI_ROW;
}
/* ties laid two to a row */
function fiGrid(ctx,y,ties){
  const L=IMG_PAD, R=IMG_W-IMG_PAD, gap=24, w=(R-L-gap)/2;
  for(let i=0;i<ties.length;i+=2){
    let bottom=y;
    ties.slice(i,i+2).forEach((t,j)=>{ bottom=Math.max(bottom, fiTie(ctx,L+j*(w+gap),y,w,t.head,t.a,t.b,t.sa,t.sb)); });
    y=bottom+18;
  }
  return y;
}
/* a league's table */
function fiTable(ctx,y,rows){
  const L=IMG_PAD, R=IMG_W-IMG_PAD, rowH=46;
  const cols=[['P',60],['W',60],['L',60],['FOR',76],['AGST',76],['DIFF',84]];
  const fixed=cols.reduce((s,c)=>s+c[1],0), teamW=R-L-56-fixed;
  ctx.fillStyle=IMG_HEAD; ctx.fillRect(L,y,R-L,38);
  ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED;
  ctx.fillText('#',L+16,y+25); ctx.fillText('PAIR',L+56,y+25);
  let cx=L+56+teamW; cols.forEach(([l,w])=>{ imgMid(ctx,l,cx+w/2,y+25); cx+=w; });
  y+=38;
  rows.forEach((r,i)=>{
    const pod=r.p&&r.rank<=3?IMG_POD[r.rank]:'';
    ctx.fillStyle=pod||(i%2?IMG_ALT:IMG_PAPER); ctx.fillRect(L,y,R-L,rowH);
    if(pod){ ctx.fillStyle=IMG_BAR[r.rank]; ctx.fillRect(L,y,5,rowH); }
    const mid=y+rowH/2+7;
    ctx.font=ifont(19,800); ctx.fillStyle=IMG_INK; ctx.fillText(r.p?String(r.rank):'–',L+16,mid);
    ctx.font=ifont(20,r.rank<=3&&r.p?800:600); ctx.fillText(fitText(ctx,r.team,teamW-12),L+56,mid);
    let c=L+56+teamW;
    [r.p,r.w,r.l,r.pf,r.pa,sgnTxt(r.d)].forEach((v,k)=>{ ctx.font=ifont(19,k===1||k===5?800:600);
      imgMid(ctx,String(v),c+cols[k][1]/2,mid); c+=cols[k][1]; });
    imgRule(ctx,L,y+rowH,R); y+=rowH;
  });
  imgRule(ctx,L,y,R,'#aeb5bf');
  return y+20;
}
/* the top three, given room — gold, silver, bronze */
function fiPodium(ctx,y,title,names){
  names=(names||[]).filter(Boolean).slice(0,3);
  if(!names.length) return y;
  const L=IMG_PAD, R=IMG_W-IMG_PAD, gap=16, w=(R-L-gap*2)/3, h=96;
  const lbl=['CHAMPIONS','RUNNERS-UP','THIRD'];
  ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED; ctx.fillText(title.toUpperCase(),L,y+14);
  y+=24;
  names.forEach((nm,i)=>{
    const x=L+i*(w+gap);
    ctx.fillStyle=IMG_POD[i+1]; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=IMG_BAR[i+1]; ctx.fillRect(x,y,w,5);
    ctx.font=ifont(12.5,800); ctx.fillStyle='#5b5240'; ctx.fillText(lbl[i],x+16,y+32);
    ctx.font=ifont(i===0?24:21,800); ctx.fillStyle=IMG_INK;
    ctx.fillText(fitText(ctx,nm,w-32),x+16,y+70);
  });
  return y+h+28;
}
function fiLeagueTies(which,label){
  const store=which==='diamond'?S.diamond:S.platinum, n=leagueRounds(which);
  return [...Array(n).keys()].map(i=>{ const m=store[i]||{};
    return {head:label+(n>1?' · match '+(i+1):''), a:m.a, b:m.b, sa:m.sa, sb:m.sb}; });
}
function fiLeagueDone(which){
  const store=which==='diamond'?S.diamond:S.platinum, n=leagueRounds(which);
  return n>0 && [...Array(n).keys()].every(i=>{ const m=store[i]; return m&&m.a&&m.b&&m.sa!=null&&m.sb!=null; });
}
/* everything below the masthead, drawn onto whichever context it is given */
function finalsBody(ctx,y){
  ROUNDS().forEach(r=>{
    y=fiHead(ctx,y,r.label, tieDone(r.ties.map(t=>t[0]))+' of '+r.ties.length+' played');
    y=fiGrid(ctx,y,r.ties.map(([c,x,yy])=>{ const t=S.ko[c]||{};
      return {head:c+' · '+refLabel(x)+' v '+refLabel(yy), a:t.a, b:t.b, sa:t.sa, sb:t.sb}; }));
    y+=10;
  });
  [['diamond',nmD(),DIAMOND_SRC()],['platinum',nmP(),PLATINUM_SRC()]].forEach(([w,nm,src])=>{
    if(!leagueRounds(w)) return;
    const final=src.length<=2;
    y=fiHead(ctx,y,final?nm+' final':nm+' league', final?'':'round robin');
    y=fiGrid(ctx,y,fiLeagueTies(w, final?'Final':nm));
    const st=leagueTable(w==='diamond'?S.diamond:S.platinum,src);
    if(!final && st.length) y=fiTable(ctx,y,st);
    if(fiLeagueDone(w)) y=fiPodium(ctx,y,nm+' placings',st.map(r=>r.team));
    y+=10;
  });
  const GT=GOLD_TIES();
  if(GT.length){
    const gs=goldStanding();
    y=fiHead(ctx,y,nmG()+' league','biggest winning margin takes it');
    y=fiGrid(ctx,y,GT.map(([c,x,yy])=>{ const t=S.ko[c]||{};
      return {head:c+' · '+refLabel(x)+' v '+refLabel(yy), a:t.a, b:t.b, sa:t.sa, sb:t.sb}; }));
    if(gs.pairs.length){
      y=fiHead(ctx,y,nmG()+' decider','level on margin');
      y=fiGrid(ctx,y,gs.pairs.map(([c])=>{ const t=S.ko[c]||{};
        return {head:'Decider · '+c, a:t.a, b:t.b, sa:t.sa, sb:t.sb}; }));
    }
    if(gs.rank.length){
      const L=IMG_PAD, R=IMG_W-IMG_PAD;
      gs.rank.forEach((r,i)=>{
        ctx.fillStyle=i%2?IMG_ALT:IMG_PAPER; ctx.fillRect(L,y,R-L,40);
        ctx.font=ifont(18,800); ctx.fillStyle=IMG_INK; ctx.fillText(String(i+1),L+16,y+27);
        ctx.font=ifont(19,600); ctx.fillText(fitText(ctx,r.win,R-L-260),L+56,y+27);
        ctx.font=ifont(15,400); ctx.fillStyle=IMG_MUTED; imgRight(ctx,'tie '+r.code,R-120,y+27);
        ctx.font=ifont(19,800); ctx.fillStyle=IMG_INK; imgRight(ctx,'won by '+r.marg,R-14,y+27);
        imgRule(ctx,L,y+40,R); y+=40;
      });
      y+=20;
    }
    if(gs.champion) y=fiPodium(ctx,y,nmG()+' placings',gs.rank.map(r=>r.win));
  }
  return y;
}
async function finalsCanvas(){
  const marks=await Promise.all(leadMarks().map(o=>imgLoad(orgLogo(o))));
  const hostIm=await imgLoad(orgLogo(HOST()));
  const sponIm=await Promise.all(shownSponsors().map(o=>imgLoad(orgLogo(o))));
  const L=IMG_PAD, R=IMG_W-IMG_PAD;
  const masthead=(ctx)=>{
    let x=L, top=IMG_PAD;
    leadMarks().forEach((o,i)=>{ const im=marks[i];
      if(im){ const hgt=48, wid=Math.min(170, im.width*(hgt/im.height)); ctx.drawImage(im,x,top,wid,hgt); x+=wid+18; }
      else if(o.name){ ctx.font=ifont(26,700); ctx.fillStyle=IMG_INK; ctx.fillText(o.name,x,top+32);
        x+=ctx.measureText(o.name).width+20; } });
    ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED; imgRight(ctx,'FINALS',R,top+20);
    ctx.font=ifont(14,400);
    imgRight(ctx,new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),R,top+42);
    let y=top+64;
    ctx.font=ifont(40,800); ctx.fillStyle=IMG_INK; ctx.fillText(fitText(ctx,S.meta.title,R-L),L,y+34); y+=48;
    const sub=[S.meta.sub, organiserLine()?'Organised by '+organiserLine():''].filter(Boolean).join(' · ');
    if(sub){ ctx.font=ifont(20,400); ctx.fillStyle=IMG_MUTED; ctx.fillText(fitText(ctx,sub,R-L),L,y+20); }
    return y+58;
  };
  const foot=(ctx,y)=>{
    ctx.font=ifont(15,400); ctx.fillStyle=IMG_MUTED;
    ctx.fillText('Games '+rulesShort(),L,y+12); y+=30;
    if(shownSponsors().length){
      let sx=L; ctx.font=ifont(13,700); ctx.fillStyle=IMG_MUTED;
      const lbl=shownSponsors().length===1?'SPONSOR':'SPONSORS';
      ctx.fillText(lbl,sx,y+22); sx+=ctx.measureText(lbl).width+18;
      shownSponsors().forEach((o,i)=>{ const im=sponIm[i];
        if(im){ const hgt=28, wid=Math.min(110,im.width*(hgt/im.height)); ctx.drawImage(im,sx,y+2,wid,hgt); sx+=wid+16; }
        else if(o.name){ ctx.font=ifont(16,400); ctx.fillStyle=IMG_INK; ctx.fillText(o.name,sx,y+22);
          sx+=ctx.measureText(o.name).width+18; } });
      y+=44;
    }
    imgRule(ctx,L,y,R); y+=14;
    const hp=hostPhone(), hn=hostName();
    ctx.font=ifont(18,700); const nameW=ctx.measureText(hn).width;
    const phone=hp?('  ·  '+hp):''; ctx.font=ifont(17,400); const phoneW=ctx.measureText(phone).width;
    const logoW=hostIm?Math.min(90,hostIm.width*(32/hostIm.height))+14:0;
    let bx=(IMG_W-(logoW+nameW+phoneW))/2;
    if(hostIm){ ctx.drawImage(hostIm,bx,y+2,logoW-14,32); bx+=logoW; }
    ctx.font=ifont(18,700); ctx.fillStyle=IMG_INK; ctx.fillText(hn,bx,y+24); bx+=nameW;
    if(phone){ ctx.font=ifont(17,400); ctx.fillStyle=IMG_MUTED; ctx.fillText(phone,bx,y+24); }
    return y+48+IMG_PAD;
  };
  /* pass one: measure */
  const d=dryCtx();
  const H=Math.round(foot(d, finalsBody(d, masthead(d))));
  /* pass two: draw */
  const sc=imgScale(H), cv=document.createElement('canvas');
  cv.width=Math.round(IMG_W*sc); cv.height=Math.round(H*sc);
  const ctx=cv.getContext('2d'); ctx.scale(sc,sc); ctx.textBaseline='alphabetic';
  ctx.fillStyle=IMG_PAPER; ctx.fillRect(0,0,IMG_W,H);
  foot(ctx, finalsBody(ctx, masthead(ctx)));
  return cv;
}
/* hand a finished canvas to the phone's share sheet, or download it */
async function shareCanvas(cv,name,title){
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  if(!blob) return toast('Could not make the image');
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Saved '+name);
}
async function exportFinalsImage(){
  if(!canShare()) return toast('Not allowed on this device');
  toast('Drawing the finals…');
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const cv=await finalsCanvas();
    const name=(S.meta.title||'Finals').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')+'-finals.png';
    await shareCanvas(cv,name,S.meta.title+' · finals');
  }catch(e){ toast('Image failed: '+(e.message||e)); }
}

/* On a phone the picture should go straight into the group chat it is meant
   for, so the share sheet is offered first and the download is the fallback. */
async function exportStandingsImage(only){
  if(!canShare()) return toast('Not allowed on this device');
  const some=((only&&S.groups[only])?[only]:GROUPS).filter(g=>S.groups[g].teams.length);
  if(!some.length) return toast('No teams yet — add them in the Groups tab');
  toast('Drawing the standings…');
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const cv=await standingsCanvas(only);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    if(!blob) return toast('Could not make the image');
    const name=(S.meta.title||'Standings').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')
      +(only?'-Group-'+only:'')+'-standings.png';
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:S.meta.title+' · standings'}); return; }
      catch(e){ if(e&&e.name==='AbortError') return; }      // they changed their mind
    }
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    /* a sheet with every group on it has to give up some size to stay inside
       what a phone will draw, so say where the sharper version is */
    toast(!only&&some.length>2 ? 'Saved · one group at a time comes out sharper'
                               : 'Saved '+name);
  }catch(e){ toast('Image failed: '+(e.message||e)); }
}

/* ========================= INIT ========================= */
applyTheme();
guardHistory();
syncLoad();
if(!Object.keys(sync.sent).length) syncBaseline();
render();
if(sync.on){ syncStatus('sync'); pullTimer=setInterval(()=>syncPull(false),PULL_MS);
  syncPull(true).then(()=>syncScan()); }
else syncStatus('off');
