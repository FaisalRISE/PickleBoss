:root{
  --r:13px;

}
/* dark (default) */
html[data-theme="dark"]{
  --bg:#070b16; --surface:#0d1425; --card:#141d33; --cardAlt:#1b2540;
  --border:#25314e; --borderL:#36476e;
  --text:#e9eef9; --muted:#96a3c4; --dim:#7686ad;
  --accent:#bef264; --accentD:#84cc16;
  --gold:#fbbf24; --win:#bef264; --loss:#fb7185; --cyan:#2dd4bf; --violet:#a78bfa;
  --onAccent:#0b1220;
  /* text sitting on a tint of its own colour needs its own value per theme */
  --accentInk:#d9f99d; --goldInk:#fcd34d; --lossInk:#fda4af; --violetInk:#c4b5fd; --cyanInk:#5eead4;
  --glow1:rgba(45,212,191,.06); --glow2:rgba(190,242,100,.05);
  --court:#2c5d80; --courtDeep:#24506f; --courtLine:#f4f8fb; --kitchen:#a8542c;
}
html[data-theme="light"]{
  --bg:#f6f7fb; --surface:#eef1f7; --card:#ffffff; --cardAlt:#f1f4fa;
  --border:#dbe1ec; --borderL:#c3ccdc;
  --text:#111827; --muted:#414b58; --dim:#565e6c;
  --accent:#4d7c0f; --accentD:#3f6212;
  --gold:#b45309; --win:#3f6212; --loss:#be123c; --cyan:#0f766e; --violet:#6d28d9;
  --onAccent:#ffffff;
  --accentInk:#31500a; --goldInk:#7c4a02; --lossInk:#9f1239; --violetInk:#4c1d95; --cyanInk:#0f5f59;
  --glow1:rgba(15,118,110,.05); --glow2:rgba(77,124,15,.05);
  --court:#2f6b93; --courtDeep:#27597c; --courtLine:#ffffff; --kitchen:#b45f31;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body.reflock{overflow:hidden}
body{
  background:radial-gradient(1100px 550px at 85% -10%,var(--glow1),transparent 60%),
             radial-gradient(900px 500px at -10% 5%,var(--glow2),transparent 55%),var(--bg);
  color:var(--text);font-family:'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:74px;
  transition:background .2s,color .2s;
}
.display{font-family:'Bricolage Grotesque','Outfit',sans-serif;letter-spacing:-.02em}
.wrap{max-width:1120px;margin:0 auto;padding:16px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:23px;margin:0;font-weight:800;line-height:1.1}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--border);padding:5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--text);font-weight:700}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--border);display:flex;overflow-x:auto}
nav button{flex:1;min-width:72px;background:none;border:0;color:var(--dim);padding:11px 5px 12px;
  font:600 11.5px 'Outfit';cursor:pointer;border-top:2px solid transparent}
nav button.on{color:var(--accentInk);border-top-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}

.court-card{padding:14px;display:flex;flex-direction:column;gap:10px}
.court-card.on{border-color:var(--accent)}
.chipG{font-size:10px;opacity:.65;font-weight:700;margin-left:2px}
.courtTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gLabel{font:800 15px 'Bricolage Grotesque'}
.courtName{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.prog{height:4px;background:var(--surface);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.nextM{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px}
.nextLbl{font-size:10px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.vsRow{display:flex;align-items:center;gap:8px;font-size:13px}
.vsRow .t{flex:1;min-width:0;overflow-wrap:break-word;word-break:normal}
.vs{font-size:10px;color:var(--dim);font-weight:700;flex:none}
.done{color:var(--dim);font-size:13px;font-style:italic}

/* match rows — names wrap to two lines instead of truncating */
.mrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--border)}
.mrow:last-child{border-bottom:0}
.mno{width:34px;font:700 11px 'Outfit';color:var(--dim);flex:none;
  display:flex;flex-direction:column;align-items:flex-start;gap:0}
/* which court this match is on, in the corner of its row */
.ctTag{display:inline-block;margin-top:2px;font:800 9px 'Outfit';letter-spacing:.06em;padding:1px 4px;
  border-radius:4px;background:color-mix(in srgb,var(--cyan) 18%,transparent);color:var(--cyanInk)}
.courtEd .ctCount{font-size:10.5px;color:var(--dim);font-weight:700;flex:none;white-space:nowrap}
.restNote{margin:7px 0 10px;font-size:12px;line-height:1.5;color:var(--muted);
  border-left:2px solid var(--border);padding:6px 0 6px 10px}
.restNote.warn{border-left-color:var(--gold);color:var(--text)}
.restNote b{font-weight:700;color:var(--text)}
/* the head of a single court's order of play */
.ctHead{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 15px;margin-bottom:12px}
.ctH1{font:800 20px 'Bricolage Grotesque';line-height:1.15}
.ctH2{font-size:11.5px;color:var(--dim);margin-top:3px}
.ctNext{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13.5px;
  overflow-wrap:anywhere;line-height:1.45}
.ctNext .nextLbl{display:block;margin-bottom:3px}
.ctNext .vs{margin:0 5px;color:var(--dim)}
.ctNext .done{color:var(--dim);font-size:12.5px}
.side{flex:1;min-width:0;display:flex;align-items:center}
.side .nm{font-size:13.5px;line-height:1.25;overflow-wrap:break-word;word-break:normal;cursor:default}
.side .nm:hover{color:var(--accent);text-decoration:underline dotted}
.side.w .nm{color:var(--win);font-weight:700}
.side.l .nm{color:var(--muted)}
.side.b{justify-content:flex-end;text-align:right}
input.sc{width:44px;height:34px;text-align:center;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:7px;font:700 15px 'Outfit';flex:none}
input.sc:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
input.sc.filled{border-color:var(--borderL)}
input.sc:disabled{opacity:.4}
.sep{color:var(--dim);font-size:12px;flex:none}
.refbtn{flex:none;border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);
  border-radius:7px;padding:6px 8px;font:700 10px 'Outfit';cursor:pointer;letter-spacing:.05em}
.refbtn:hover{border-color:var(--accent);color:var(--accent)}

/* tables — name column wraps, numbers stay tight */
.tblWrap{padding:0 10px 10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  text-align:right;padding:8px 4px;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.name{white-space:normal;overflow-wrap:break-word;word-break:normal;line-height:1.3;min-width:104px;
  display:flex;align-items:flex-start;gap:7px;padding-right:8px}
td.name .txt{flex:1;min-width:0;cursor:pointer}
td.name .txt:hover{color:var(--accent)}
th.num,td.num{width:30px;padding:8px 3px}
.rk{display:inline-flex;width:19px;height:19px;align-items:center;justify-content:center;border-radius:5px;
  font:700 11px 'Outfit';background:var(--surface);color:var(--muted);flex:none;margin-top:1px}
.q1 .rk{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accentInk)}
.q3 .rk{background:color-mix(in srgb,var(--violet) 22%,transparent);color:var(--violetInk)}
.lgTag{font-size:8.5px;letter-spacing:.08em;padding:1px 4px;border-radius:4px;display:inline-block;margin-top:2px}
.tMain{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accentInk)}
.tGold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--goldInk)}
.pos{color:var(--gold)} .neg{color:var(--loss)}
.medal{font:800 13px 'Bricolage Grotesque';flex:none}
.mGold{color:var(--gold)} .mSil{color:var(--muted)} .mBronze{color:#d97706}

.hd{font:700 11px 'Outfit';letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  padding:11px 11px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hd b{color:var(--text);font-size:14px;letter-spacing:0;text-transform:none}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 14px;
  border-radius:99px;font:600 13px 'Outfit';cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}

.rnd{margin-bottom:14px}
.secHead{width:100%;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;
  font-family:'Outfit';text-align:left;margin-bottom:10px;color:var(--text)}
.secHead:hover{border-color:var(--borderL)}
.secHead.closed{background:var(--surface);margin-bottom:0}
.secHead .chev{color:var(--dim);font-size:11px;width:11px;flex:none}
.secHead .secT{flex:1;min-width:0;font:800 12px 'Bricolage Grotesque';letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}
.secHead.closed .secT{color:var(--dim)}
.secHead .secMeta{font:700 11px 'Outfit';color:var(--muted);flex:none}
.secHead .secMeta.done{color:var(--accentInk)}
.secBody{animation:secIn .14s ease-out}
@keyframes secIn{from{opacity:.4}to{opacity:1}}
.rndT{font:800 12px 'Bricolage Grotesque';letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:0 0 10px;display:flex;align-items:center;gap:10px}
.rndT:after{content:'';flex:1;height:1px;background:var(--border)}
.tie{padding:11px 12px}
.tieH{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px}
.tieH .code{color:var(--accent);font-weight:700}
.slot{display:flex;align-items:center;gap:9px;padding:5px 0}
.slot .seed{font:700 9.5px 'Outfit';color:var(--dim);width:48px;flex:none}
.slot .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.25;overflow-wrap:break-word;word-break:normal}
.slot.w .nm{color:var(--win);font-weight:700}
.slot.tbd .nm{color:var(--dim);font-style:italic}
.podium{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.podium>div{flex:1;min-width:170px}

.btn{background:var(--cardAlt);border:1px solid var(--borderL);color:var(--text);padding:9px 14px;
  border-radius:9px;font:600 13px 'Outfit';cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.dgr{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--dim);font-size:12.5px;line-height:1.6}
.hidden{display:none}

.ed{padding:12px}
.edRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.edRow .ix{width:20px;color:var(--dim);font:700 11px 'Outfit';flex:none}
input.txt,select.txt{flex:1;min-width:0;height:38px;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:0 10px;font:500 13.5px 'Outfit'}
input.txt:focus,select.txt:focus{outline:0;border-color:var(--accent)}
.warn{background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);
  color:var(--goldInk);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}

/* header tools */
.hdr-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);padding:6px 10px;border-radius:99px;font:700 10.5px 'Outfit';letter-spacing:.05em;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.sync.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.sync.live .dot{animation:pulse 1.6s infinite}
.sync.sync{color:var(--cyan)} .sync.off{color:var(--dim)}
.sync.off_line,.sync.error{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modebtn{border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);padding:6px 11px;
  border-radius:99px;font:700 10.5px 'Outfit';letter-spacing:.05em;cursor:pointer}
.modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--muted);width:32px;height:30px;
  border-radius:99px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

.alert{display:flex;gap:9px;align-items:flex-start;border-radius:10px;padding:10px 12px;font-size:12.5px;
  line-height:1.5;margin:6px 0}
.alert.ok{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);color:var(--accentInk)}
.alert.warn{background:color-mix(in srgb,var(--gold) 12%,transparent);border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);color:var(--goldInk)}
.alert.bad{background:color-mix(in srgb,var(--loss) 12%,transparent);border:1px solid color-mix(in srgb,var(--loss) 38%,transparent);color:var(--lossInk)}
.alert b{color:var(--text)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.66);backdrop-filter:blur(4px);z-index:90;
  display:flex;align-items:flex-end;justify-content:center}
.sheetM{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;
  max-width:560px;max-height:90vh;overflow:auto;padding:20px 18px 26px}
@media(min-width:620px){.scrim{align-items:center;padding:20px}.sheetM{border-radius:16px}}
.sheetM h3{font:800 18px 'Bricolage Grotesque';margin:0 0 4px}
.fl{display:block;font:600 10.5px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
/* two columns of short labelled boxes — the rules card, mainly */
/* an on/off switch */
.sw{position:relative;width:42px;height:24px;border-radius:99px;border:1px solid var(--borderL);
  background:var(--surface);cursor:pointer;padding:0;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);
  transition:transform .15s,background .15s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{transform:translateX(18px);background:#fff}
.accGrid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);margin-top:12px;border:1px solid var(--border);
  border-radius:11px;overflow:hidden}
.accGrid>div{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center}
.accH{font:700 10px 'Outfit';letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  background:var(--surface);justify-content:center}
.accH:first-child{justify-content:flex-start}
.accT{font-weight:600;font-size:13.5px}
.accC{justify-content:center}
.accRow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--border)}
.accRow:last-child{border-bottom:0}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.frow .fl{margin-top:8px}
.frow .txt{width:100%}
@media(max-width:520px){.frow{grid-template-columns:1fr}}
.sheetM input[type=text],.sheetM input[type=password],.sheetM select{width:100%;height:38px;background:var(--card);
  border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 11px;font:500 14px 'Outfit'}
.sheetM input:focus,.sheetM select:focus{outline:0;border-color:var(--accent)}
.pwWrap{position:relative}
.sheetM .pwWrap input{padding-right:46px}
.pwEye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:34px;
  display:flex;align-items:center;justify-content:center;border:0;background:none;
  color:var(--dim);cursor:pointer;border-radius:7px;padding:0}
.pwEye:hover,.pwEye[aria-pressed="true"]{color:var(--accent)}
.pwEye:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}


/* ---------- referee console: OSL-style court ---------- */
.refWrap{position:fixed;inset:0;z-index:95;background:var(--bg);overflow:auto;padding:12px 10px 40px}
.refInner{max-width:1000px;margin:0 auto}
.refTop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.refTop .ttl{flex:1;min-width:0;font:800 15px 'Bricolage Grotesque'}
.refTop .sub2{font:700 10px 'Outfit';color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}

.scorestrip{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:stretch;margin-bottom:10px}
.sTeam{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px 11px;
  position:relative;overflow:hidden}
.sTeam .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.sTeam .nm2{font-size:12.5px;font-weight:700;line-height:1.25;overflow-wrap:break-word;word-break:normal}
.sTeam .num{font:800 44px 'Bricolage Grotesque';line-height:.95;margin-top:2px}
.sTeam.right{text-align:right}
.phasebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:0 3px}
.phasebox .cv{font:800 17px 'Bricolage Grotesque';color:var(--gold);line-height:1;
  display:flex;align-items:center;gap:3px}
.phasebox .cl{font:800 8px 'Outfit';letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}

.tossbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--card);
  border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:8px}
.tossbar .eyebrow{flex:none}
.tossbar .dimtxt{color:var(--dim);font-size:11px;font-weight:600}

.court{position:relative;display:grid;grid-template-columns:1fr 7px 1fr;border-radius:10px;
  overflow:hidden;border:3px solid var(--courtLine);margin-bottom:9px;user-select:none;
  box-shadow:0 2px 14px rgba(0,0,0,.22)}
.half{display:grid;grid-template-rows:1fr 1fr;background:var(--court);position:relative}
.half.b{background:var(--courtDeep)}
.net{background:repeating-linear-gradient(180deg,#f8fafc 0 4px,#94a3b8 4px 8px);
  border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
/* the non-volley zone — the kitchen — sits against the net in its own colour */
.kitchen{position:absolute;top:0;bottom:0;width:20%;z-index:1;pointer-events:none;
  background:var(--kitchen)}
.half.a .kitchen{right:0;border-left:2px solid var(--courtLine)}
.half.b .kitchen{left:0;border-right:2px solid var(--courtLine)}
.kitchen:after{content:'KITCHEN';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;
  font:800 8px 'Outfit';letter-spacing:.2em;color:rgba(255,255,255,.55)}
/* the text sits clear of the kitchen so nothing overlaps it */
.cbox{position:relative;z-index:2;padding:12px 12px 21px;min-height:96px;display:flex;
  flex-direction:column;justify-content:center;gap:4px;cursor:pointer}
.half.a .cbox{padding-right:calc(20% + 10px)}
.half.b .cbox{padding-left:calc(20% + 10px)}
.half .cbox:first-child{border-bottom:2px solid var(--courtLine)}
.cbox:hover{background:rgba(255,255,255,.08)}
.cbox:active{background:rgba(255,255,255,.16)}
.cbox.locked{cursor:default}.cbox.locked:hover{background:transparent}
.cbox.serving{background:rgba(253,224,71,.13)}
.posTag{font:800 8.5px 'Outfit';letter-spacing:.11em;color:rgba(255,255,255,.72);text-transform:uppercase}
.pSlot{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.pSlot .sl{font:800 12px 'Outfit';color:#fde047;flex:none}
.pSlot .pn{font-size:14.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.55);
  overflow-wrap:break-word;word-break:normal}
.ball{flex:none;display:inline-block;vertical-align:-2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.servetag{font:800 8.5px 'Outfit';letter-spacing:.06em;text-transform:uppercase;color:#fde047;
  margin-top:2px;line-height:1.3}
.taphint{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:800 8.5px 'Outfit';
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:rgba(255,255,255,.6);
  letter-spacing:.07em;text-transform:uppercase;z-index:3;pointer-events:none}
.endsnote{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:11px;color:var(--muted);font-weight:600;margin-bottom:10px}
.ctrls{display:grid;gap:8px;margin-bottom:10px}
@media(min-width:620px){.ctrls{grid-template-columns:1fr 1fr}}
.ctrlrow{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);
  border-radius:11px;padding:8px 10px}
.ctrlrow .tl{flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow-wrap:break-word;word-break:normal}
.rbtn{width:44px;height:38px;border-radius:9px;border:1px solid var(--borderL);background:var(--cardAlt);
  color:var(--text);font:800 20px 'Outfit';cursor:pointer;flex:none;line-height:1}
.rbtn:disabled{opacity:.35;cursor:default}
.rbtn.plus{border:0;color:#fff}
.gamept{border-radius:9px;padding:8px 11px;font:700 12px 'Outfit';text-align:center;margin-bottom:9px;
  background:color-mix(in srgb,var(--gold) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);color:var(--goldInk)}
.gamept.win{background:color-mix(in srgb,var(--accent) 12%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accentInk)}
.gamept.golden{background:color-mix(in srgb,var(--loss) 12%,transparent);
  border-color:color-mix(in srgb,var(--loss) 48%,transparent);color:var(--lossInk);
  animation:goldpulse 1.5s ease-in-out infinite}
@keyframes goldpulse{0%,100%{opacity:1}50%{opacity:.62}}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);
  color:var(--onAccent);padding:10px 18px;border-radius:99px;font:600 13px 'Outfit';z-index:120;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.liveDot{color:var(--accent);font-size:9px;vertical-align:2px}
/* each round of a group's fixtures gets a heading, so twenty matches read as
   five short sets rather than one long column */
.rndHd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font:700 10.5px 'Outfit';letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:14px 4px 6px;border-bottom:1px solid var(--borderL)}
.rndHd:first-of-type{padding-top:4px}
.rndHd span:last-child{letter-spacing:.04em;color:var(--dim)}
.rndHd span.ok{color:var(--accent)}
/* a result that is not a finished game under the rules now in force */
.oddsc{display:block;color:var(--gold);font-size:12px;line-height:1;margin-top:2px;cursor:help}
td.name .txt{cursor:default}
td.name .txt.link{cursor:pointer}
td.name .txt.link:hover{color:var(--accent)}
.side .nm{cursor:default}
.side .nm:hover{color:inherit;text-decoration:none}
/* ---- print sheet: mirrors the Excel scoresheet ---- */
#printArea{display:none}
@media print{
  @page{margin:10mm}
  body{background:#fff!important;color:#000!important;padding:0}
  .wrap,nav,.toast,#modalRoot,.scrim,.refWrap{display:none!important}
  #printArea{display:block;font-family:'Outfit',Arial,sans-serif;color:#000}

  #printArea .psheet{page-break-after:always}
  #printArea .psheet:last-child{page-break-after:auto}
  /* A sheet is a one-column table so that its mark sits in a <thead> and the
     host line in a <tfoot>, which the browser then repeats on every page the
     sheet runs onto. A group of eight is twenty-eight matches and spills onto
     a second page; without this it used to start mid-table with nothing to say
     which group it belonged to. These two display lines are what make it
     happen, and the rest stops the table showing any furniture of its own. */
  #printArea table.psheet{width:100%;border-collapse:collapse;table-layout:fixed}
  #printArea table.psheet>thead{display:table-header-group}
  #printArea table.psheet>tfoot{display:table-footer-group}
  #printArea table.psheet>thead>tr>td,
  #printArea table.psheet>tfoot>tr>td,
  #printArea table.psheet>tbody>tr>td{border:0;padding:0;height:auto;
    white-space:normal;vertical-align:top;background:none}
  #printArea table.psheet>thead>tr>td{padding-bottom:1px}
  #printArea table.psheet>tfoot>tr>td{padding-top:1px}
  /* a sheet meant to sit on one page gets a little more air at the top */
  #printArea table.psheet.ctsheet .brandbar{margin-bottom:6px}
  #printArea table.psheet.ctsheet .pstrip{margin-top:7px}

  /* the running order on one court — one compact table, sized to fill the page */
  table.fx{width:100%;border-collapse:collapse;font-size:9px;margin-bottom:6px}
  table.fx th{border:1px solid #000;background:#eee;padding:2px 4px;font-size:7.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;text-align:left;color:#000}
  table.fx th.c,table.fx td.c{text-align:center}
  #printArea table.fx th,#printArea table.fx td{text-align:left}
  #printArea table.fx th.c,#printArea table.fx td.c,
  #printArea table.fx th.sc,#printArea table.fx td.sc{text-align:center}
  #printArea table.fx td.ra{text-align:right}
  table.fx td{border:1px solid #777;padding:2px 4px;height:15px}
  table.fx td.sc{width:30px;font-weight:700;font-size:10px}
  table.fx td.w{font-weight:800}
  table.fx tr.alt td{background:#f4f4f4}
  /* Every measurement comes from --rh and --fs, which the sheet works out from
     how many matches it has to show, so twenty rows get deep boxes to write in
     and fifty still fit. table-layout:fixed is what keeps it on the paper: the
     base stylesheet makes every cell nowrap, so without it one long pair name
     pushes the table off the right-hand edge. */
  table.fx.fit{table-layout:fixed;width:100%}
  table.fx.fit td{height:var(--rh);font-size:var(--fs);padding:2px 7px;
    white-space:normal;overflow-wrap:break-word;line-height:1.2}
  table.fx.fit th{font-size:var(--hs);padding:3px 6px;white-space:normal}
  table.fx.fit td.sc,table.fx.fit th.sc{width:16mm}
  /* wide enough for the word "Court" at the type size a short sheet uses */
  table.fx.fit td.c.n,table.fx.fit th.n{width:15mm}
  table.fx.fit td.ra{text-align:right}
  table.fx.fit td.ra,table.fx.fit td.pr{font-weight:700}
  table.fx.fit tr.alt td{background:#f1f5f8}

  /* where each pair plays: a grid of courts, one row per pair */
  table.routes{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:2px}
  table.routes th{border:1px solid #000;background:#eee;color:#000;padding:3px 2px;
    font-size:calc(var(--fs) * 0.7);font-weight:700;text-align:center}
  table.routes th.who{text-align:left;width:46mm;padding-left:7px}
  table.routes td{border:1px solid #777;height:var(--rh);text-align:center;padding:1px;
    white-space:normal;line-height:1.05}
  table.routes td.who{text-align:left;font-size:var(--fs);font-weight:700;padding-left:7px;
    overflow-wrap:break-word}
  table.routes td .ct{display:block;font-size:var(--fs);font-weight:800}
  table.routes td .sl{display:block;font-size:calc(var(--fs) * 0.62);color:#666}
  table.routes td.bye{color:#bbb}
  table.routes td.done{background:#eef3ee}
  table.routes tr:nth-child(even) td{background:#f6f8fa}
  table.routes tr:nth-child(even) td.done{background:#e8efe8}

  /* section headings on a sheet — Standings, Score Margin, a group's name —
     all in the same weight as the fixture headings, so the page has one voice */
  #printArea h4.psec{font:800 12.5px 'Outfit',Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;
    margin:4.5mm 0 1.6mm;padding:0 0 1mm;border-bottom:1.6px solid #1d2229;color:#111}
  #printArea h4.psec span{font-weight:500;color:#555;letter-spacing:0;text-transform:none}
  #printArea .gsT .gridT{margin-top:0}
  /* tables sized from the sheet: --trh row depth, --tfs type */
  /* the page layout uses a .grid class too, and it was turning these tables
     into CSS grids — which is why a standings table shrank to half the page */
  #printArea table.grid{display:table;width:100%}
  #printArea .gsT table.grid{width:100%}
  #printArea .gsT table.grid td{height:var(--trh,6mm);font-size:var(--tfs,10.5px);padding:0 2mm}
  #printArea .gsT table.grid td.nm{font-size:var(--tfs,10.5px)}
  #printArea .gsT table.grid th{font-size:8px;padding:1.2mm 1.5mm;height:auto}
  #printArea .gsT table.grid th.v{font-size:8px;line-height:1.15}
  #printArea table.grid.st{table-layout:fixed;width:100%}
  #printArea table.grid.st td.nm{overflow:hidden;text-overflow:ellipsis}
  #printArea table.grid.st th{text-align:center}
  #printArea table.grid.st th:nth-child(2){text-align:left}
  #printArea table.grid.st col.cR{width:8%}
  #printArea table.grid.st col.cN{width:7%}
  #printArea table.grid.st col.cS{width:8%}
  #printArea table.grid.st col.cD{width:10%}
  #printArea table.grid.st col.cH{width:8%}
  /* the standings page: two even columns, a clear gap after every table */
  #printArea .cols.sc2{gap:8mm}
  #printArea .sgrp{margin-bottom:5mm;page-break-inside:avoid}
  #printArea .sgrp h4.psec{margin-top:0}
  /* knockout boxes big enough to write in */
  #printArea .kobig table.ko{font-size:var(--kfs,12px)}
  #printArea .kobig table.ko td{height:var(--krh,9mm);font-size:var(--kfs,12px);padding:0 2.5mm}
  #printArea .kobig table.ko td.c,#printArea .kobig table.ko td.wl{width:16mm;font-weight:800}
  #printArea .kobig table.ko td.seed{width:18mm;font-size:.75em}
  #printArea .kobig table.ko th{font-size:9px;padding:1.4mm 2.5mm}
  #printArea .kobig table.ko th.c{width:16mm}
  #printArea .kobig .rows{gap:5mm;margin-bottom:5mm}
  #printArea .seedTag{color:#888;font-size:.85em;font-weight:700}
  /* knockout rounds: together on an upright page, one per page sideways */
  #printArea .oL{display:none}
  @media (orientation:portrait){
    #printArea table.psheet.koR:not(.koLast){page-break-after:auto}
    #printArea table.psheet.koR:not(.koLast)>tfoot{display:none}
    #printArea table.psheet.koR:not(.koFirst)>thead{display:none}
  }
  @media (orientation:landscape){
    #printArea .oP{display:none}
    #printArea .oL{display:inline}
  }
  #printArea .kobig .rows>table{flex:0 0 calc(50% - 2.5mm);min-width:calc(50% - 2.5mm);max-width:calc(50% - 2.5mm)}
  #printArea .kobig .rlbl{font-size:11px;padding:1.6mm 0;margin:3mm 0 3mm}
  #printArea .kobig table.podium3{margin-top:6mm}
  #printArea .kobig td.pod .pn{font-size:15px}
  /* fixtures by round */
  #printArea .rblk{margin:0 0 2.6mm;page-break-inside:avoid}
  #printArea .rblk h4{font:800 11.5px 'Outfit',Arial,sans-serif;letter-spacing:.03em;text-transform:uppercase;
    margin:0 0 1.1mm;padding:0 0 .9mm;border-bottom:1.6px solid #1d2229;color:#111}
  #printArea table.rt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs)}
  #printArea table.rt th{background:#e8ecf2;color:#59616d;font-size:7px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;border:1px solid #a3abb6;padding:.7mm 2mm;text-align:left;white-space:nowrap}
  #printArea table.rt td{border:1px solid #a3abb6;height:var(--rh);padding:0 2mm;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}
  #printArea table.rt td.w{font-weight:800}
  #printArea table.rt th.ct,#printArea table.rt td.ct{width:14mm;text-align:center}
  #printArea table.rt th.tm,#printArea table.rt td.tm{width:16mm;text-align:center;color:#444}
  #printArea table.rt th.gp,#printArea table.rt td.gp{width:9mm;text-align:center;font-weight:700}
  #printArea table.rt th.n,#printArea table.rt td.n{width:8mm;text-align:center;color:#666;font-size:.85em}
  #printArea table.rt th.sc,#printArea table.rt td.sc{width:15mm;text-align:center;font-weight:800}
  #printArea table.rt th.rf,#printArea table.rt td.rf{width:26mm}
  /* the gap between the two halves of a row, as on the scoreboard */
  #printArea table.rt th.gap,#printArea table.rt td.gap{width:5mm;border-top:0;border-bottom:0;background:#fff}
  /* the match cards fill the page too — twenty of them get deep boxes to write
     in by hand, forty-five tighten up rather than running off the bottom */
  table.mc.fit td{height:var(--rh);font-size:var(--fs)}
  table.mc.fit th{font-size:var(--hs)}

  #printArea .ph{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid #999;padding-bottom:3px;margin-bottom:8px}
  #printArea .ph .t{font-size:15px;font-weight:800;letter-spacing:-.01em}
  #printArea .ph .r{font-size:10px;color:#555}

  #printArea .cols{display:flex;gap:10px;align-items:flex-start}
  #printArea .cols>div{flex:1;min-width:0}

  /* match card */
  table.mc{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:10px;
    page-break-inside:avoid}
  table.mc th{border:1px solid #000;padding:2px 5px;font-size:8px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;background:#eee;text-align:left;color:#000}
  table.mc th.c{text-align:center}
  table.mc td{border:1px solid #666;padding:4px 5px;font-size:10.5px;height:19px}
  table.mc td.c{text-align:center;width:36px}
  table.mc td.wl{text-align:center;width:30px;font-weight:700}
  table.mc td.bye{color:#999;font-style:italic}
  table.mc tr.win td{font-weight:700}

  /* score-margin grid */
  #printArea .gridT{margin-top:8px}
  #printArea .gridT .cap{font-size:8px;letter-spacing:.1em;text-transform:uppercase;
    color:#555;margin-bottom:3px}
  table.grid{width:100%;border-collapse:collapse;font-size:9px;page-break-inside:avoid}
  table.grid th,table.grid td{border:1px solid #666;padding:3px 4px;height:17px}
  table.grid th{background:#eee;font-size:7.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:#000}
  table.grid th.v{font-size:7px;font-weight:600;text-transform:none;letter-spacing:0;line-height:1.15}
  table.grid td.c{text-align:center}
  table.grid td.dg{background:#ddd}
  /* The on-screen stylesheet right-aligns every table cell, which is right for
     a column of numbers and wrong for a column of names — in a printed table
     the pairs were drifting to the right-hand edge of their column. */
  #printArea table.grid td.nm,#printArea table.mc td,#printArea table.ko td{text-align:left}
  #printArea table.grid th,#printArea table.mc th,#printArea table.ko th{text-align:left}
  #printArea table.grid th.v,#printArea table.grid td.c,#printArea table.grid td.tot,
  #printArea table.mc th.c,#printArea table.mc td.c,#printArea table.mc td.wl,
  #printArea table.ko th.c,#printArea table.ko td.c,#printArea table.ko td.wl,
  #printArea table.ko td.seed{text-align:center}
  table.grid td.nm{font-size:9.5px;white-space:nowrap}
  table.grid td.tot{text-align:center;font-weight:700}

  /* knockout box */
  #printArea .rows{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  #printArea .rows>table{flex:1 1 calc(50% - 5px);min-width:calc(50% - 5px)}
  #printArea .rlbl{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;border-top:1px solid #000;border-bottom:1px solid #000;padding:3px 0;margin:10px 0 7px}
  table.ko{border-collapse:collapse;font-size:10px;page-break-inside:avoid}
  table.ko th{border:1px solid #000;background:#eee;padding:2px 5px;font-size:8px;
    text-transform:uppercase;letter-spacing:.06em;text-align:left;color:#000}
  table.ko th.c{text-align:center;width:36px}
  table.ko td{border:1px solid #666;padding:4px 5px;height:19px}
  table.ko td.seed{width:34px;font-size:8px;color:#555;text-align:center}
  table.ko td.c{text-align:center;width:36px}
  table.ko td.wl{text-align:center;width:30px;font-weight:700}
  table.ko td.tbd{color:#aaa;font-style:italic}
  table.ko tr.win td{font-weight:700}

  #printArea .place{width:auto;margin-top:10px;border-collapse:collapse;font-size:11px}
  #printArea .place th{border:1px solid #000;background:#eee;padding:4px 10px;text-align:left;font-size:9px}
  #printArea .place td{border:1px solid #666;padding:4px 14px;min-width:170px}
  #printArea .foot{margin-top:8px;font-size:8px;color:#777}
  /* branding on every printed page */
  #printArea .brandbar{display:flex;align-items:center;gap:10px;border-bottom:2px solid #000;
    padding-bottom:5px;margin-bottom:9px}
  #printArea .brandbar img{height:30px;width:auto}
  #printArea .brandbar .bt{flex:1;min-width:0}
  #printArea .brandbar .t{font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
  #printArea .brandbar .r{font-size:9.5px;color:#555;margin-top:2px}
  #printArea .brandbar .ct{text-align:right;font-size:9.5px;color:#333;line-height:1.45;white-space:nowrap}
  #printArea .brandbar .ct b{font-size:12px;display:block;letter-spacing:.01em}

  /* standings, podiums and the champions block */
  #printArea h3.gh{font:800 11px 'Outfit';letter-spacing:.09em;text-transform:uppercase;margin:0 0 4px}
  #printArea h3.gh span{font-weight:400;color:#666;letter-spacing:0;text-transform:none}
  #printArea table.grid.big{font-size:10.5px}
  #printArea table.grid.big th,#printArea table.grid.big td{padding:4px 5px;height:20px}
  #printArea table.grid td.h2hw{background:#e8f2e0;font-weight:800}
  #printArea table.grid td.h2hl{background:#f6eaea;color:#666}
  #printArea table.podium3{width:100%;border-collapse:collapse;margin:8px 0 4px;page-break-inside:avoid}
  #printArea table.podium3 th{background:#111;color:#fff;font-size:9px;letter-spacing:.14em;
    text-transform:uppercase;padding:4px 6px;text-align:left;border:1px solid #111}
  #printArea td.pod{border:1px solid #666;padding:7px 9px;width:33.33%;vertical-align:top;text-align:left}
  #printArea td.pod .pl{font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:#666}
  #printArea td.pod .pn{font-size:13px;font-weight:800;margin-top:2px}
  #printArea td.pod.g{background:#fdf6e3}
  #printArea td.pod.g .pn{font-size:15px}
  #printArea .champWrap{display:flex;gap:10px;margin-top:12px;page-break-inside:avoid;flex-wrap:wrap}
  #printArea table.champ3{flex:1;border-collapse:collapse}
  #printArea table.champ3{max-width:340px}
  #printArea table.champ3 th{background:#111;color:#fff;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:5px 8px;text-align:left;border:1px solid #111}
  #printArea table.champ3 td{border:1px solid #666;padding:6px 8px;text-align:left}
  #printArea table.champ3 td.pl{width:34px;font-size:9px;color:#666;font-weight:700}
  #printArea table.champ3 td.pn{font-size:12.5px;font-weight:700}
  #printArea table.champ3 tr.g td{background:#fdf6e3}
  #printArea table.champ3 tr.g td.pn{font-size:14.5px;font-weight:800}
  /* several organisers can lead a sheet, so the marks are boxed alike */
  #printArea .brandbar img{height:30px;width:auto;max-width:112px;object-fit:contain;filter:none}
  /* whatever explains the table sits under the table, not in the foot */
  #printArea .legend{margin-top:7px;font-size:8.5px;color:#777}
  #printArea .pstrip{margin-top:10px;padding-top:6px;border-top:1px solid #ddd;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;page-break-inside:avoid}
  #printArea .pstrip .plbl{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:#777}
  #printArea .pstrip .pitem{display:inline-flex;align-items:center;gap:5px;font-size:9px;color:#333}
  #printArea .pstrip .pitem img{height:17px;width:auto;max-width:74px;object-fit:contain}
  /* the foot of the sheet: the host's mark, name and number, nothing else */
  #printArea .pagefoot{display:block;text-align:center;border-top:1px solid #bbb;
    margin-top:8px;padding-top:6px}
  #printArea .hostMark{display:inline-flex;align-items:center;gap:7px;font-size:9.5px;color:#333}
  #printArea .hostMark img{height:16px;width:auto;max-width:70px;object-fit:contain}
  #printArea .hostMark b{font-size:10px}
  #printArea .hostMark i{font-style:normal;color:#555}
  #printArea .hostMark i:before{content:'· '}

  #printArea .pb{page-break-before:always}
}


/* ---- branding: the organisers lead the page, sponsors and the host close it ---- */
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{height:38px;width:auto;flex:none;display:block}
/* the built-in mark is dark artwork, so it is flipped on a dark page; a logo
   somebody uploaded is shown exactly as supplied unless they ask otherwise */
.logo.inv{filter:none}
html[data-theme="dark"] .logo{filter:none}
html[data-theme="dark"] .logo.inv{filter:invert(1) brightness(1.9)}
.logo.sm{height:26px;opacity:.9}
.leadMarks{display:flex;align-items:center;gap:10px;flex:none}
.leadMarks .logo{height:38px;width:auto;max-width:132px;object-fit:contain}
.byOrg{font-size:11px;color:var(--dim);margin-top:2px;font-weight:600;overflow-wrap:anywhere}
@media(max-width:520px){.leadMarks .logo{height:30px;max-width:96px}}
.sponsFoot{margin-top:26px;padding:14px 4px 13px;border-top:1px solid var(--border)}
.sponsFoot .eyebrow{display:block;margin-bottom:8px}
.sponsRow{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.sponsItem{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);font-weight:600}
/* a wide wordmark and a square badge have to share a line without one of them
   swamping the other, so both are boxed to the same height */
.sponsItem .logo.sp{height:26px;width:auto;max-width:104px;object-fit:contain;opacity:1}
.sponsFoot+.sitefoot{margin-top:0;border-top:0;padding-top:0}
.sitefoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding:14px 4px 0;
  border-top:1px solid var(--border)}

/* ---- the Setup list of organisers, sponsors and the host ---- */
.orgList{display:flex;flex-direction:column;gap:9px}
.orgRow{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--border);background:var(--surface);
  border-radius:11px;padding:9px 10px}
.orgPos{width:34px;flex:none;text-align:center;font:700 11px 'Outfit';color:var(--dim);padding-top:10px}
.orgMain{display:inline-block;font-size:8px;letter-spacing:.1em;padding:2px 5px;border-radius:4px;
  background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accentInk)}
.orgLogo{width:92px;height:52px;flex:none;border:1px dashed var(--borderL);border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card);padding:5px}
.orgLogo:hover{border-color:var(--accent)}
.orgLogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
html[data-theme="dark"] .orgLogo.inv img{filter:invert(1) brightness(1.9)}
.orgLogo.empty span{font:700 9px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center}
.orgMid{flex:1;min-width:0}
.orgMid .txt{width:100%}
.orgBtns{display:flex;flex-direction:column;gap:4px;flex:none}
.orgBtns .btn{padding:4px 8px;line-height:1.1}
.orgBtns .btn:disabled{opacity:.3;cursor:default}
.orgRow.host{border-color:color-mix(in srgb,var(--accent) 45%,transparent);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.orgDot{color:var(--dim)}
.bSep{height:1px;background:var(--border);margin:18px 0 16px}
@media(max-width:560px){
  .orgRow{flex-wrap:wrap}
  .orgMid{flex:1 1 100%;order:3}
}
.fLine{font-size:12px;color:var(--dim);line-height:1.6}
.fLine b{color:var(--muted)}
a.tel{color:var(--accent);font-weight:700;text-decoration:none;font-size:13.5px;
  border-bottom:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);padding-bottom:1px}
a.tel:hover{border-bottom-style:solid}
@media(max-width:520px){.logo{height:30px}h1{font-size:20px}}

.expbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.expSet{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  background:var(--card);border-radius:9px;padding:3px 4px 3px 9px}
.expLbl{font:700 9.5px 'Outfit';letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.drawRow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.drawRow .txt{height:34px;font-size:12.5px}
.drawRow .code{width:62px;flex:none;text-align:center;font-weight:800}
.drawRow .code2{width:20px;flex:none;color:var(--dim);font:700 11px 'Outfit';text-align:center}
.drawRow select.txt{flex:1;min-width:0}
.drawRow .vs{color:var(--dim);font:700 10px 'Outfit';flex:none}
.rsRow{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.rsT{font-size:13.5px;font-weight:700}
.rsN{font-size:11.5px;color:var(--dim);margin-top:1px}
.shareBox{width:100%;height:190px;background:var(--card);border:1px solid var(--border);
  color:var(--text);border-radius:9px;padding:10px 11px;font:400 12px/1.5 ui-monospace,Menlo,Consolas,monospace;
  resize:vertical;white-space:pre;overflow:auto}
.shareBox:focus{outline:0;border-color:var(--accent)}

/* ---- live sync chrome ---- */
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);
  color:var(--muted);padding:6px 11px;border-radius:99px;font:700 11px 'Outfit';letter-spacing:.06em;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:99px;background:currentColor;display:inline-block}
.sync.live{color:var(--accent);border-color:rgba(190,242,100,.4)}
.sync.live .dot{animation:pulse 1.6s infinite}
.sync.sync{color:var(--cyan)} .sync.off{color:var(--dim)}
.sync.off_line,.sync.error{color:var(--loss);border-color:rgba(251,113,133,.4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.modebtn{border:1px solid var(--borderL);background:var(--cardAlt);color:var(--muted);padding:6px 12px;
  border-radius:99px;font:700 11px 'Outfit';letter-spacing:.06em;cursor:pointer}
.modebtn.on{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.hdr-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}


/* modal */
.scrim{position:fixed;inset:0;background:rgba(4,7,15,.72);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 18px 26px}
@media(min-width:620px){.scrim{align-items:center;padding:20px}.sheet{border-radius:16px}}
.sheet h3{font:800 18px 'Bricolage Grotesque';margin:0 0 4px}
.fl{display:block;font:600 11px 'Outfit';letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.sheet input[type=text]{width:100%;height:38px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:0 11px;font:500 14px 'Outfit'}
.sheet input[type=text]:focus{outline:0;border-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin:6px 0 0}
.eyebrow{font:700 10px 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* league table */
.lgTag{font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:4px;margin-left:7px;vertical-align:1px}
.tMain{background:rgba(190,242,100,.14);color:var(--accent)}
.tGold{background:rgba(251,191,36,.16);color:var(--gold)}
.q2 .rk{background:rgba(45,212,191,.16);color:var(--cyan)}
.medal{font:800 13px 'Bricolage Grotesque'}
.mGold{color:var(--gold)} .mSil{color:#cbd5e1} .mBronze{color:#d97706}
</style></head>

/* ---------- the game ----------
   The format used to be nailed into the file: to 15, won by two, the
   two-point rule stopping at 17 so the 18th point settles it, ends at 8.
   That is still what a fresh file opens with — but a tournament run to 11,
   or one with no golden point at all, is now a Setup change rather than a
   different file.

     target    points needed to win
     winBy     1 = first to the target, 2 = must be two clear
     golden    only with winBy 2: when both sides reach goldenAt the next
               rally wins, so no score can pass goldenAt+1
     switchAt  ends change when a side reaches this score (0 = never)

   The referee console, the typed-score cap and every printed sheet read the
   five values below, which applyRules() refreshes whenever they change. */
const RULES_DEFAULT = { target:15, winBy:2, golden:true, goldenAt:17, switchAt:8 };
let TARGET=15, WIN_BY=2, GOLDEN=17, CAP=18, SWITCH_AT=8;

function normRules(r){
  r=Object.assign({},RULES_DEFAULT,r||{});
  const int=(v,d)=>{ const n=parseInt(v,10); return isNaN(n)?d:n; };
  r.target=Math.min(99,Math.max(1,int(r.target,15)));
  r.winBy=(+r.winBy===1)?1:2;
  r.golden=!!r.golden && r.winBy===2;
  /* the golden point can never come before the target minus one — below that
     the game would already be over */
  r.goldenAt=Math.min(98,Math.max(r.target-1,int(r.goldenAt,r.target-1)));
  r.switchAt=Math.min(99,Math.max(0,int(r.switchAt,0)));
  return { target:r.target, winBy:r.winBy, golden:r.golden,
           goldenAt:r.goldenAt, switchAt:r.switchAt };
}
function applyRules(){
  S.rules=normRules(S.rules);
  const r=S.rules;
  TARGET=r.target; WIN_BY=r.winBy; SWITCH_AT=r.switchAt||Infinity;
  if(r.golden){ GOLDEN=r.goldenAt; CAP=r.goldenAt+1; }
  else { GOLDEN=Infinity; CAP=Infinity; }
}
/* the highest number a score box will accept */
const maxScore=()=>isFinite(CAP)?CAP:99;

/* the rules in words — a short line for headers, a paragraph for the console */
function rulesShort(r){
  r=r||S.rules; let t='to '+r.target;
  if(r.winBy===1) t+=' · no deuce';
  else if(r.golden && r.goldenAt===r.target-1) t+=' · golden point at '+r.goldenAt+'–'+r.goldenAt;
  else if(r.golden) t+=' · win by 2 · golden point at '+r.goldenAt+'–'+r.goldenAt;
  else t+=' · win by 2';
  return t;
}
function rulesPara(r){
  r=r||S.rules; let t;
  if(r.winBy===1) t=`Game to ${r.target} — the first side to ${r.target} wins.`;
  else if(r.golden && r.goldenAt===r.target-1)
    t=`Game to ${r.target}. At ${r.goldenAt}–${r.goldenAt} the next rally is the golden point, so ${r.target}–${r.goldenAt} is the closest possible result.`;
  else if(r.golden)
    t=`Game to ${r.target}, won by 2 clear points. The two-point rule stops at ${r.goldenAt}–${r.goldenAt}: the very next rally takes it, so no score can go past ${r.goldenAt+1}.`;
  else t=`Game to ${r.target}, won by 2 clear points, with no cap.`;
  t+=r.switchAt?` Ends change when a side reaches ${r.switchAt}.`:' No change of ends.';
  return t;
}
/* A score typed in before the rules were changed may no longer be a finished
   game — 15–13 is not a result in a tournament to 11. Those stay exactly as
   they were and still count; they are flagged so they can be checked. */
function oddScore(m){
  if(!m||m.sa==null||m.sb==null) return false;
  return !gameOver(m.sa,m.sb);
}
function oddCount(){
  let n=0;
  GROUPS.forEach(g=>(S.groups[g].matches||[]).forEach(m=>{ if(oddScore(m)) n++; }));
  const ties=Object.keys(S.ko||{}).map(k=>S.ko[k])
    .concat(Object.keys(S.diamond||{}).map(k=>S.diamond[k]))
    .concat(Object.keys(S.platinum||{}).map(k=>S.platinum[k]));
  ties.forEach(t=>{ if(t&&oddScore(t)) n++; });
  return n;
}

/* ===================== who is behind the event =====================
   Three different roles were all being served by one name and one number:

     host        the platform the tournament runs on — RISE Sports. Its mark
                 and number close every page and every printed sheet, so
                 anybody who wants to run their own event knows who to call.
     organisers  whoever is putting *this* event on. Their marks lead the page
                 and the top of every sheet. Usually one; more for a jointly
                 run event.
     sponsors    venues and brands backing the event, along the bottom.

   Each entry is a name, an optional logo held as a data URL, and — for the
   host — a number. A row left completely blank is dropped rather than printed
   as a gap. */
function normOne(o,i,pfx){
  o=o||{};
  return { id:String(o.id||(pfx+i)), name:String(o.name||'').trim(),
           logo:(typeof o.logo==='string'&&/^data:image\//.test(o.logo))?o.logo:'',
           invert:!!o.invert, phone:String(o.phone||'').trim() };
}
function normList(list,pfx,max){
  const out=Array.isArray(list)?list.filter(o=>o&&typeof o==='object').map((o,i)=>normOne(o,i,pfx)):[];
  return out.slice(0,max);
}
function normBrand(S2){
  S2.host=normOne(S2.host||{name:ORGANISER,invert:true},0,'h');
  if(!S2.host.name) S2.host.name=ORGANISER;
  if(!S2.host.phone) S2.host.phone=CONTACT;
  S2.organisers=normList(S2.organisers,'o',MAX_ORGANISERS);
  S2.sponsors=normList(S2.sponsors,'s',MAX_SPONSORS);
  return S2;
}
const HOST       = () => S.host||{id:'h0',name:ORGANISER,logo:'',invert:true,phone:CONTACT};
const hostName   = () => HOST().name || ORGANISER;
const hostPhone  = () => HOST().phone || '';
/* the number for this event — whoever is running it takes the calls on court */
const eventPhone = () => String(S.meta.contact||'').trim();
/* a bare Indian mobile gets the country code so the link dials from anywhere */
function dialOf(num){
  const t=String(num||'').replace(/[^0-9+]/g,'');
  return t.startsWith('+')?t:(t.length===10?'+91'+t:t);
}
function telLink(num,cls){
  if(!num) return '';
  return `<a class="tel ${cls||''}" href="tel:${esc(dialOf(num))}">${esc(num)}</a>`;
}
const ORGANISERS = () => S.organisers||[];
const SPONSORS   = () => S.sponsors||[];
/* only the rows that actually say something reach the page or the printouts */
const shownOrganisers = () => ORGANISERS().filter(o=>o.name||o.logo);
const shownSponsors   = () => SPONSORS().filter(o=>o.name||o.logo);
/* The marks that lead the page. With no organiser set up the host's own mark
   stands in, so a fresh file never opens with an empty header — and so does it
   when an organiser is named but has given no logo, because a header with the
   name alone and an empty space where the mark was looks broken rather than
   deliberate. As soon as any organiser supplies a logo, theirs take over. */
function leadMarks(){
  const o=shownOrganisers();
  if(!o.length) return [HOST()];
  return o.some(x=>x.logo) ? o : [HOST()];
}
const organiserLine = () => shownOrganisers().map(o=>o.name).filter(Boolean).join(' · ');
/* the host falls back to the built-in mark; everyone else has none until given one */
const orgLogo  = o => o.logo || ((o===HOST()||o.id===HOST().id) ? LOGO : '');
const orgInvert= o => o.logo ? !!o.invert : true;
function orgImg(o,cls){
  const src=orgLogo(o); if(!src) return '';
  return `<img class="logo ${cls||''} ${orgInvert(o)?'inv':''}" src="${src}" alt="${esc(o.name||'')}">`;
}

/* ===================== courts =====================
   A group used to live on exactly one court. It can now be spread over
   several — Group A on courts 1, 2 and 3 while Group B runs on 5 and 6 —
   which is what halves the length of a morning when the venue has the space.

   Each match carries the court it is on in `c` and the slot it goes on in
   `slot`, both worked out from the fixture list rather than stored by hand,
   so every device arrives at the same order of play without one having to
   send it to the others. */
function normCourts(list, fallback){
  let out=Array.isArray(list)?list.map(c=>String(c||'').trim()).filter(Boolean):[];
  if(!out.length) out=[String(fallback||'Court 1')];
  /* two courts with the same name would be impossible to tell apart on a
     fixture row, so a repeat gets a number */
  const seen={};
  out=out.map(c=>{ if(!seen[c]){ seen[c]=1; return c; } return c+' ('+(++seen[c])+')'; });
  return out.slice(0,MAX_COURTS);
}
const courtsOf  = g => normCourts(S.groups[g]&&S.groups[g].courts, S.groups[g]&&S.groups[g].court);
const courtName = (g,ci) => { const c=courtsOf(g); return c[ci]||c[0]||'Court'; };
/* "Court 1" · "Courts 1 & 2" · "Courts 1, 2 & 3". When every court is called
   "Court something" the word is lifted out and said once, which is how anyone
   would write it; a mixed list is joined as it stands. */
const joinAnd = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' & '+a[a.length-1];
function courtLabel(g){
  const c=courtsOf(g);
  if(c.length===1) return c[0];
  const bare=c.map(x=>{ const m=/^court\s+(.+)$/i.exec(x); return m?m[1]:null; });
  if(bare.every(Boolean)) return 'Courts '+joinAnd(bare);
  return joinAnd(c);
}
/* "Court 12" has to fit in the corner of a fixture row, so it shrinks to C12 */
function shortCourt(name){
  const s=String(name||'').trim();
  if(/^court\s*\w+$/i.test(s)){ const n=courtNo(s); if(n) return 'C'+n; }
  return s.slice(0,6);
}
/* the court with the word "Court" taken off, for a column already headed Court */
function courtBare(name){
  const m=/^court\s+(.+)$/i.exec(String(name||'').trim());
  return m?m[1]:String(name||'');
}
/* The rounds of a group as they should be read: the round-robin rounds in the
   order of the tournament sheet, and inside a round the matches in the order
   they go on. Used by the fixture list on screen and on paper. */
function groupRounds(g){
  const G=S.groups[g];
  const by=roundsOf((G.matches||[]).slice().sort((a,b)=>a.n-b.n));
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(r=>({
    no:r, list:by[r].slice().sort((a,b)=>((a.slot||0)-(b.slot||0))||(a.n-b.n)) }));
}
/* ---------- the clock ----------
   Optional. With a first-match time and a length per match, every slot gets a
   time and the fixture sheets print it, so a pair can see roughly when they are
   on. Left blank, no time appears anywhere. */
function slotTime(k){
  const st=String((S.meta&&S.meta.start)||'').trim();
  const mm=/^(\d{1,2}):(\d{2})/.exec(st); if(!mm) return '';
  const len=Math.max(1,parseInt(S.meta.slotMins,10)||20);
  let t=(+mm[1])*60+(+mm[2])+k*len;
  t=((t%1440)+1440)%1440;
  const h=Math.floor(t/60), mi=t%60, h12=((h+11)%12)+1;
  return h12+':'+String(mi).padStart(2,'0')+' '+(h<12?'AM':'PM');
}
const timed = () => !!slotTime(0);

/* ---------- the order of play ----------
   Courts do not run in lockstep: one finishes a game while another is still
   mid-rally. So it is not enough to know which court a match is on, it has to
   be known which *slot* it is in — the wave of matches that go on at roughly
   the same time across all of the group's courts. Two things have to hold:

     1. a pair is never called to two courts at once. Inside a round every
        pair plays exactly once, so a slot drawn from one round can never call
        the same pair twice. The gap is the seam between rounds — the last
        slot of one and the first of the next could both want the same pair,
        and with courts running at their own pace those two overlap.

     2. a pair is not called straight back on while others sit out. With five
        matches on two courts a round takes three slots, so somebody always
        waits — it should not be the same pair every time.

   Both come out of one greedy pass. Slots are filled a round at a time, and
   at each slot the matches whose pairs have rested longest go on first. A pair
   that has just played sinks to the bottom, so it is picked only when there is
   nothing else to play — which is also what stops it opening the next round.
   The result is deterministic, so no device has to publish it. */
function scheduleGroup(G){
  const n=Math.max(1,normCourts(G.courts,G.court).length);
  /* On a single court nothing needs dealing: the order of play is the order on
     the tournament sheet, one match after another. Letting the rest-sorting
     loose here would quietly swap matches inside a round, so the slot printed
     beside a match would no longer agree with where it sits in the list. */
  if(n===1){
    (G.matches||[]).sort((a,b)=>a.n-b.n).forEach((m,i)=>{ m.slot=i; m.c=0; });
    return G;
  }
  /* rounds are read off the original match order, never off a list this
     function has already re-sorted, so running it twice gives the same day */
  const byRound=roundsOf((G.matches||[]).slice().sort((a,b)=>a.n-b.n));
  const rounds=Object.keys(byRound).map(Number).sort((a,b)=>a-b);
  const last={};            // pair -> the slot it last played in
  let slot=0, dealt=0;      // dealt counts every match placed, so the courts share evenly
  rounds.forEach(r=>{
    let rest=byRound[r].slice();
    /* how long the fresher of the two pairs has been waiting; a pair that has
       never played counts as having waited forever */
    const waited=m=>Math.min(last[m.a]===undefined?1e6:slot-last[m.a],
                             last[m.b]===undefined?1e6:slot-last[m.b]);
    /* how many of a match's two pairs came straight off the previous slot.
       Sorting on this first keeps back-to-back calls down in a way the rest
       figure alone does not: a match with one tired pair and one fresh one can
       score better than a match with two pairs who have each had a slot off. */
    const straightBack=m=>(last[m.a]===slot-1?1:0)+(last[m.b]===slot-1?1:0);
    const need=Math.ceil(rest.length/n);
    for(let j=0;j<need;j++){
      rest.sort((x,y)=> straightBack(x)-straightBack(y) || waited(y)-waited(x) || x.n-y.n);
      const slotsLeft=need-j;
      const mustTake=Math.max(1, rest.length-(slotsLeft-1)*n);
      const take=[];
      for(const m of rest){
        if(take.length>=n) break;
        /* when the only match left would call a pair straight back, the court
           is better left idle for one slot — and as long as what remains still
           fits in the slots the round has left, that costs the day nothing */
        if(take.length>=mustTake && straightBack(m)>0) break;
        take.push(m);
      }
      /* Courts are dealt from one running count rather than from the position
         within the slot. Rotating by slot alone kept handing the odd match out
         of a short slot to the same court, which over five rounds left one
         court with nine matches and the other with six. Counting straight
         through shares them 8 and 7, and because a slot never holds more than
         there are courts, consecutive counts still land on different ones. */
      take.forEach(m=>{
        m.slot=slot; m.c=(dealt++)%n;
        last[m.a]=slot; last[m.b]=slot;
      });
      rest=rest.filter(m=>take.indexOf(m)<0);
      slot++;
    }
  });
  /* On one court the schedule is the list order, and that order came off the
     tournament sheets — so it is left exactly as it is. Spread over several,
     the point of the exercise is to read the day as it will run, so the list
     is sorted into slots. The match number never moves either way. */
  if(n>1) (G.matches||[]).sort((a,b)=> (a.slot-b.slot) || (a.c-b.c) || (a.n-b.n));
  return G;
}

/* The fixture list taken from the tournament sheets carries no round numbers —
   the order is the order. Rounds are therefore read off the list: a new one
   starts as soon as a pair would be asked to play twice. Nothing is written
   back onto the matches, so this stays true after a rebuild and never travels
   through the sync. */
function roundsOf(list){
  const by={}; let r=1, seen={};
  list.forEach(m=>{
    if(seen[m.a]||seen[m.b]){ r++; seen={}; }
    seen[m.a]=1; seen[m.b]=1;
    (by[r]=by[r]||[]).push(m);
  });
  return by;
}

/* The next number to call a new court, so they do not all come out "Court 1".

   so a new one has to count past those too, or "Court 1" would turn up
   alongside "Court One" and the two would be taken for the same court. */
const COURT_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
                     'eleven','twelve','thirteen','fourteen','fifteen','sixteen'];
function courtNo(name){
  const s=String(name||'').toLowerCase();
  const d=/(\d+)/.exec(s); if(d) return +d[1];
  const w=COURT_WORDS.findIndex((x,i)=>i>0 && new RegExp('\\b'+x+'\\b').test(s));
  return w>0?w:0;
}
function nextCourtNo(){
  let hi=0;
  GROUPS.forEach(g=>courtsOf(g).forEach(c=>{ hi=Math.max(hi,courtNo(c)); }));
  return hi+1;
}
/* How much rest the group's shape actually allows. A slot keeps two pairs busy
   per court, so with c courts running, 2c of the pairs are on and the rest are
   waiting. For nobody to be called straight back, the next slot has to be
   filled entirely from those who sat out — which needs at least 4c pairs. Below
   that no arrangement can give everybody a break, so rather than quietly
   producing one the app says what the arithmetic is and what would fix it. */
function restCheck(g){
  const G=S.groups[g], c=courtsOf(g).length, n=G.teams.length;
  const by={}, last={}; let b2b=0;
  (G.matches||[]).forEach(m=>{ (by[m.slot||0]=by[m.slot||0]||[]).push(m); });
  Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(s=>{
    by[s].forEach(m=>[m.a,m.b].forEach(t=>{ if(last[t]===s-1) b2b++; }));
    by[s].forEach(m=>[m.a,m.b].forEach(t=>{ last[t]=s; }));
  });
  const fits=Math.max(1,Math.floor(n/4));
  return { b2b:b2b, courts:c, pairs:n, slots:Object.keys(by).length,
           tight:b2b>0 && c>fits, fits:fits };
}
function restNote(g){
  const r=restCheck(g);
  if(!r.b2b) return '';
  const what=`<b>${r.b2b}</b> match${r.b2b===1?'':'es'} in Group ${g} start${r.b2b===1?'s':''} `
    +`with a pair that has just come off court.`;
  if(!r.tight) return `<div class="restNote">${what}</div>`;
  return `<div class="restNote warn">${what}
    ${r.pairs} pairs over ${r.courts} courts keeps ${r.courts*2} of them playing at once, so there are not
    enough pairs waiting to fill the next set of matches. <b>${r.fits} court${r.fits===1?'':'s'}</b>
    would give everyone a break between matches — the day runs longer, but nobody plays twice in a row.</div>`;
}

function pairKey(a,b){ return [a,b].sort().join(' ~ '); }
function buildMatches(teams, old){
  const n=teams.length, prev={};
  (old||[]).forEach(m=>{ if(m.sa!=null||m.sb!=null) prev[pairKey(m.a,m.b)]=m; });
  let out=[];
  if(n<=6){
    T6.forEach((p,i)=>{ if(p[0]<=n&&p[1]<=n) out.push({n:i+1,a:teams[p[0]-1],b:teams[p[1]-1],sa:null,sb:null,log:null}); });
  } else {
    const t=teams.slice(); if(t.length%2)t.push(null);
    const half=t.length/2; let idx=t.map((_,i)=>i), no=1;
    for(let r=0;r<t.length-1;r++){
      for(let i=0;i<half;i++){ const a=t[idx[i]],b=t[idx[t.length-1-i]];
        if(a&&b) out.push({n:no++,a,b,sa:null,sb:null,log:null}); }
      idx=[idx[0],...idx.slice(-1),...idx.slice(1,-1)];
    }
  }
  out.forEach(m=>{ const p=prev[pairKey(m.a,m.b)];
    if(p){ const flip=p.a!==m.a;
      m.sa=flip?p.sb:p.sa; m.sb=flip?p.sa:p.sb;
      m.log=(p.log&&!flip)?p.log:null; } });
  return out;
}

/* ---------- head to head ----------
   The sort already uses it to break ties; this exposes the result so the
   printed grid can show *why* two pairs level on wins and difference are
   ordered the way they are. */
function h2hBetween(g,x,y){
  let n=0;
  S.groups[g].matches.forEach(m=>{ if(!played(m))return;
    if(m.a===x&&m.b===y) n+= m.sa>m.sb?1:-1;
    if(m.a===y&&m.b===x) n+= m.sb>m.sa?1:-1; });
  return n;
}
/* only pairs genuinely level on wins *and* difference get a mark */
function h2hMarks(g){
  const st=standings(g), out={}, buckets={};
  st.forEach(r=>{ const k=r.w+'|'+r.d; (buckets[k]=buckets[k]||[]).push(r); });
  Object.keys(buckets).forEach(k=>{
    const list=buckets[k]; if(list.length<2) return;
    list.forEach(r=>{
      let w=0,l=0;
      list.forEach(o=>{ if(o.team===r.team) return;
        const n=h2hBetween(g,r.team,o.team);
        if(n>0)w++; else if(n<0)l++; });
      out[r.team]= list.length===2 ? (w?'W':l?'L':'–') : (w+'–'+l);
    });
  });
  return out;
}

/* ---------- Gold: margin decides it, unless the margin is level ----------
   Two pairs winning by the same amount cannot be separated on paper, so they
   play each other. Three level means a round robin between the three. These
   deciders are generated from the results rather than configured, so they
   appear only when they are actually needed. */
const GOLD_DECIDERS = ['GD1','GD2','GD3'];
function goldWinnerList(){
  return GOLD_TIES().map(([c])=>{ const t=S.ko[c];
    if(!t||t.sa==null||t.sb==null||!t.a||!t.b) return null;
    const win = t.sa>t.sb?t.a : t.sb>t.sa?t.b : '';
    return win?{code:c,win,marg:Math.abs(t.sa-t.sb)}:null; }).filter(Boolean);
}
function goldTiedTop(){
  const L=goldWinnerList();
  if(!GOLD_TIES().length||L.length<GOLD_TIES().length) return [];   // wait for every tie
  const top=Math.max.apply(null,L.map(r=>r.marg));
  const tied=L.filter(r=>r.marg===top);
  return tied.length>1?tied:[];
}
function goldDeciderPairs(){
  const tied=goldTiedTop(); if(!tied.length) return [];
  return leaguePairs(tied.length)
    .map((pr,i)=>GOLD_DECIDERS[i]?[GOLD_DECIDERS[i],tied[pr[0]].win,tied[pr[1]].win]:null)
    .filter(Boolean);
}
/* the Gold order as it should be read: margin first, and where the margin is
   level, whatever the decider said */
function goldStanding(){
  const L=goldWinnerList().slice().sort((a,b)=>b.marg-a.marg);
  const tied=goldTiedTop(), pairs=goldDeciderPairs();
  let decided=true, order={};
  if(tied.length){
    const rows={}; tied.forEach(t=>rows[t.win]={team:t.win,w:0,d:0});
    pairs.forEach(([c])=>{ const t=S.ko[c];
      if(!t||t.sa==null||t.sb==null){ decided=false; return; }
      const A=rows[t.a],B=rows[t.b]; if(!A||!B) return;
      if(t.sa>t.sb)A.w++; else if(t.sb>t.sa)B.w++;
      A.d+=t.sa-t.sb; B.d+=t.sb-t.sa; });
    Object.values(rows).sort((x,y)=>(y.w-x.w)||(y.d-x.d))
      .forEach((r,i)=>{ order[r.team]=i; });
  }
  const rank=L.slice().sort((a,b)=>(b.marg-a.marg) ||
    ((order[a.win]!==undefined&&order[b.win]!==undefined)?order[a.win]-order[b.win]:0));
  const complete = L.length===GOLD_TIES().length && GOLD_TIES().length>0;
  return { rank, tied, pairs, decided:(!tied.length||decided), complete,
           champion:(complete && (!tied.length||decided) && rank.length)?rank[0].win:'' };
}

function refresh(){
  syncGroupKeys();
  applyRules();
  GROUPS.forEach(g=>assignCourts(S.groups[g]));
  /* several passes: a later round cannot resolve until the one feeding it has */
  const depth=Math.max(3,ROUNDS().length+1);
  for(let i=0;i<depth;i++){
    ROUNDS().forEach(r=>r.ties.forEach(([c,x,y])=>setTie(c,refName(x),refName(y))));
    GOLD_TIES().forEach(([c,x,y])=>setTie(c,refName(x),refName(y)));
    setLeague(S.diamond,DIAMOND_SRC());
    setLeague(S.platinum,PLATINUM_SRC());
    const dp=goldDeciderPairs();
    GOLD_DECIDERS.forEach((c,i)=>{ const p=dp[i];
      if(p) setTie(c,p[1],p[2]); else setTie(c,'',''); });
  }
}
function leagueTable(store,srcRefs){
  const names=srcRefs.map(refName), rows={};
  names.forEach(n=>{ if(n) rows[n]={team:n,p:0,w:0,l:0,pf:0,pa:0}; });
  leaguePairs(names.length).forEach((pr,i)=>{ const m=store[i]; if(!m)return;
    if(m.sa==null||m.sb==null||!m.a||!m.b)return;
    const A=rows[m.a],B=rows[m.b]; if(!A||!B)return;
    A.p++;B.p++;A.pf+=m.sa;A.pa+=m.sb;B.pf+=m.sb;B.pa+=m.sa;
    if(m.sa>m.sb){A.w++;B.l++;}else if(m.sb>m.sa){B.w++;A.l++;} });
  const list=Object.values(rows); list.forEach(r=>r.d=r.pf-r.pa);
  list.sort((x,y)=>(y.w-x.w)||(y.d-x.d)||(y.pf-x.pf)||x.team.localeCompare(y.team));
  list.forEach((r,i)=>r.rank=i+1);
  return list;
}

    </select>
    <p class="hint">Moving rebuilds both groups' fixtures. Results already played inside the group they

    </div>

      <button class="btn dgr" style="flex:1" onclick="removePair('${g}','${attr(name)}')">Remove from tournament</button>
    </div>`);
}
function applyPair(g, oldName){
  if(!canEditGroups()) return toast('Admin or organiser only');
  const nu=(document.getElementById('pairName').value||'').trim();
  const dest=document.getElementById('pairMove').value;
  if(!nu){ toast('Name cannot be empty'); return; }
  const G=S.groups[g];
  const i=G.teams.indexOf(oldName);
  if(i<0){ closeModal(); return; }
  // rename within current group first
  if(nu!==oldName){
    const clash=(dest?S.groups[dest].teams:G.teams).some((t,j)=>t===nu&&(dest||j!==i));
    if(clash){ toast('That name is already in that group'); return; }
    G.teams[i]=nu;
    G.matches.forEach(m=>{ if(m.a===oldName)m.a=nu; if(m.b===oldName)m.b=nu; });
  }
  if(dest){
    const D=S.groups[dest];
    if(D.teams.length>=MAX_TEAMS){ toast('That group is full'); return; }
    G.teams.splice(G.teams.indexOf(nu),1);
    G.matches=buildMatches(G.teams, G.matches.filter(m=>m.a!==nu&&m.b!==nu));
    D.teams.push(nu);
    D.matches=buildMatches(D.teams, D.matches);
    toast(nu+' moved to Group '+dest);
  } else if(nu!==oldName){ toast('Renamed to '+nu); }
  save(); closeModal();
}
function removePair(g,name){
  if(!canEditGroups()) return toast('Admin or organiser only');
  if(!confirm('Remove '+name+' from the tournament? Their results are cleared.')) return;
  const G=S.groups[g], i=G.teams.indexOf(name);
  if(i>=0){ G.teams.splice(i,1);
    G.matches=buildMatches(G.teams, G.matches.filter(m=>m.a!==name&&m.b!==name)); }
  save(); closeModal(); toast(name+' removed');
}

/* ===================== who may do what =====================
   Three levels.

     view    anyone with the link. Reads the live scores, changes nothing.
     scorer  enters and edits results, and runs the court console. Cannot
             touch teams, cannot print, export or reset.
     admin   the organiser. Everything, including the passwords themselves.

   The admin password ships with the app; the scorer PIN is set by the admin
   and travels with the sync as a hash, so a phone that has never scored still
   has to be told the PIN. Neither password is ever stored or sent in the clear.

   This is a lock on the door, not a vault: it all runs in the browser against
   a public key, so a determined person can get past it. It stops the realistic
   case — a player picking up a stray phone, a spectator poking at the link.
   Real enforcement would need Supabase auth with row-level security. */
/* Four levels, each with everything below it:
     admin      — you. Setup, passwords, resets, backups, the access switches.
     organiser  — runs the day: edits groups and teams, prints, shares images
                  and WhatsApp summaries, and scores. Each of those three
                  extras can be switched off by the admin.
     scorer     — shown as Referee: enters and edits scores, runs the console.
     view       — follows along.
   Which tabs each level sees is the admin's call too (S.access). */
const isAdmin     = () => S.role==='admin';
const isOrganiser = () => S.role==='organiser';
const canScore    = () => S.role==='admin'||S.role==='organiser'||S.role==='scorer';
const ROLE_LABEL  = {admin:'Admin', organiser:'Organiser', scorer:'Referee', view:'Viewer'};
const roleName    = () => ({admin:'ADMIN',organiser:'ORGANISER',scorer:'REFEREE'})[S.role]||'VIEW';
const orgMay      = k => isAdmin() || (isOrganiser() && ACCESS().org[k]!==false);
const canEditGroups = () => orgMay('groups');
const canExport     = () => orgMay('print');
const canShare      = () => orgMay('share');


async function hashPin(p){
  const salted='pboss35|'+(sync.event||'')+'|'+p;
  try{
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
      const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salted));
      return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381;                                    // only if SHA-256 is unavailable
  for(let i=0;i<salted.length;i++){ h=((h*33)^salted.charCodeAt(i))>>>0; }
  return 'x'+h.toString(16);
}
async function adminMatches(v){
  const h=await hashPin(v);
  if(S.adminHash) return h===S.adminHash;
  return h===await hashPin(ADMIN_DEFAULT);       // still on the shipped password
}
const scorerPinSet = () => !!(S.scorerHash&&S.scorerHash.length);
const orgPinSet    = () => !!(S.orgHash&&S.orgHash.length);

/* ---------- the one door ---------- */
function openAccess(){ openModal(accessModal()); }
function accessModal(err){
  if(S.role!=='view') return signedInModal();
  return `<h3>Unlock this device</h3>
    <p class="hint">Enter your PIN — referee or organiser — or the admin password.</p>
    ${err?`<div class="alert bad" style="margin-top:10px"><span>⚠</span><span>${esc(err)}</span></div>`:''}
    <label class="fl">PIN or password</label>
    <input type="password" id="accIn" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')tryAccess()">
    <div class="row" style="margin-top:16px">
      <button class="btn acc" style="flex:1" onclick="tryAccess()">Unlock</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
    <div class="alert ok" style="margin-top:14px"><span>ℹ</span><span>
      <b>Referee</b> enters and edits scores and runs the court console.<br>
      <b>Organiser</b> also edits groups and teams, prints and shares results.<br>
      <b>Admin</b> also sets up the event, the passwords and who sees what.</span></div>`;
}
async function tryAccess(){
  const v=document.getElementById('accIn').value;
  if(!v) return;
  if(await adminMatches(v)){
    S.role='admin';
    if(!S.adminHash){ S.adminHash=await hashPin(v); }   // pin down the shipped default
    save(); closeModal(); render(); toast('Admin mode — full control');
    if(sync.on) drainQueue(6);
    return;
  }
  const h=await hashPin(v);
  if(orgPinSet() && h===S.orgHash){
    S.role='organiser'; save(); closeModal(); render(); toast('Organiser mode');
    return;
  }
  if(scorerPinSet() && h===S.scorerHash){
    S.role='scorer'; save(); closeModal(); render(); toast('Referee mode — scores only');
    return;
  }
  openModal(accessModal(scorerPinSet()||orgPinSet()
    ? 'That PIN or password is not right.'
    : 'No PINs have been set yet. Use the admin password.'));
}
function roleBlurb(){
  if(isAdmin()) return 'This device can do everything: setup, scores, teams, printing, sharing, resets and the passwords.';

    (canExport()?', print':'')+(canShare()?', share images and WhatsApp summaries':'')+'. Setup and resets are the admin\'s.';
  return 'This device can enter and edit scores and run the court console. Everything else belongs to the organiser and admin.';
}
